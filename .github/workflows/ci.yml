# 검증 전용 CI — push:main 단독 트리거, 배포 동작 없음(REQ-CI-001).
# CD(deploy.yml, self-hosted NAS runner)는 이 워크플로의 workflow_run 완료 이벤트로만 트리거된다.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}  # 워크플로 전체 기본 권한 차단, job별 최소 권한 선언(REQ-SEC-001)

jobs:
  # --- compose 문법 검증 (REQ-CI-002) ---
  compose-config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare dummy .env + secret files
        # docker-compose.yml의 env_file 참조(.env.mysql/.env.redis/.env.common/.env.collector/.env.analyzer)는
        # 실제 파일 존재를 요구한다(compose config가 검증). 값은 비어 있어도 문법 검증엔 무관하다.
        # alertmanager/vector 등의 볼륨 마운트 소스 파일·top-level secrets 파일은 실측 확인 결과
        # `docker compose config -q`가 존재를 요구하지 않는다(문법+변수 참조 검증만 수행).
        run: |
          AAA_SSD_BASE="${GITHUB_WORKSPACE}/.ci-dummy/ssd"
          AAA_HDD_BASE="${GITHUB_WORKSPACE}/.ci-dummy/hdd"
          mkdir -p "$AAA_SSD_BASE/secrets"
          : > "$AAA_SSD_BASE/secrets/.env.mysql"
          : > "$AAA_SSD_BASE/secrets/.env.redis"
          : > "$AAA_SSD_BASE/secrets/.env.common"
          : > "$AAA_SSD_BASE/secrets/.env.collector"
          : > "$AAA_SSD_BASE/secrets/.env.analyzer"
          {
            echo "AAA_SSD_BASE=$AAA_SSD_BASE"
            echo "AAA_HDD_BASE=$AAA_HDD_BASE"
          } > "${GITHUB_WORKSPACE}/.env"

      - name: docker compose config -q
        run: docker compose config -q

  # --- vmalert 룰 유닛테스트 (REQ-CI-003, [HARD] 버전 일치 — compose 핀 파싱 위임) ---
  vmalert-unittest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run vmalert unittest shards (glob-delegated, count not hardcoded)
        # run-unittests.sh는 docker-compose.yml의 vmalert 이미지 태그를 grep -oP로 직접
        # 파싱하고(REQ-CI-008 [HARD] 버전 일치 자동 보장), rules_test_*.yaml glob으로 샤드를
        # 동적 수집한다(REQ-CI-003 shall not — 샤드 개수·이름 하드코딩 금지).
        working-directory: config/vmalert
        run: ./run-unittests.sh

  # --- alertmanager 설정 검증 (REQ-CI-004) ---
  amtool-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: amtool check-config (compose-pinned alertmanager version)
        # DP-2: amtool check-config는 alertmanager.yml의 bot_token_file/chat_id_file 경로
        # (/run/secrets/am_bot_token 등) 존재를 요구하지 않는다 — 문법·구조 검증만 수행한다
        # (실측 확인, 2026-07-12). 1차 시도가 실패할 경우에만 더미 시크릿 파일을 스텁해 재시도한다.
        run: |
          AM_TAG=$(grep -oP 'prom/alertmanager:\K\S+' docker-compose.yml | head -1)
          [ -n "$AM_TAG" ] || { echo "[FAIL] docker-compose.yml에서 alertmanager 이미지 태그를 찾을 수 없음"; exit 1; }
          IMG="prom/alertmanager:${AM_TAG}"

          run_amtool() {
            docker run --rm --entrypoint /bin/amtool \
              -v "$PWD/config/alertmanager/alertmanager.yml":/etc/alertmanager/alertmanager.yml:ro \
              "$1" \
              check-config /etc/alertmanager/alertmanager.yml
          }

          if run_amtool "$IMG"; then
            exit 0
          fi

          echo "[INFO] 1차 검증 실패 — 더미 시크릿 파일 스텁 후 재시도 (DP-2 fallback)"
          STUB_DIR="${GITHUB_WORKSPACE}/.ci-dummy/secrets"
          mkdir -p "$STUB_DIR"
          cp alertmanager.bot_token.example "$STUB_DIR/am_bot_token"
          cp alertmanager.chat_id.example "$STUB_DIR/am_chat_id"

          docker run --rm --entrypoint /bin/amtool \
            -v "$PWD/config/alertmanager/alertmanager.yml":/etc/alertmanager/alertmanager.yml:ro \
            -v "$STUB_DIR/am_bot_token":/run/secrets/am_bot_token:ro \
            -v "$STUB_DIR/am_chat_id":/run/secrets/am_chat_id:ro \
            "$IMG" \
            check-config /etc/alertmanager/alertmanager.yml

  # --- VictoriaMetrics scrape 설정 검증 (REQ-CI-005) ---
  vm-scrape-dryrun:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: VictoriaMetrics -dryRun (compose-pinned version)
        run: |
          VM_TAG=$(grep -oP 'victoriametrics/victoria-metrics:\K\S+' docker-compose.yml | head -1)
          [ -n "$VM_TAG" ] || { echo "[FAIL] docker-compose.yml에서 victoria-metrics 이미지 태그를 찾을 수 없음"; exit 1; }
          docker run --rm \
            -v "$PWD/config/victoriametrics/scrape.yml":/etc/victoriametrics/scrape.yml:ro \
            "victoriametrics/victoria-metrics:${VM_TAG}" \
            -promscrape.config=/etc/victoriametrics/scrape.yml -dryRun

  # --- vector 파이프라인 설정 검증 (REQ-CI-006) ---
  vector-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: vector validate --no-environment (compose-pinned version)
        run: |
          VECTOR_TAG=$(grep -oP 'timberio/vector:\K\S+' docker-compose.yml | head -1)
          [ -n "$VECTOR_TAG" ] || { echo "[FAIL] docker-compose.yml에서 vector 이미지 태그를 찾을 수 없음"; exit 1; }
          docker run --rm \
            -v "$PWD/config/vector/vector.yaml":/etc/vector/vector.yaml:ro \
            "timberio/vector:${VECTOR_TAG}" \
            validate --no-environment /etc/vector/vector.yaml

  # --- 셸 스크립트 정적 검사 (REQ-CI-007) ---
  shellcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck (scripts/*.sh, config/vmalert/*.sh)
        # -S warning: error+warning 등급을 게이트(info/style은 제외). 기존 스크립트의
        # SC2164(cd 실패 미처리)·SC2001(style)은 선행 커밋에서 정리 완료.
        # 이 두 디렉토리는 파일 간 source 관계가 없어 -x(cross-file 추적) 불필요.
        run: |
          shopt -s nullglob
          targets=(scripts/*.sh config/vmalert/*.sh)
          shopt -u nullglob
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "[FAIL] shellcheck 대상 스크립트를 찾을 수 없음"
            exit 1
          fi
          docker run --rm -v "$PWD":/mnt -w /mnt koalaman/shellcheck:stable -S warning "${targets[@]}"

      - name: shellcheck (.github/deploy/*.sh)
        # -x 필수: lib.sh를 여러 파일이 source하는 cross-file 구조라, 레포 루트에서
        # 다중 파일 글롭으로 실행하면 -x를 줘도 cross-file 변수 추적이 안 되는
        # shellcheck 한계가 있음(실측 확인, 2026-07-13) — 해당 디렉토리 안에서
        # 단일 글롭으로 실행해야 -x가 올바르게 동작한다.
        run: |
          shopt -s nullglob
          targets=(.github/deploy/*.sh)
          shopt -u nullglob
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "[SKIP] .github/deploy/*.sh 없음"
            exit 0
          fi
          cd .github/deploy
          docker run --rm -v "$PWD":/mnt -w /mnt koalaman/shellcheck:stable -S warning -x ./*.sh

  # --- CD reflect.sh 런타임 회귀 테스트 (SPEC-INFRA-CICD-003 REQ-CDF-009~011) ---
  # shellcheck는 정적 검사뿐이라 awk 구현체 차이로 생기는 런타임 결함을 못 잡는다.
  # NAS 배포 러너의 awk는 mawk 1.3.4이므로 이 job도 mawk로 reflect_test.sh를 실행한다
  # (macOS BSD awk에서만 통과하고 mawk에서 깨지는 회귀를 잡기 위함, 관련: aaa-infra#178).
  # lib_test.sh/rollback_test.sh/verify_test.sh 배선은 이 SPEC 범위 밖이다(REQ-CDF-014).
  deploy-reflect-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: reflect_test.sh (mawk 강제)
        run: |
          set -euo pipefail
          echo "[diag] 러너 기본 awk: $(command -v awk) -> $(readlink -f "$(command -v awk)")"
          if ! command -v mawk >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq mawk
          fi
          # 러너 기본 awk가 무엇이든 이 스텝 안에서는 PATH 앞쪽 shim으로 mawk를 강제한다.
          shim_dir="$RUNNER_TEMP/awk-shim"
          mkdir -p "$shim_dir"
          ln -sf "$(command -v mawk)" "$shim_dir/awk"
          export PATH="$shim_dir:$PATH"

          awk_path="$(command -v awk)"
          awk_real="$(readlink -f "$awk_path")"
          echo "[diag] 실행 awk: $awk_path -> $awk_real"
          echo "[diag] awk 버전: $(awk -W version 2>&1 | head -1)"
          case "$awk_real" in
            */mawk) ;;
            *) echo "[FAIL] awk가 mawk로 해석되지 않음: $awk_real"; exit 1 ;;
          esac
          # 카나리아: 이 mawk가 여전히 구간표현식을 리터럴로 처리하는지 확인한다. 매치되면
          # 러너 mawk가 바뀌어 이 job이 원래 회귀 유형을 더는 재현하지 못한다는 뜻이다.
          if printf '  abc:\n' | awk -v re='^  [a-z]\{1,\}:' '$0 ~ re { found=1 } END { exit !found }'; then
            echo "::warning::러너 mawk가 구간표현식을 해석함 — 이 job은 aaa-infra#178 유형 회귀를 재현하지 못할 수 있음"
          else
            echo "[diag] 카나리아: 구간표현식 미해석 확인(NAS mawk와 같은 동작)"
          fi

          bash .github/deploy/reflect_test.sh

  # --- required_status_checks 집계 (SPEC-INFRA-CICD-002 M3, REQ-014) ---
  # 4개 레포 main-protection 룰셋의 required_status_checks가 이 컨텍스트를 감시한다.
  # 개별 job 7개를 하나의 status로 묶어야 룰셋 설정이 7개 job명을 각각 추적하지 않아도 된다.
  status-check:
    needs: [compose-config, vmalert-unittest, amtool-check, vm-scrape-dryrun, vector-validate, shellcheck, deploy-reflect-test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: All required jobs succeeded
        run: echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success")'
