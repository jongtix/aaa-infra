# --- 공통 설정 ---
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# --- Networks ---
networks:
  aaa-network:
    driver: bridge
    ipam:
      config:
        # 서브넷 고정: Docker 기본 할당(172.17~19.x.x) 충돌 방지, NAS 멀티 스택 라우팅 안정성, iptables 규칙 불변
        # /24: ~6 컨테이너 대비 충분. 향후 스택은 172.21.0.0/24 이후 사용
        - subnet: 172.20.0.0/24

services:

  # --- MySQL ---
  mysql:
    image: mysql:8.4
    container_name: aaa-mysql
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: "1.0"
    env_file:
      - ${AAA_SSD_BASE}/secrets/.env.mysql
    ports:
      # 루프백 한정 바인딩(D-19, 2026-07-05 확정): NAS 자기 자신에서만 접근 가능.
      # LAN/외부는 여전히 미노출 — MacBook은 SSH 로컬 포트포워딩 터널로만 도달.
      # 10.3절 "DB/Redis 호스트 바인딩 금지" 원칙의 루프백 한정 예외.
      - "127.0.0.1:3306:3306"
    expose:
      - "3306"
    volumes:
      - ${AAA_SSD_BASE}/data/mysql:/var/lib/mysql
      - ${AAA_SSD_BASE}/config/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ${AAA_SSD_BASE}/config/mysql/initdb.d:/docker-entrypoint-initdb.d:ro
      - ${AAA_HDD_BASE}/logs/mysql:/var/log/mysql
    logging: *default-logging
    networks:
      - aaa-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # --- Redis ---
  redis:
    image: redis:8.10
    container_name: aaa-redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    env_file:
      - ${AAA_SSD_BASE}/secrets/.env.redis
    expose:
      - "6379"
    volumes:
      - ${AAA_SSD_BASE}/data/redis:/data
      - ${AAA_SSD_BASE}/config/redis/redis.conf:/etc/redis/redis.conf:ro
      - ${AAA_SSD_BASE}/config/redis/users.acl:/etc/redis/users.acl:ro
      - ${AAA_HDD_BASE}/logs/redis:/var/log/redis
    logging: *default-logging
    command: redis-server /etc/redis/redis.conf
    networks:
      - aaa-network
    healthcheck:
      # CMD-SHELL: redis-cli는 NOAUTH/LOADING에도 exit 0을 반환하므로 PONG 문자열 검증 필수 (docker-library/healthcheck 공식 패턴)
      # CMD-SHELL 보안 참고: 명령이 docker-compose.yml에 하드코딩되어 사용자 입력이 아니므로 Shell Injection 위험 없음.
      #   REDISCLI_AUTH 환경변수로 인증하므로 -a 플래그 미사용 → ps/프로세스 리스트에 비밀번호 비노출
      #   --user admin: redis-cli는 REDISCLI_AUTH_USER를 미지원하므로 --user 플래그로 명시
      test: ["CMD-SHELL", "[ \"$$(redis-cli -h 127.0.0.1 --user admin ping)\" = 'PONG' ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # --- Collector: 주식 시장 데이터 수집 ---
  collector:
    image: ${COLLECTOR_IMAGE:-ghcr.io/jongtix/aaa-collector:latest}
    container_name: aaa-collector
    restart: unless-stopped
    stop_grace_period: 40s
    # N100 4코어 기준(cpus 불변). memory는 30일 VM 실측 JVM 총사용 피크 ~560MiB(#119) + 성장 마진 반영해 1G로 1회 조정 완료
    # (더 이상 "초기값" 아님 — 실측 기반 튜닝값. cpus는 CPU 코어 수 무관 항목이라 RAM 증설과 별개로 유지).
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.5"
    env_file:
      - ${AAA_SSD_BASE}/secrets/.env.common
      - ${AAA_SSD_BASE}/secrets/.env.collector
    expose:
      - "8080"
    volumes:
      - ${AAA_HDD_BASE}/logs/aaa-collector:/var/log/aaa-collector
    logging: *default-logging
    networks:
      - aaa-network
    healthcheck:
      # CMD-SHELL (wget): 홈 NAS 환경(외부 인터넷 차단, Docker 내부 네트워크 격리)에서 wget/shell 공격 표면 위협이 낮아 현 방식 유지.
      #   distroless 이미지로 마이그레이션 시 wget 의존성 제거 필요.
      # --tries=1: wget 기본 재시도(3회)를 1회로 제한. docker compose --wait-timeout 180s를 wget 내부 재시도가 소진하는 것을 방지.
      test: ["CMD-SHELL", "wget -qO- --tries=1 http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # --- Analyzer: Phase 2 ML 분석/추론 서비스 (SPEC-ANALYZER-FOUNDATION-001, 스캐폴딩 단계) ---
  analyzer:
    image: ${ANALYZER_IMAGE:-ghcr.io/jongtix/aaa-analyzer:latest}
    container_name: aaa-analyzer
    restart: unless-stopped
    stop_grace_period: 40s
    # 스캐폴딩 단계(헬스체크 엔드포인트뿐), collector보다 보수적으로 낮게 설정. 실측 후 조정
    deploy:
      resources:
        limits:
          memory: 400M
          cpus: "0.5"
    # SPEC-ANALYZER-SCHEMA-001: analyzer/trainer 계정 신설 + DB 접속 배선(REQ-ASCH-041~044).
    # 실제 DB 연결 코드(SQLAlchemy 등)는 aaa-analyzer 레포 범위 밖 — 후속 ANALYZER-INFER-001에서 추가(REQ-ASCH-045).
    # SPEC-ANALYZER-TRAIN-AUTOMATION-001: WoL+SSH 원격 학습 디스패치에 필요한
    # TRAIN_AUTOMATION_* 11개 값(필수 10 + MOUNT_SCRIPT_PATH)은 .env.analyzer에
    # 함께 둔다(aaa-analyzer/.env.example 참고) — 디스패치 대상(맥북) SSH 호스트,
    # DB 터널 정보 등은 시크릿은 아니나 이미 이 파일이 서비스 전용 설정 파일로
    # 쓰이고 있어 별도 파일을 새로 만들지 않는다.
    env_file:
      - ${AAA_SSD_BASE}/secrets/.env.common
      - ${AAA_SSD_BASE}/secrets/.env.analyzer
    expose:
      - "8000"
    volumes:
      - ${AAA_HDD_BASE}/logs/aaa-analyzer:/var/log/aaa-analyzer
    # REQ-ATA-022: 디스패치 전용 SSH 프라이빗 키/known_hosts. alertmanager와
    # 동일 패턴(compose secrets — non-swarm은 mode를 무시하고 호스트 파일 권한을
    # 그대로 미러, [배포 실측 2026-06-20] 참조)이므로 호스트
    # ${AAA_SSD_BASE}/secrets/ssh/id_ed25519_analyzer_dispatch는 0600이어야
    # validate_private_key_permissions()가 통과한다(2026-08-12 실측 생성 —
    # NAS에 이미 존재). target 경로는 aaa-analyzer/.env.example의
    # TRAIN_AUTOMATION_SSH_KEY_PATH/KNOWN_HOSTS_PATH 기본값과 반드시 일치해야
    # 한다 — 컨테이너 내부 경로만 고정, 호스트 파일명은 자유.
    secrets:
      - source: analyzer_dispatch_key
        target: analyzer-dispatch-key
      - source: analyzer_dispatch_known_hosts
        target: analyzer-dispatch-known-hosts
    logging: *default-logging
    networks:
      - aaa-network
    # HEALTHCHECK는 이미지에 내장(Dockerfile, urllib 기반 /health 프로브) — 재정의 불필요
    depends_on:
      mysql:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # --- Notifier: Phase 3 알림 서비스 (SPEC-NOTIFIER-FOUNDATION-001, 스캐폴딩 단계) ---
  notifier:
    image: ${NOTIFIER_IMAGE:-ghcr.io/jongtix/aaa-notifier:latest}
    container_name: aaa-notifier
    restart: unless-stopped
    stop_grace_period: 40s
    # 스캐폴딩 단계(Redis 전용, DB 미접속), analyzer와 동일하게 보수적으로 낮게 설정. 실측 후 조정
    deploy:
      resources:
        limits:
          memory: 400M
          cpus: "0.5"
    # REDIS_APPUSER_USERNAME/PASSWORD 등은 서비스 간 공유 시크릿 — .env.common만 사용(TECHSPEC.md "Secrets 파일 범위").
    # .env.notifier는 이후 Phase의 DB 계정 + TELEGRAM_TRADE_BOT_TOKEN 전용(현 스캐폴딩 단계 미사용)
    env_file:
      - ${AAA_SSD_BASE}/secrets/.env.common
    expose:
      - "8080"
    volumes:
      - ${AAA_HDD_BASE}/logs/aaa-notifier:/var/log/aaa-notifier
    logging: *default-logging
    networks:
      - aaa-network
    healthcheck:
      # CMD-SHELL (wget): 홈 NAS 환경(외부 인터넷 차단, Docker 내부 네트워크 격리)에서 wget/shell 공격 표면 위협이 낮아 현 방식 유지.
      #   distroless 이미지로 마이그레이션 시 wget 의존성 제거 필요.
      # --tries=1: wget 기본 재시도(3회)를 1회로 제한. docker compose --wait-timeout 180s를 wget 내부 재시도가 소진하는 것을 방지.
      # /actuator/health/liveness(readiness 아님): Actuator health 그룹 분리(collector와 동일 이번 주 조치) — Redis 순단이
      #   readiness만 실패시키고 liveness는 UP 유지하도록 해 Docker 헬스체크가 컨테이너를 불필요하게 재시작하지 않게 함.
      test: ["CMD-SHELL", "wget -qO- --tries=1 http://localhost:8080/actuator/health/liveness | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # --- VictoriaMetrics: 수집 정상성 메트릭 스크랩/저장 (외부 판정 TSDB) ---
  victoriametrics:
    # [HARD] VM·vmalert 동일 버전 태그 고정. latest 금지(mysql 8.4·redis 8.8 선례).
    # [#139 핀 롤백] v1.148.0+는 vmalert-tool unittest의 time()이 epoch-0 시뮬레이션 시계에서
    # 호스트 벽시계로 바뀌는 업스트림 회귀로 CI 4개 샤드 실패(v1.149.0도 미수정 실측).
    # 업스트림 수정 릴리스 확인(probe_test.yaml 재검) 전까지 v1.147.0 고정 — dependabot 범프 자동수용 금지.
    image: victoriametrics/victoria-metrics:v1.147.0
    container_name: aaa-victoriametrics
    restart: unless-stopped
    # [D2 개정, #119] VM 512M: 단노드 통상 RSS 100~200M+에 TSDB merge/쿼리 스파이크·OOM 크래시루프 마진을
    #   RAM 32GB 기준으로 재산정(구 256M은 8GB 제약하 최소치). 30일 실측 피크 대비 여유 확대.
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    expose:
      # 8428 내부 전용(vmui/스크랩/쿼리). 호스트 미공개 — mysql/redis/collector와 동일 격리.
      - "8428"
    volumes:
      # [Correction 2] VM TSDB → HDD: 단노드 ~수백 시계열 @30s라 용량 미미, SSD 불필요.
      #   -retentionPeriod=3 기준 HDD 여유분 내 충분히 수용. 향후 상향도 HDD로 가능.
      - ${AAA_HDD_BASE}/data/victoriametrics:/victoria-metrics-data
      - ${AAA_SSD_BASE}/config/victoriametrics/scrape.yml:/etc/victoriametrics/scrape.yml:ro
    command:
      - "-promscrape.config=/etc/victoriametrics/scrape.yml"
      - "-storageDataPath=/victoria-metrics-data"
      # retentionPeriod 3개월: 침묵장애 감지엔 단기로 충분하나 M5 임계 튜닝이 다주(multi-week)
      #   분포를 보므로 분기치 보유. 시계열 ~수백개 @30s라 디스크 영향 미미.
      - "-retentionPeriod=3"
    logging: *default-logging
    networks:
      - aaa-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # [적용 2026-06-20] TI-009 라이브 헬스 검증(e2e firing 텔레그램 수신) 통과 후 적용. 데이터는 HDD 볼륨 마운트라 호환.
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      # wget -qO-: stdout 출력만(디스크 미기록) → read-only FS와도 호환. 이미지에 /bin/sh·wget 존재 확인됨.
      test: ["CMD-SHELL", "wget -qO- --tries=1 http://127.0.0.1:8428/health | grep -q OK"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # --- vmalert: VM 데이터로 룰 평가 → Alertmanager 통지 (외부 판정기) ---
  vmalert:
    # [HARD] VM과 동일 버전 태그 유지 — 같은 릴리스에서 함께 배포됨.
    # [#139 핀 롤백] 위 victoriametrics 주석 참조 — unittest time() 회귀로 v1.147.0 고정.
    image: victoriametrics/vmalert:v1.147.0
    container_name: aaa-vmalert
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 96M
          cpus: "0.25"
    expose:
      # 8880 vmalert 웹 UI(내부 전용).
      - "8880"
    volumes:
      - ${AAA_SSD_BASE}/config/vmalert/rules.yml:/etc/vmalert/rules.yml:ro
    command:
      - "-rule=/etc/vmalert/rules.yml"
      - "-datasource.url=http://aaa-victoriametrics:8428"
      - "-notifier.url=http://aaa-alertmanager:9093"
      # remoteWrite+remoteRead 함께 사용해야 재기동 간 alert/for: 상태가 영속·복원된다.
      #   remoteWrite만으로는 상태 시계열을 기록할 뿐 부팅 시 복원하지 않아
      #   CollectorGateUnset(for: 26h) 누산기가 vmalert 재기동마다 리셋되어 부팅-unset 감지가 무력화된다.
      - "-remoteWrite.url=http://aaa-victoriametrics:8428"
      - "-remoteRead.url=http://aaa-victoriametrics:8428"
    logging: *default-logging
    networks:
      - aaa-network
    depends_on:
      - victoriametrics
      - alertmanager
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # vmalert는 스테이트리스(rules.yml :ro 읽기 + HTTP 통신만) → 루트 FS 읽기전용 + /tmp만 tmpfs.
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      # vmalert /health → "OK". wget -qO- stdout만 사용해 read-only FS 호환.
      test: ["CMD-SHELL", "wget -qO- --tries=1 http://127.0.0.1:8880/health | grep -q OK"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # --- Alertmanager: 라우팅/억제 → 시스템봇(Telegram) 발송 ---
  alertmanager:
    image: prom/alertmanager:v0.33.1
    container_name: aaa-alertmanager
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 96M
          cpus: "0.25"
    environment:
      # 텔레그램 메시지 템플릿의 {{ .StartsAt.Local }} KST 렌더링용(이미지에 zoneinfo 포함 실측 2026-07-08).
      - TZ=Asia/Seoul
    expose:
      # 9093 Alertmanager API(내부 전용, vmalert notifier 대상).
      - "9093"
    volumes:
      - ${AAA_SSD_BASE}/config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # [Correction 2] AM 상태(nflog/silences) → HDD. TSDB급 쓰기 아니나 SSD 불필요.
      - ${AAA_HDD_BASE}/data/alertmanager:/alertmanager
    # [토큰 주입 — A안] Alertmanager는 config 내 $ENV 치환 미지원. compose 네이티브 secrets로
    #   값-전용 파일(secrets/alertmanager.{bot_token,chat_id})을 /run/secrets/* 에 마운트하고
    #   alertmanager.yml의 bot_token_file/chat_id_file이 직접 읽는다(entrypoint 무수정).
    #   compose secrets는 소스 파일 부재 시 명확히 실패하고 다른 시크릿을 노출하지 않으며,
    #   기본 0444로 마운트돼 nobody(65534)가 읽을 수 있다(bind-mount uid 처리 불요).
    #   이미지 기본 CMD(--config.file=/etc/alertmanager/alertmanager.yml --storage.path=/alertmanager)가
    #   본 마운트 경로와 일치하므로 entrypoint/command 오버라이드 불필요.
    # [배포 실측 2026-06-20] compose(non-swarm)는 secrets의 uid/gid/mode를 무시한다(기동 시 경고).
    #   → /run/secrets/* 는 호스트 파일 권한을 그대로 미러하므로, 호스트
    #     ${AAA_SSD_BASE}/secrets/alertmanager.{bot_token,chat_id}를 0644로 둬야
    #     nobody(65534) 실행 AM이 읽는다(0600이면 NOT_READABLE). secrets 디렉토리 700이 호스트 노출 차단.
    #   아래 uid/gid/mode는 Swarm 전용이라 현재 무효지만 의도 문서화 겸 유지.
    secrets:
      - source: am_bot_token
        uid: "65534"
        gid: "65534"
        mode: 0400
      - source: am_chat_id
        uid: "65534"
        gid: "65534"
        mode: 0400
    logging: *default-logging
    networks:
      - aaa-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # [적용 2026-06-20] TI-009 라이브 헬스 검증(e2e firing 텔레그램 수신) 통과 후 적용. 데이터는 HDD 볼륨 마운트라 호환.
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      # Alertmanager /-/healthy → "OK". 이미지에 /bin/sh·wget 존재 확인됨.
      test: ["CMD-SHELL", "wget -qO- --tries=1 http://127.0.0.1:9093/-/healthy | grep -q OK"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # --- VictoriaLogs: collector JSON ECS 로그 수집·저장·조회 (SPEC-OBSV-LOGS-001) ---
  victorialogs:
    # VictoriaLogs는 VictoriaMetrics 제품군이나 별도 버전 체계.
    # v1.52.0 distroless 버전 고정 (SPEC-OBSV-VLOGS-HEALTH-001 — healthcheck 제거로 대응).
    image: victoriametrics/victoria-logs:v1.52.0
    container_name: aaa-victorialogs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    expose:
      # 9428 내부 전용. 외부 접근은 SSH 터널(결정 A, §1.2). 호스트 포트 바인딩 금지.
      - "9428"
    volumes:
      - ${AAA_HDD_BASE}/data/victorialogs:/victoria-logs-data
    command:
      - "-retentionPeriod=90d"
      - "-storageDataPath=/victoria-logs-data"
    logging: *default-logging
    networks:
      - aaa-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # --- Vector: collector 로그 tail → VictoriaLogs 적재 (SPEC-OBSV-LOGS-001) ---
  vector:
    image: timberio/vector:0.57.0-debian
    container_name: aaa-vector
    restart: unless-stopped
    # APP_UID=1004: collector 로그 디렉토리(1004 소유, chmod 750) 읽기 권한 확보.
    # 권한 완화(chmod 확장) 대신 실행 UID로 읽기 권한을 확보하는 방식(REQ-007).
    user: "1004:1004"
    # group_add: ["1005"]: analyzer 로그 디렉토리(1005 소유, chmod 750) 읽기 권한을 보조그룹으로 확보.
    # 주 UID(1004:1004)는 불변 — analyzer 디렉토리의 chmod 완화·소유권 변경 없이 group_add만으로 접근한다
    # (SPEC-OBSV-LOGS-002 REQ-LOGS-016/017, DP-5. §3 Exclusion #8: vector 전용 UID 재설계는 범위 밖).
    group_add:
      - "1005"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    volumes:
      # 로그 읽기(읽기 전용): collector 로그 디렉토리. :ro — vector 장애가 collector에 무영향(REQ-018).
      - ${AAA_HDD_BASE}/logs/aaa-collector:/var/log/aaa-collector:ro
      # 로그 읽기(읽기 전용): analyzer 로그 디렉토리. :ro — vector 장애가 analyzer에 무영향(REQ-LOGS-014).
      - ${AAA_HDD_BASE}/logs/aaa-analyzer:/var/log/aaa-analyzer:ro
      # 체크포인트(쓰기 가능): vector가 마지막 읽은 위치를 기록해 재시작 시 중복 적재 방지.
      - ${AAA_HDD_BASE}/data/vector:/var/lib/vector
      # 파이프라인 설정(읽기 전용): IaC — 레포 커밋, 런타임 마운트.
      - ${AAA_SSD_BASE}/config/vector/vector.yaml:/etc/vector/vector.yaml:ro
    logging: *default-logging
    networks:
      - aaa-network
    depends_on:
      victorialogs:
        condition: service_started
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # --- node-exporter: NAS 호스트 자원(디스크·RAM·CPU) 메트릭 노출 (SPEC-INFRA-NODE-001) ---
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: aaa-node-exporter
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 48M
          cpus: "0.1"
    expose:
      # 9100 node_exporter 메트릭(내부 전용, VM 스크랩 대상).
      - "9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      # compose 이스케이프: $$ → 런타임 단일 $ (정규식 앵커 보존).
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    logging: *default-logging
    networks:
      - aaa-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # node_exporter는 /host/proc·/sys·/rootfs 읽기 전용 + 메트릭 HTTP 노출만 → 루트 FS read-only, tmpfs 불필요.
    read_only: true
    healthcheck:
      # v1.9.1은 /-/healthy 미제공(404). /metrics HTTP 200으로 대체(실측 확인).
      test: ["CMD-SHELL", "wget -q --spider --tries=1 http://127.0.0.1:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # --- cAdvisor: 컨테이너별 메모리·CPU 시계열 수집 (#119 §3 용량계획 검증) ---
  cadvisor:
    # [HARD] latest 금지(mysql 8.4·redis 8.8·VM/vmalert 선례). v0.53.0부터 registry가 ghcr.io/google/cadvisor로
    #   이전되어 gcr.io/cadvisor/cadvisor에는 더 이상 신규 태그가 없다 — gcr.io 기준 최종 안정 태그 v0.52.1 고정.
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: aaa-cadvisor
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # 최초 128M(alertmanager/vmalert 동급 사이드카 기준)은 NAS 실측으로 부족 확인 — 2026-07-28
          #   OOM kill(exitCode 137) 1회 발생, 재시작 직후에도 working set ~125MiB(97.8%)로 상한 재근접.
          #   실측 수요의 약 2배(limit ≈ 2×working set)로 상향해 컨테이너 증가·스크랩 스파이크 흡수.
          memory: 256M
          cpus: "0.25"
    # [하드닝, B안 개정 — NAS 라이브 검증 2026-07-26] 최초 B안(/var/run + /sys만)은 로컬(Docker Desktop,
    #   macOS)에서 정상 동작하는 것처럼 보였으나, 실제 NAS에서는 개별 aaa-* 컨테이너 지표가 전혀 잡히지 않고
    #   /sys만으로 보이는 호스트 전체 systemd cgroup만 노출되는 결과가 됐다(로컬 검증의 한계 — cAdvisor처럼
    #   호스트 파일시스템 구조에 결합된 도구는 반드시 실배포 환경에서 검증할 것).
    # [HARD] @docker same-path 마운트 필수 (UGOS 특이사항): cAdvisor는 docker info가 보고하는 데이터 루트
    #   경로 문자열을 자기 네임스페이스 안에서 그대로 연다. UGOS는 데이터 루트가 /var/lib/docker가 아니라
    #   /volume1/@docker로 커스텀되어 있어, 표준 /var/lib/docker:ro 마운트는 무의미하고(NAS의 /var/lib/docker는
    #   빈 디렉토리 — 실측) "failed to identify the read-write layer ID ...
    #   open /volume1/@docker/image/overlay2/layerdb/mounts/.../mount-id: no such file or directory"로 전 컨테이너
    #   식별에 실패한다. -docker_root 플래그는 deprecated(docker info 실패 시 fallback 전용)라 강제 불가.
    #   해법은 데몬 보고 경로를 동일 경로로 마운트하는 것뿐이다(공식 running.md의 /var/lib/docker:ro도 본질은
    #   same-path 마운트 — 기본 설치에서 데이터 루트가 마침 그 경로일 뿐). 2026-07-26 NAS 프로브 검증:
    #   이 마운트 추가만으로 aaa-* 12개 컨테이너 전부 name 라벨 정상 식별, 에러 로그 0건, privileged·cap_add 불요.
    #   트레이드오프: 전 컨테이너의 이미지 레이어·json 로그·볼륨 메타에 읽기 접근이 생긴다(사용자 승인,
    #   2026-07-26). /:/rootfs는 여전히 제외 — 호스트 루트 전체 read 권한은 부여하지 않는다는 원 결정 유지
    #   (대가: container_fs_* disk-usage 지표 결측, google/cadvisor#3252 graceful degradation).
    volumes:
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /volume1/@docker:/volume1/@docker:ro
    logging: *default-logging
    networks:
      - aaa-network
    expose:
      # 8080 내부 전용 — VictoriaMetrics가 aaa-network 경유로만 스크랩. 호스트 포트 미공개(사용자 명시 확정).
      - "8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # [검증 완료, 2026-07-26 NAS 실측] --privileged 없이, cap_add 추가 없이(cap_drop ALL 그대로)
    #   /var/run:rw + /sys:ro + /volume1/@docker:ro 3개 마운트로 기동·전 컨테이너 정상 스크랩 확인.
    #   SYS_PTRACE/DAC_READ_SEARCH 등 추가 capability 불필요.
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      # cAdvisor는 /healthz에서 "ok" 반환(실측 확인, 2026-07-26).
      test: ["CMD-SHELL", "wget -qO- --tries=1 http://127.0.0.1:8080/healthz | grep -q ok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# --- Secrets: Alertmanager Telegram 토큰 (값-전용 파일, 미커밋 NAS 런타임 시크릿) ---
# 각 파일 내용은 값만(KEY= 없음, 후행 개행 없이). 기존 시스템봇 TELEGRAM_SYSTEM_BOT_TOKEN/TELEGRAM_OPERATOR_CHAT_ID 값 재사용
# (신규 봇 발급 없음). 배포 전 NAS에 직접 배치 — scripts/init-nas.sh 안내 참조.
# 컨테이너 내부엔 /run/secrets/am_bot_token · /run/secrets/am_chat_id 로 마운트된다.
#
# --- Secrets: Analyzer 디스패치 전용 SSH 키/known_hosts (SPEC-ANALYZER-TRAIN-AUTOMATION-001, REQ-ATA-022) ---
# db_tunnel 키(trainer-tunnel-datagrip)와 별개의 신규 키페어(2026-08-12 생성,
# NAS ${AAA_SSD_BASE}/secrets/ssh/ 하위에 실측 확인) — NAS analyzer 컨테이너 →
# 맥북 SSH 디스패치 전용. 호스트 키 파일은 반드시 0600(파일 소유자만 읽기)이어야
# 한다 — compose secrets(non-swarm)는 mode를 무시하고 호스트 파일 권한을 그대로
# 미러하므로, aaa-analyzer의 validate_private_key_permissions()가 컨테이너
# 내부에서 그 권한을 그대로 검증한다. known_hosts는 맥북 SSH 호스트키 지문을
# ssh-keyscan으로 채집해 배치(REQ-ATA-022, StrictHostKeyChecking=no 금지).
# 컨테이너 내부엔 /run/secrets/analyzer-dispatch-key ·
# /run/secrets/analyzer-dispatch-known-hosts 로 마운트된다(target 고정,
# 호스트 파일명은 secrets/ssh/ 하위 관례를 그대로 따른다).
secrets:
  am_bot_token:
    file: ${AAA_SSD_BASE}/secrets/alertmanager.bot_token
  am_chat_id:
    file: ${AAA_SSD_BASE}/secrets/alertmanager.chat_id
  analyzer_dispatch_key:
    file: ${AAA_SSD_BASE}/secrets/ssh/id_ed25519_analyzer_dispatch
  analyzer_dispatch_known_hosts:
    file: ${AAA_SSD_BASE}/secrets/ssh/known_hosts_analyzer_dispatch
