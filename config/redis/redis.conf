# =============================================================================
# Redis 8.6 — AAA 프로젝트 커스텀 설정
# =============================================================================
# 마운트: ${AAA_SSD_BASE}/config/redis/redis.conf → /etc/redis/redis.conf:ro
# =============================================================================

# --- 네트워크 ---
port 6379
bind 0.0.0.0
protected-mode yes

# --- 메모리 (TECHSPEC 10.3절) ---
# maxmemory 128MB, 컨테이너 limit 256MB (AOF rewrite fork 대비 2배). RAM 32GB 업그레이드(#119, 2026-07-25)
# 이후에도 값 변경 없음 — 실측 사용량 18MB(limit 256MB 대비 7%, 2026-07-26 docker stats)로 이미 큰 여유가
# 있어 재산정 불필요.
maxmemory 128mb
maxmemory-policy allkeys-lru

# --- ACL (TECHSPEC 5절) ---
aclfile /etc/redis/users.acl

# --- 영속성: AOF-only (ADR-002) ---
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB 비활성화
save ""

# --- 로그 ---
loglevel notice
logfile /var/log/redis/redis.log

# --- 시간대 ---
# Redis 자체 시간대 설정 없음. 컨테이너 TZ=Asia/Seoul 환경변수로 처리 (.env.redis)