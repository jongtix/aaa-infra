# =============================================================================
# Redis 8.6 — AAA 프로젝트 커스텀 설정
# =============================================================================
# 마운트: ${AAA_SSD_BASE}/config/redis/redis.conf → /etc/redis/redis.conf:ro
# =============================================================================

# --- 네트워크 ---
port 6379
bind 0.0.0.0
protected-mode yes

# --- 메모리 (TECHSPEC 10.3절) ---
# NAS 8GB RAM 기준: maxmemory 128MB, 컨테이너 limit 256MB (AOF rewrite fork 대비 2배)
maxmemory 128mb
maxmemory-policy allkeys-lru

# --- ACL (TECHSPEC 5절) ---
aclfile /etc/redis/users.acl

# --- 영속성: AOF-only (ADR-002) ---
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB 비활성화
save ""

# --- 로그 ---
loglevel notice
logfile /var/log/redis/redis.log

# --- 시간대 ---
# Redis 자체 시간대 설정 없음. 컨테이너 TZ=Asia/Seoul 환경변수로 처리 (.env.redis)