# =============================================================================
# Alertmanager 라우팅 — 시스템봇(Telegram) PAGE/TICKET 2티어 라우팅
# SPEC-COLLECTOR-OBSV-001 TI-005 + TI-006 + TI-007 / SPEC-OBSV-WATERMARK-001 REQ-WM-025
# =============================================================================
# 런타임 마운트: ${AAA_SSD_BASE}/config/alertmanager/alertmanager.yml → /etc/alertmanager/alertmanager.yml:ro
#
# [토큰 미커밋 — A안] Alertmanager는 config YAML 내 $ENV 치환을 지원하지 않는다.
#   → docker-compose.yml의 compose 네이티브 secrets가 값-전용 파일
#     ${AAA_SSD_BASE}/secrets/alertmanager.{bot_token,chat_id}를 컨테이너에 마운트.
#   → bot_token_file/chat_id_file로 그 파일을 직접 읽는다(실값 미커밋, 경로만 기록).
#   파일 경로(컨테이너 내부, compose secrets 기본 마운트):
#     /run/secrets/am_bot_token   (호스트 파일 권한 미러 — 0644 필요, 아래 주의)
#     /run/secrets/am_chat_id     (호스트 파일 권한 미러 — 0644 필요, 아래 주의)
#   [배포 실측 2026-06-20] compose(non-swarm)는 secrets의 uid/gid/mode를 무시한다(기동 시 경고).
#     → /run/secrets/* 는 호스트 파일 권한을 그대로 미러하므로, 호스트
#       ${AAA_SSD_BASE}/secrets/alertmanager.{bot_token,chat_id}를 0644로 둬야
#       nobody(65534) 실행 AM이 읽는다(0600이면 NOT_READABLE). secrets 디렉토리 700이 호스트 노출 차단.
#
# [SPEC-OBSV-WATERMARK-001 REQ-WM-025] 모든 vmalert 알림은 rules.yml에서 `tier: PAGE|TICKET` 라벨을
#   부여받는다. 여기서는 동일한 텔레그램 봇(단일 채팅)으로 발송하되, tier 라벨로 receiver를 분기해
#   메시지 접두어만 구분한다(1인 운영 — 봇/채널 분리 없이 가독성만 확보).
#   route.receiver(기본값)는 안전망(tier 라벨 누락 시 폴백)이며, 정상 흐름에서는 항상 routes의 매처가 선반영된다.
#
# [메시지 표준 해부도, 2026-07-08] 접두어는 내부 용어(PAGE/TICKET/FIRING) 대신 한글 표기:
#   PAGE 발생=🚨 [긴급] / TICKET 발생=⚠️ [점검] / 해소(공통)=✅ [해소].
#   본문 = 알림별 「• 제목(볼드) (시작시각~)」 → 「상태: description」 → 「확인: action」(action은
#   rules.yml annotations의 선택 필드 — 없는 룰은 확인 줄이 렌더되지 않아 점진 도입 가능).
#   시작시각 {{ .StartsAt.Local }}은 AM 컨테이너 TZ를 따른다(KST 표기는 compose의 TZ=Asia/Seoul 전제).
#
# [재알림 주기 차등, 2026-07-08 확정] 상태 전이 1회 발송(REQ-052)이 기본 철학이고 ✅ 해소 알림이
#   이미 있으므로, repeat_interval은 "방치 방지 리마인더" 최소한으로만 둔다(기존 전역 4h는 DP5
#   보수 초기값 — 라이브 튜닝 전제였음). PAGE=12h(미복구 반나절 경과 시 1회 재촉, 하루 최대 2통),
#   TICKET=24h(발생 1통+해소 1통이 기본, 하루 넘게 방치 시에만 1회 리마인드).
#
# [이벤트형 resolved 억제, 2026-07-10 Family SM 확정] 카운터 증분(increase(...)>0) 룰은 발화 후
#   윈도우 소진으로 자동 resolve되어 대상이 여전히 비정상이어도 가짜 ✅ [해소]가 발송된다.
#   rules.yml에서 `notify: fire_only` 라벨을 부여한 룰(SM 3종·SD-1·BF-1/3/4/7)은 tier 매칭보다
#   먼저 별도 route로 분기해 send_resolved:false 리시버로 보낸다 — 발생 알림만 오고 해소는 오지 않음.

route:
  receiver: system-bot-telegram-ticket
  group_by: ["alertname", "batch"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 24h
  routes:
    # 이벤트형(fire_only) — resolved 억제. tier 매칭보다 먼저 평가되어야 하므로 최상단에 위치.
    - matchers:
        - tier = "PAGE"
        - notify = "fire_only"
      receiver: system-bot-telegram-page-fireonly
      repeat_interval: 12h
      continue: false
    - matchers:
        - tier = "TICKET"
        - notify = "fire_only"
      receiver: system-bot-telegram-ticket-fireonly
      repeat_interval: 24h
      continue: false
    # PAGE: CollectorDown, 데드맨, 일봉 워터마크 KRX/US, 국내·해외 틱 침묵, WebSocket 구독 0,
    #   안전모드 진입, NAS 디스크·RAM Critical — REQ-WM-025 최소 핵심셋(§8 결정 1+4, 2026-07-10 개정).
    - matchers:
        - tier = "PAGE"
      receiver: system-bot-telegram-page
      repeat_interval: 12h
      continue: false
    # TICKET: 나머지 전체(기본 경로이자 명시적 매치 둘 다 허용 — tier 라벨 누락 시 상위 route.receiver로 폴백).
    - matchers:
        - tier = "TICKET"
      receiver: system-bot-telegram-ticket
      repeat_interval: 24h
      continue: false

receivers:
  - name: system-bot-telegram-page
    telegram_configs:
      # send_resolved: 장애 발생 1회 + 복구(resolved) 1회 발송(REQ-052 상태 전이).
      - send_resolved: true
        # bot_token_file/chat_id_file: 실값 미커밋, compose secrets로 마운트된 값-전용 파일에서 로드.
        #   PAGE/TICKET 모두 동일 봇·동일 채팅으로 발송(1인 운영, 봇 분리 불필요) — 메시지 접두어로만 구분.
        bot_token_file: /run/secrets/am_bot_token
        chat_id_file: /run/secrets/am_chat_id
        parse_mode: HTML
        # parse_mode: HTML에서 summary/description의 <, >, & 가 Telegram HTML 파싱을 깨뜨려
        #   실제 알림이 무음 전송 실패할 수 있으므로 html 이스케이프를 적용한다(batch 라벨 등 동적값 방어).
        message: |
          {{ if eq .Status "firing" }}🚨 <b>[긴급]</b>{{ else }}✅ <b>[해소]</b>{{ end }}
          {{ range .Alerts }}• <b>{{ .Annotations.summary | html }}</b> ({{ .StartsAt.Local.Format "01-02 15:04" }}~)
          상태: {{ .Annotations.description | html }}{{ if .Annotations.action }}
          확인: {{ .Annotations.action | html }}{{ end }}
          {{ end }}

  - name: system-bot-telegram-ticket
    telegram_configs:
      - send_resolved: true
        bot_token_file: /run/secrets/am_bot_token
        chat_id_file: /run/secrets/am_chat_id
        parse_mode: HTML
        message: |
          {{ if eq .Status "firing" }}⚠️ <b>[점검]</b>{{ else }}✅ <b>[해소]</b>{{ end }}
          {{ range .Alerts }}• <b>{{ .Annotations.summary | html }}</b> ({{ .StartsAt.Local.Format "01-02 15:04" }}~)
          상태: {{ .Annotations.description | html }}{{ if .Annotations.action }}
          확인: {{ .Annotations.action | html }}{{ end }}
          {{ end }}

  - name: system-bot-telegram-page-fireonly
    telegram_configs:
      # 이벤트형(카운터 증분) — resolved 통지 억제(가짜 ✅해소 방지). 발생 알림만 발송.
      - send_resolved: false
        bot_token_file: /run/secrets/am_bot_token
        chat_id_file: /run/secrets/am_chat_id
        parse_mode: HTML
        message: |
          🚨 <b>[긴급]</b>
          {{ range .Alerts }}• <b>{{ .Annotations.summary | html }}</b> ({{ .StartsAt.Local.Format "01-02 15:04" }}~)
          상태: {{ .Annotations.description | html }}{{ if .Annotations.action }}
          확인: {{ .Annotations.action | html }}{{ end }}
          {{ end }}

  - name: system-bot-telegram-ticket-fireonly
    telegram_configs:
      - send_resolved: false
        bot_token_file: /run/secrets/am_bot_token
        chat_id_file: /run/secrets/am_chat_id
        parse_mode: HTML
        message: |
          ⚠️ <b>[점검]</b>
          {{ range .Alerts }}• <b>{{ .Annotations.summary | html }}</b> ({{ .StartsAt.Local.Format "01-02 15:04" }}~)
          상태: {{ .Annotations.description | html }}{{ if .Annotations.action }}
          확인: {{ .Annotations.action | html }}{{ end }}
          {{ end }}

# DP7 발송 실패 복원력(REQ-054): Alertmanager 내장 재시도(미복구 alert를 보류 상태로 유지하여
#   다음 평가/repeat_interval 주기에 자연 재시도) + 발송 실패 AM 로그에 기록. 영속 큐잉·보조 채널 미도입(후속).
