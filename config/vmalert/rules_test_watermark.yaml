# =============================================================================
# vmalert 룰 유닛테스트 — 워터마크(단주기) — 데드맨(W1)·커버리지(W4)·백필 이상 카운터형(W5 일부)·침묵 드롭(W7)
# SPEC-OBSV-WATERMARK-001 REQ-WM-016/018~020/022
# =============================================================================
# 실행(전체): ./run-unittests.sh          — 파일별 docker 병렬 실행(권장)
#   또는: vmalert-tool unittest --files='/rules/rules_test_*.yaml'  (순차, CWD=config/vmalert 마운트)
# 실행(이 파일만): docker run --rm -v "$PWD":/rules victoriametrics/vmalert-tool:v1.145.0 \
#     unittest --files=/rules/rules_test_watermark.yaml
# rule_files 는 본 파일 기준 상대경로(rules.yml = 같은 디렉토리).
#
# [장주기 분리] 신선도 즉시형(W2)·lag 허용형(W3)·백필 정체(BF-2~4)는 for: 4h~28h 지속시간
#   시뮬레이션이 필요해(음수 anchor 압축 불가 — expr에 time()이 없고 게이지 차+for 구조)
#   10m 그리드 전용 샤드 rules_test_watermark_slow.yaml로 이동(2026-07-13).
# [시간 모델] unittest의 time()은 eval_time(초, 0=epoch 기준)과 동일.
#   `+0xN` = 동일값 N+1개(30s 간격). 시리즈 길이는 eval_time 이상이어야 한다.
# [REQ-WM-025] 모든 alert에 tier(PAGE|TICKET) 라벨이 부여되므로 exp_labels에 tier를 명시한다
#   (누락 시 vmalert-tool이 라벨 불일치로 FAILED 처리).
# =============================================================================

rule_files:
  - rules.yml

evaluation_interval: 30s

tests:
  # ===========================================================================
  # 룰 W1: collector-watermark-deadman — REQ-WM-016 / AC-6
  # ===========================================================================
  # 시리즈 길이: 10m30s = 630s → N = 630/30 = 21

  # TI-WM-DM-001. [발화] daily-ohlcv-krx 시계열 소실(daily-ohlcv-us만 존재) → 10m 후 발화(단일 시리즈 소실).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_data_watermark_seconds{series="daily-ohlcv-us",market="overseas"}'
        values: '100000+0x21'
    alert_rule_test:
      - eval_time: 10m30s
        groupname: collector-watermark-deadman
        alertname: CollectorWatermarkSeriesMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              component: collector
              series: daily-ohlcv-krx
              tier: PAGE
            exp_annotations:
              summary: "국내/미국 일봉 워터마크 10분 이상 측정 안 됨"
              description: "데이터가 늦은 게 아니라, 최신 여부를 알려주는 계측값 자체가 사라짐 — 워터마크 계산 로직 이상 의심(REQ-WM-016)."
              action: "collector 로그에서 워터마크 관련 예외 확인. CollectorDown 알림이 없다면 프로세스 자체는 정상 동작 중"

  # TI-WM-DM-002. [무발화] daily-ohlcv-krx/us 둘 다 존재 → 미발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_data_watermark_seconds{series="daily-ohlcv-krx",market="domestic"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="daily-ohlcv-us",market="overseas"}'
        values: '100000+0x21'
    alert_rule_test:
      - eval_time: 10m30s
        groupname: collector-watermark-deadman
        alertname: CollectorWatermarkSeriesMissing
        exp_alerts: []

  # TI-WM-DM-003. [발화] 시계열 5종만 노출(사전 17종 미달) → count<17 10m 지속 후 발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_data_watermark_seconds{series="daily-ohlcv-krx",market="domestic"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="daily-ohlcv-us",market="overseas"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="investor-trend",market="domestic"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="credit-balance",market="domestic"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="short-sale-domestic",market="domestic"}'
        values: '100000+0x21'
    alert_rule_test:
      - eval_time: 10m30s
        groupname: collector-watermark-deadman
        alertname: CollectorWatermarkSeriesCountLow
        exp_alerts:
          - exp_labels:
              severity: critical
              component: collector
              tier: PAGE
            exp_annotations:
              summary: "일봉·환율·매매동향·공시 등 워터마크 시계열 개수 부족 — 5종만 측정"
              description: "총 17종 데이터 중 최신 데이터를 나타내는 워터마크가 5종만 측정되는 상태가 10분 이상 지속 — 특정 데이터 종류만 계산이 실패했을 가능성(REQ-WM-016)."
              action: "/actuator/prometheus에서 aaa_collector_data_watermark_seconds 조회 → 빠진 데이터 종류 식별"

  # TI-WM-DM-004. [무발화] 17종 전부 노출 → count==17, 미발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_data_watermark_seconds{series="daily-ohlcv-krx",market="domestic"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="daily-ohlcv-us",market="overseas"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="investor-trend",market="domestic"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="credit-balance",market="domestic"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="short-sale-domestic",market="domestic"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="short-sale-overseas-daily",market="overseas"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="short-sale-overseas-interest",market="overseas"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="market-usdkrw",market="domestic"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="market-vix",market="overseas"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="macro-ecos",market="domestic"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="macro-fred",market="overseas"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="analyst-estimates",market="domestic"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="disclosures",market="domestic"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="news-domestic",market="domestic"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="news-overseas",market="overseas"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="extended-hours-pre",market="overseas"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="extended-hours-after",market="overseas"}'
        values: '100000+0x21'
    alert_rule_test:
      - eval_time: 10m30s
        groupname: collector-watermark-deadman
        alertname: CollectorWatermarkSeriesCountLow
        exp_alerts: []

  # ===========================================================================
  # 룰 W2/W3(신선도 즉시형·lag 허용형) — rules_test_watermark_slow.yaml로 이동
  # (구 TI-WM-FR-001~012 / TI-WM-LAG-001~006. for: 4h~28h — 10m 그리드 샤드에서 검증)
  # ===========================================================================

  # ===========================================================================
  # 룰 W4: collector-watermark-coverage — REQ-WM-018 / AC-7
  # ===========================================================================
  # 시리즈 길이: 1h5m = 3900s → N = 130

  # [2026-07-10 Family D 확정] 국내/미국 2룰로 분할 — alertname을 시장별로 rename.
  # TI-WM-COV-001. [발화, D-1] daily-ohlcv-krx coverage=0.90(<0.95) 상시 → for:1h 후 발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_data_coverage_ratio{series="daily-ohlcv-krx"}'
        values: '0.90+0x131'
    alert_rule_test:
      - eval_time: 1h5m
        groupname: collector-watermark-coverage
        alertname: CollectorWatermarkCoverageLowDomestic
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
              series: daily-ohlcv-krx
              tier: TICKET
            exp_annotations:
              summary: "국내 일봉 일부 종목 누락"
              description: "감시 대상 국내 종목(주식+ETF) 중 최신 거래일 일봉이 적재된 비율이 90% — 기준 95% 미달 (하루 1회 19:35 계산이라 복구 후에도 다음 계산까지 알림이 남을 수 있음)(REQ-WM-018)."
              action: "domestic-daily 배치(평일 16:00) 로그에서 종목별 실패 확인 → daily_ohlcv에서 최신 거래일 빠진 국내 종목 조회"

  # TI-WM-COV-002. [무발화] daily-ohlcv-krx coverage=0.96(>=0.95) → 미발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_data_coverage_ratio{series="daily-ohlcv-krx"}'
        values: '0.96+0x131'
    alert_rule_test:
      - eval_time: 1h5m
        groupname: collector-watermark-coverage
        alertname: CollectorWatermarkCoverageLowDomestic
        exp_alerts: []

  # [SPEC-OBSV-WATERMARK-002 REQ-WM2-005/011] D-2 expr 자체는 불변 — 분모 기준일 후퇴는 collector 측
  #   CoverageRefresher.refreshUsCoverage()에서 이미 처리됨(M1 배포 완료). 이 룰 테스트는 합성 비율 값만
  #   검증하므로 게이지 소스가 바뀌어도 시나리오 변경 불필요.
  # TI-WM-COV-003. [발화, D-2] daily-ohlcv-us coverage=0.90(<0.95) 상시 → for:1h 후 발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_data_coverage_ratio{series="daily-ohlcv-us"}'
        values: '0.90+0x131'
    alert_rule_test:
      - eval_time: 1h5m
        groupname: collector-watermark-coverage
        alertname: CollectorWatermarkCoverageLowOverseas
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
              series: daily-ohlcv-us
              tier: TICKET
            exp_annotations:
              summary: "미국 일봉 일부 종목 누락"
              description: "감시 대상 미국 종목(주식+ETF) 중 최신 거래일 일봉이 적재된 비율이 90% — 기준 95% 미달 (하루 1회 10:00 계산이라 복구 후에도 다음 계산까지 알림이 남을 수 있음)(REQ-WM-018)."
              action: "overseas-daily 배치(평일 16:30 ET) 로그에서 종목별 실패 확인 → daily_ohlcv에서 최신 거래일 빠진 해외 종목 조회"

  # ===========================================================================
  # 룰 W5: collector-backfill-anomaly — REQ-WM-019(clamp) / AC-8
  # (BF-2 정체 3건(구 TI-WM-BF-002~004)은 26h increase 윈도우 — rules_test_watermark_slow.yaml로 이동)
  # ===========================================================================

  # TI-WM-BF-001. [발화, BF-1, notify=fire_only] clamp_suspected_total 5분 내 증가 → CollectorBackfillClampSuspected 발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_backfill_clamp_suspected_total'
        values: '0+0x10 1+0x5'
    alert_rule_test:
      - eval_time: 330s
        groupname: collector-backfill-anomaly
        alertname: CollectorBackfillClampSuspected
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
              tier: TICKET
              notify: fire_only
            exp_annotations:
              summary: "백필 응답 잘림 의심 — 조기 완료 오판 위험"
              description: "최근 1시간 내 KIS 응답이 캡에 걸려 잘린 정황 감지 — 과거 구간이 덜 채워졌는데 완료로 오판했을 수 있음(REQ-WM-019)."
              action: "collector 로그(백필 크론, 매일 02:00 KST·주말 +5회)에서 clamp 의심 종목 확인 → backfill_status 진행점 대조"

  # TI-WM-BF-005. [발화] early_completion_suspect_total 5분 내 증가 → CollectorBackfillEarlyCompletionSuspect 발화
  # (REQ-BACKFILL-157/-158).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_backfill_early_completion_suspect_total'
        values: '0+0x10 1+0x5'
    alert_rule_test:
      - eval_time: 330s
        groupname: collector-backfill-anomaly
        alertname: CollectorBackfillEarlyCompletionSuspect
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
              tier: TICKET
              notify: fire_only
            exp_annotations:
              summary: "백필 조기 완료 차단 — 과거 데이터 잔존 발견"
              description: "완료 직전 확인 프로브가 \"아직 데이터가 남아 있음\"을 발견해 완료 처리를 차단 — 차단 자체는 정상 방어 동작이나, 반복되면 KIS 응답 이상 의심(REQ-BACKFILL-157)."
              action: "collector 로그(확인 프로브 차단 종목) → 다음 사이클에서 해당 종목 진행 재개 여부 확인"

  # TI-WM-BF-006. [무발화] early_completion_suspect_total 무증가 → 미발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_backfill_early_completion_suspect_total'
        values: '0+0x131'
    alert_rule_test:
      - eval_time: 1h5m
        groupname: collector-backfill-anomaly
        alertname: CollectorBackfillEarlyCompletionSuspect
        exp_alerts: []

  # TI-WM-BF-007. [발화] anomaly_failed_total 5분 내 증가 → CollectorBackfillAnomalyFailed 발화
  # (REQ-BACKFILL-146b/-158).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_backfill_anomaly_failed_total'
        values: '0+0x10 1+0x5'
    alert_rule_test:
      - eval_time: 330s
        groupname: collector-backfill-anomaly
        alertname: CollectorBackfillAnomalyFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
              tier: TICKET
              notify: fire_only
            exp_annotations:
              summary: "백필 이상 종결(FAILED) — 수동 조사 필요"
              description: "이상 응답(건수는 있는데 진행점 해석 불가)이 반복돼 해당 종목 백필이 FAILED로 종결됨 — 자동 재시도 없음, 방치 시 그 종목 과거 데이터 영구 미완(REQ-BACKFILL-146b)."
              action: "collector 로그(FAILED 종결 종목·사유) → backfill_status FAILED 행 조회 → 원인 조사 후 수동 리셋 판단"

  # TI-WM-BF-008. [무발화] anomaly_failed_total 무증가 → 미발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_backfill_anomaly_failed_total'
        values: '0+0x131'
    alert_rule_test:
      - eval_time: 1h5m
        groupname: collector-backfill-anomaly
        alertname: CollectorBackfillAnomalyFailed
        exp_alerts: []

  # TI-WM-BF-009. [발화] below_floor_stocks{series=daily-ohlcv-krx}=3(>0) 상시 → for:1h 후 발화(REQ-BACKFILL-154/-158).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_backfill_below_floor_stocks{series="daily-ohlcv-krx",market="domestic"}'
        values: '3+0x131'
    alert_rule_test:
      - eval_time: 1h5m
        groupname: collector-backfill-anomaly
        alertname: CollectorBackfillBelowFloor
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
              series: daily-ohlcv-krx
              market: domestic
              tier: TICKET
            exp_annotations:
              summary: "백필 과거 데이터 하한 미달 — daily-ohlcv-krx 3종목"
              description: "기대 최과거일까지 채워지지 않은 종목 존재 (하루 1회 계산이라 복구 후에도 다음 계산까지 알림이 남을 수 있음)(REQ-BACKFILL-154)."
              action: "collector 로그(밀도 게이지 계산) → 감지 SQL(remediation-targets.md)로 대상 종목 조회"

  # TI-WM-BF-010. [무발화] below_floor_stocks=0 → 미발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_backfill_below_floor_stocks{series="daily-ohlcv-krx",market="domestic"}'
        values: '0+0x131'
    alert_rule_test:
      - eval_time: 1h5m
        groupname: collector-backfill-anomaly
        alertname: CollectorBackfillBelowFloor
        exp_alerts: []

  # TI-WM-BF-011. [발화] internal_gap_stocks{series=daily-ohlcv-us}=2(>0) 상시 → for:1h 후 발화(REQ-BACKFILL-155/-158).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_backfill_internal_gap_stocks{series="daily-ohlcv-us",market="overseas"}'
        values: '2+0x131'
    alert_rule_test:
      - eval_time: 1h5m
        groupname: collector-backfill-anomaly
        alertname: CollectorBackfillInternalGap
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
              series: daily-ohlcv-us
              market: overseas
              tier: TICKET
            exp_annotations:
              summary: "백필 과거 데이터 내부 구멍 — daily-ohlcv-us 2종목"
              description: "보유 구간 중간에 캘린더상 있어야 할 거래일이 빠진 종목 존재 (하루 1회 계산이라 복구 후에도 다음 계산까지 알림이 남을 수 있음)(REQ-BACKFILL-155)."
              action: "collector 로그(밀도 게이지 계산) → 감지 SQL(remediation-targets.md)로 대상 종목 조회"

  # TI-WM-BF-012. [무발화] internal_gap_stocks=0 → 미발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_backfill_internal_gap_stocks{series="daily-ohlcv-us",market="overseas"}'
        values: '0+0x131'
    alert_rule_test:
      - eval_time: 1h5m
        groupname: collector-backfill-anomaly
        alertname: CollectorBackfillInternalGap
        exp_alerts: []

  # TI-WM-BF-013. [발화, BF-7 신설, notify=fire_only] cap_saturated_total 5분 내 증가 →
  #   CollectorBackfillCapSaturated 발화(REQ-GC-013, 2026-07-10 신설).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_backfill_cap_saturated_total'
        values: '0+0x10 1+0x5'
    alert_rule_test:
      - eval_time: 330s
        groupname: collector-backfill-anomaly
        alertname: CollectorBackfillCapSaturated
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
              tier: TICKET
              notify: fire_only
            exp_annotations:
              summary: "백필 100행 캡 포화 — 액면교체 FAILED 종단"
              description: "국내 액면교체 백필 응답이 100행 캡에 도달 — 절단 의심으로 해당 종목 FAILED 종단, 자동 재시도 없음 (설계상 도달 거의 불가한 안전밸브 — 발생 자체가 조사 대상)(REQ-GC-013)."
              action: "collector 로그(백필 크론, 매일 02:00 KST·주말 +5회) → backfill_status FAILED 행 last_error 확인 후 수동 조사"

  # TI-WM-BF-014. [무발화] cap_saturated_total 무증가 → 미발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_backfill_cap_saturated_total'
        values: '0+0x131'
    alert_rule_test:
      - eval_time: 1h5m
        groupname: collector-backfill-anomaly
        alertname: CollectorBackfillCapSaturated
        exp_alerts: []

  # ===========================================================================
  # 룰 W7: collector-silent-drops — REQ-WM-022
  # ===========================================================================

  # TI-WM-SD-001. [발화] silent_drops_total 5분 내 증가 → CollectorSilentDropsDetected 발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_silent_drops_total'
        values: '0+0x10 1+0x5'
    alert_rule_test:
      - eval_time: 330s
        groupname: collector-silent-drops
        alertname: CollectorSilentDropsDetected
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
              tier: TICKET
              notify: fire_only
            exp_annotations:
              summary: "수집 데이터 행 침묵 유실 감지"
              description: "최근 1시간 내 INSERT 단계에서 중복이 아닌 사유(형식 오류·절단·제약 위반)로 조용히 버려진 행 발생 — 저장됐어야 할 데이터가 유실됨(REQ-WM-022)."
              action: "collector 로그(침묵 드롭 WARN — 테이블·에러코드·행) → 해당 테이블·원본 대조. 로그 미발견 시 VM 카운터 증가 시각으로 배치 식별"

  # TI-WM-SD-002. [무발화] silent_drops_total 변화 없음 → 미발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_silent_drops_total'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 330s
        groupname: collector-silent-drops
        alertname: CollectorSilentDropsDetected
        exp_alerts: []
