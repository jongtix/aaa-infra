# =============================================================================
# vmalert 룰 유닛테스트 — 워터마크 — 데드맨(W1)·신선도 즉시형(W2)·lag 허용형(W3)·커버리지(W4)·백필 이상(W5)·침묵 드롭(W7)
# SPEC-OBSV-WATERMARK-001 REQ-WM-016~020/022
# =============================================================================
# 실행(전체): ./run-unittests.sh          — 파일별 docker 병렬 실행(권장)
#   또는: vmalert-tool unittest --files='/rules/rules_test_*.yaml'  (순차, CWD=config/vmalert 마운트)
# 실행(이 파일만): docker run --rm -v "$PWD":/rules victoriametrics/vmalert-tool:v1.145.0 \
#     unittest --files=/rules/rules_test_watermark.yaml
# rule_files 는 본 파일 기준 상대경로(rules.yml = 같은 디렉토리).
#
# [시간 모델] unittest의 time()은 eval_time(초, 0=epoch 기준)과 동일.
#   "X시간 경과"는 last_update 계열을 0으로 두고 eval_time 을 X시간보다 크게 잡아 재현한다.
#   `+0xN` = 동일값 N+1개(30s 간격). 시리즈 길이는 eval_time 이상이어야 한다.
# [REQ-WM-025] 모든 alert에 tier(PAGE|TICKET) 라벨이 부여되므로 exp_labels에 tier를 명시한다
#   (누락 시 vmalert-tool이 라벨 불일치로 FAILED 처리).
# =============================================================================

rule_files:
  - rules.yml

evaluation_interval: 30s

tests:
  # ===========================================================================
  # 룰 W1: collector-watermark-deadman — REQ-WM-016 / AC-6
  # ===========================================================================
  # 시리즈 길이: 10m30s = 630s → N = 630/30 = 21

  # TI-WM-DM-001. [발화] daily-ohlcv-krx 시계열 소실(daily-ohlcv-us만 존재) → 10m 후 발화(단일 시리즈 소실).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_data_watermark_seconds{series="daily-ohlcv-us",market="overseas"}'
        values: '100000+0x21'
    alert_rule_test:
      - eval_time: 10m30s
        groupname: collector-watermark-deadman
        alertname: CollectorWatermarkSeriesMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              component: collector
              series: daily-ohlcv-krx
              tier: PAGE
            exp_annotations:
              summary: "국내/미국 일봉 워터마크 10분 이상 측정 안 됨"
              description: "데이터가 늦은 게 아니라, 최신 여부를 알려주는 계측값 자체가 사라짐 — 워터마크 계산 로직 이상 의심(REQ-WM-016)."
              action: "collector 로그에서 워터마크 관련 예외 확인. CollectorDown 알림이 없다면 프로세스 자체는 정상 동작 중"

  # TI-WM-DM-002. [무발화] daily-ohlcv-krx/us 둘 다 존재 → 미발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_data_watermark_seconds{series="daily-ohlcv-krx",market="domestic"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="daily-ohlcv-us",market="overseas"}'
        values: '100000+0x21'
    alert_rule_test:
      - eval_time: 10m30s
        groupname: collector-watermark-deadman
        alertname: CollectorWatermarkSeriesMissing
        exp_alerts: []

  # TI-WM-DM-003. [발화] 시계열 5종만 노출(사전 17종 미달) → count<17 10m 지속 후 발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_data_watermark_seconds{series="daily-ohlcv-krx",market="domestic"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="daily-ohlcv-us",market="overseas"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="investor-trend",market="domestic"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="credit-balance",market="domestic"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="short-sale-domestic",market="domestic"}'
        values: '100000+0x21'
    alert_rule_test:
      - eval_time: 10m30s
        groupname: collector-watermark-deadman
        alertname: CollectorWatermarkSeriesCountLow
        exp_alerts:
          - exp_labels:
              severity: critical
              component: collector
              tier: PAGE
            exp_annotations:
              summary: "일봉·환율·매매동향·공시 등 워터마크 시계열 개수 부족 — 5종만 측정"
              description: "총 17종 데이터 중 최신 데이터를 나타내는 워터마크가 5종만 측정되는 상태가 10분 이상 지속 — 특정 데이터 종류만 계산이 실패했을 가능성(REQ-WM-016)."
              action: "/actuator/prometheus에서 aaa_collector_data_watermark_seconds 조회 → 빠진 데이터 종류 식별"

  # TI-WM-DM-004. [무발화] 17종 전부 노출 → count==17, 미발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_data_watermark_seconds{series="daily-ohlcv-krx",market="domestic"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="daily-ohlcv-us",market="overseas"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="investor-trend",market="domestic"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="credit-balance",market="domestic"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="short-sale-domestic",market="domestic"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="short-sale-overseas-daily",market="overseas"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="short-sale-overseas-interest",market="overseas"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="market-usdkrw",market="domestic"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="market-vix",market="overseas"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="macro-ecos",market="domestic"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="macro-fred",market="overseas"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="analyst-estimates",market="domestic"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="disclosures",market="domestic"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="news-domestic",market="domestic"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="news-overseas",market="overseas"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="extended-hours-pre",market="overseas"}'
        values: '100000+0x21'
      - series: 'aaa_collector_data_watermark_seconds{series="extended-hours-after",market="overseas"}'
        values: '100000+0x21'
    alert_rule_test:
      - eval_time: 10m30s
        groupname: collector-watermark-deadman
        alertname: CollectorWatermarkSeriesCountLow
        exp_alerts: []

  # ===========================================================================
  # 룰 W2: collector-watermark-freshness-immediate — REQ-WM-017 즉시형 / AC-2 / AC-3
  # ===========================================================================
  # 시리즈 길이: 4h5m = 14700s → N = 14700/30 = 490

  # [2026-07-10 Family B 확정] 시리즈별 9룰로 분할 — alertname을 시리즈별로 rename.
  # TI-WM-FR-001. [발화, PAGE, B-1] daily-ohlcv-krx: expected-watermark diff=10000(>0) 상시 → 4h 지속 후 발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_expected_watermark_seconds{market="domestic"}'
        values: '100000+0x491'
      - series: 'aaa_collector_data_watermark_seconds{series="daily-ohlcv-krx",market="domestic"}'
        values: '90000+0x491'
    alert_rule_test:
      - eval_time: 4h5m
        groupname: collector-watermark-freshness-immediate
        alertname: CollectorWatermarkFreshnessStaleDomesticDaily
        exp_alerts:
          - exp_labels:
              severity: critical
              component: collector
              series: daily-ohlcv-krx
              market: domestic
              tier: PAGE
            exp_annotations:
              summary: "국내 일봉 갱신 지연"
              description: "장 마감 후 4시간이 지나도 최신 거래일까지 적재되지 않음 — 기대 대비 2h 46m 40s 뒤처짐(REQ-WM-017 즉시형, PAGE)."
              action: "domestic-daily 배치(평일 16:00) 로그 → daily_ohlcv 최근 거래일 조회"

  # TI-WM-FR-002. [무발화, for 미충족] 동일 조건이나 eval_time=3h55m(< 4h) → 미발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_expected_watermark_seconds{market="domestic"}'
        values: '100000+0x475'
      - series: 'aaa_collector_data_watermark_seconds{series="daily-ohlcv-krx",market="domestic"}'
        values: '90000+0x475'
    alert_rule_test:
      - eval_time: 3h55m
        groupname: collector-watermark-freshness-immediate
        alertname: CollectorWatermarkFreshnessStaleDomesticDaily
        exp_alerts: []

  # TI-WM-FR-003. [무발화, diff==0] expected==watermark(휴장일 등 정상 동기) → 4h5m 경과해도 미발화(AC-3).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_expected_watermark_seconds{market="domestic"}'
        values: '100000+0x491'
      - series: 'aaa_collector_data_watermark_seconds{series="daily-ohlcv-krx",market="domestic"}'
        values: '100000+0x491'
    alert_rule_test:
      - eval_time: 4h5m
        groupname: collector-watermark-freshness-immediate
        alertname: CollectorWatermarkFreshnessStaleDomesticDaily
        exp_alerts: []

  # TI-WM-FR-004. [발화, TICKET 4h, B-4] investor-trend diff>0 상시 → 4h 지속 후 발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_expected_watermark_seconds{market="domestic"}'
        values: '100000+0x491'
      - series: 'aaa_collector_data_watermark_seconds{series="investor-trend",market="domestic"}'
        values: '90000+0x491'
    alert_rule_test:
      - eval_time: 4h5m
        groupname: collector-watermark-freshness-immediate
        alertname: CollectorWatermarkFreshnessStaleInvestorTrend
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
              series: investor-trend
              market: domestic
              tier: TICKET
            exp_annotations:
              summary: "투자자별 매매동향 갱신 지연"
              description: "장 마감 후 4시간이 지나도 당일 수급 데이터가 적재되지 않음 — 기대 대비 2h 46m 40s 뒤처짐(REQ-WM-017 즉시형)."
              action: "domestic-supply-investor 배치(평일 16:00 일봉 체인 후속) 로그 → investor_trend 최근 일자 조회"

  # TI-WM-FR-005. [발화, TICKET 17h30m, B-8] disclosures diff>0 상시 → for:17h30m 지속 후 발화(8h→17h30m 개정 검증).
  # 시리즈 길이: 17h35m = 63300s → N = 63300/30 = 2110
  - interval: 30s
    input_series:
      - series: 'aaa_collector_expected_watermark_seconds{market="domestic"}'
        values: '100000+0x2111'
      - series: 'aaa_collector_data_watermark_seconds{series="disclosures",market="domestic"}'
        values: '90000+0x2111'
    alert_rule_test:
      - eval_time: 17h35m
        groupname: collector-watermark-freshness-immediate
        alertname: CollectorWatermarkFreshnessStaleDisclosures
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
              series: disclosures
              market: domestic
              tier: TICKET
            exp_annotations:
              summary: "DART 공시 수집 지연"
              description: "장 마감 후 다음 날 아침(09:00)까지 당일 공시가 적재되지 않음 — 기대 대비 2h 46m 40s 뒤처짐(REQ-WM-017 즉시형)."
              action: "DART 폴링(평일 22:00) 로그 → disclosures 최근 접수일자 조회"

  # TI-WM-FR-006. [무발화, for 미충족] disclosures 동일 조건 eval_time=17h25m(< 17h30m) → 미발화(8h 구식 임계였다면 발화했을 케이스).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_expected_watermark_seconds{market="domestic"}'
        values: '100000+0x2101'
      - series: 'aaa_collector_data_watermark_seconds{series="disclosures",market="domestic"}'
        values: '90000+0x2101'
    alert_rule_test:
      - eval_time: 17h25m
        groupname: collector-watermark-freshness-immediate
        alertname: CollectorWatermarkFreshnessStaleDisclosures
        exp_alerts: []

  # TI-WM-FR-007. [발화, TICKET 28h, B-9] market-vix diff>0 상시 → for:28h 지속 후 발화(24h→28h 개정 검증).
  # 시리즈 길이: 28h5m = 101100s → N = 101100/30 = 3370
  - interval: 30s
    input_series:
      - series: 'aaa_collector_expected_watermark_seconds{market="overseas"}'
        values: '100000+0x3371'
      - series: 'aaa_collector_data_watermark_seconds{series="market-vix",market="overseas"}'
        values: '90000+0x3371'
    alert_rule_test:
      - eval_time: 28h5m
        groupname: collector-watermark-freshness-immediate
        alertname: CollectorWatermarkFreshnessStaleVix
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
              series: market-vix
              market: overseas
              tier: TICKET
            exp_annotations:
              summary: "VIX 갱신 지연"
              description: "미국 정규장 마감 후 다음 날 아침(09:00, 동절기 10:00)까지 VIX가 적재되지 않음 — 기대 대비 2h 46m 40s 뒤처짐(REQ-WM-017 즉시형)."
              action: "market-indicators 배치(평일 17:00) 로그에서 CBOE→FRED→Yahoo 폴백 순서 확인 → market_indicators에서 VIX 최근 일자 조회"

  # TI-WM-FR-008. [무발화, for 미충족] market-vix 동일 조건 eval_time=27h55m(< 28h) → 미발화(24h 구식 임계였다면 발화했을 케이스).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_expected_watermark_seconds{market="overseas"}'
        values: '100000+0x3361'
      - series: 'aaa_collector_data_watermark_seconds{series="market-vix",market="overseas"}'
        values: '90000+0x3361'
    alert_rule_test:
      - eval_time: 27h55m
        groupname: collector-watermark-freshness-immediate
        alertname: CollectorWatermarkFreshnessStaleVix
        exp_alerts: []

  # ===========================================================================
  # 룰 W3: collector-watermark-freshness-lag — REQ-WM-017 lag 허용형
  # [2026-07-10 Family C 확정] 시리즈별 4룰로 분할, for 09:00 정렬 조정(C-1/C-3/C-4 1h→17h30m,
  #   C-2 1h→4h) — alertname을 시리즈별로 rename.
  # ===========================================================================
  # 시리즈 길이: 17h35m = 63300s → N = 63300/30 = 2110

  # TI-WM-LAG-001. [발화, C-1] credit-balance diff=600000s(>6d=518400s) 상시 → for:17h30m 후 발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_expected_watermark_seconds{market="domestic"}'
        values: '700000+0x2111'
      - series: 'aaa_collector_data_watermark_seconds{series="credit-balance",market="domestic"}'
        values: '100000+0x2111'
    alert_rule_test:
      - eval_time: 17h35m
        groupname: collector-watermark-freshness-lag
        alertname: CollectorWatermarkFreshnessLagCreditBalance
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
              series: credit-balance
              market: domestic
              tier: TICKET
            exp_annotations:
              summary: "국내 신용잔고 수집 지연"
              description: "지연 허용치(6일)를 넘어서도 적재되지 않음 — 기대 대비 6d 22h 40m 0s 뒤처짐 (정상 공표 지연 3영업일)(REQ-WM-017 lag 허용형)."
              action: "domestic-supply-credit-balance 배치(평일 16:00 일봉 체인 후속) 로그 → credit_balance 최근 일자 조회"

  # TI-WM-LAG-002. [무발화] credit-balance diff=500000s(<6d=518400s, 정당 지연 범위) → 미발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_expected_watermark_seconds{market="domestic"}'
        values: '600000+0x2111'
      - series: 'aaa_collector_data_watermark_seconds{series="credit-balance",market="domestic"}'
        values: '100000+0x2111'
    alert_rule_test:
      - eval_time: 17h35m
        groupname: collector-watermark-freshness-lag
        alertname: CollectorWatermarkFreshnessLagCreditBalance
        exp_alerts: []

  # TI-WM-LAG-003. [무발화, for 미충족] credit-balance diff=600000s(>6d)이지만 eval_time=17h25m(<17h30m) → 미발화
  #   (구식 1h 임계였다면 발화했을 케이스 — for 개정 검증).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_expected_watermark_seconds{market="domestic"}'
        values: '700000+0x2101'
      - series: 'aaa_collector_data_watermark_seconds{series="credit-balance",market="domestic"}'
        values: '100000+0x2101'
    alert_rule_test:
      - eval_time: 17h25m
        groupname: collector-watermark-freshness-lag
        alertname: CollectorWatermarkFreshnessLagCreditBalance
        exp_alerts: []

  # TI-WM-LAG-004. [발화, C-2] macro-fred diff=600000s(>6d) 상시 → for:4h 후 발화(1h→4h 개정 검증).
  # 시리즈 길이: 4h5m = 14700s → N = 14700/30 = 490
  - interval: 30s
    input_series:
      - series: 'aaa_collector_expected_watermark_seconds{market="overseas"}'
        values: '700000+0x491'
      - series: 'aaa_collector_data_watermark_seconds{series="macro-fred",market="overseas"}'
        values: '100000+0x491'
    alert_rule_test:
      - eval_time: 4h5m
        groupname: collector-watermark-freshness-lag
        alertname: CollectorWatermarkFreshnessLagMacroFred
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
              series: macro-fred
              market: overseas
              tier: TICKET
            exp_annotations:
              summary: "미국 거시지표(FRED) 수집 지연"
              description: "지연 허용치(6일)를 넘어서도 적재되지 않음 — 기대 대비 6d 22h 40m 0s 뒤처짐 (정상 공표 지연 2영업일)(REQ-WM-017 lag 허용형)."
              action: "macro-external 배치(평일 19:00) 로그에서 FRED 소스 확인 → macro_indicators에서 FRED 시리즈 최근 일자 조회"

  # TI-WM-LAG-005. [발화, C-3] analyst-estimates diff>5d 상시 → for:17h30m 후 발화(1h→17h30m 개정 검증).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_expected_watermark_seconds{market="domestic"}'
        values: '600000+0x2111'
      - series: 'aaa_collector_data_watermark_seconds{series="analyst-estimates",market="domestic"}'
        values: '100000+0x2111'
    alert_rule_test:
