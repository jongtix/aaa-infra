# =============================================================================
# vmalert 룰 유닛테스트 — 수집 갭(장주기) — 주간 배치 8d + 장중 게이트(룰10).
# SPEC-OBSV-BATCH-COVERAGE-001
# =============================================================================
# 실행(전체): ./run-unittests.sh          — 파일별 docker 병렬 실행(권장)
#   또는: vmalert-tool unittest --files='/rules/rules_test_*.yaml'  (순차, CWD=config/vmalert 마운트)
# 실행(이 파일만): docker run --rm -v "$PWD":/rules victoriametrics/vmalert-tool:v1.145.0 \
#     unittest --files=/rules/rules_test_gap_weekly.yaml
# rule_files 는 본 파일 기준 상대경로(rules.yml = 같은 디렉토리).
#
# [시간 모델 — 음수 anchor] unittest의 time()은 eval_time(초, 0=epoch 기준)과 동일.
#   룰이 `time() - last_load > 8d` 차이값 비교이므로, "8일 경과"는 eval_time을 8일까지
#   감는 대신(스텝 23,650개 → 단독 21분 소요) last_load anchor를 -700000(8d=691200s보다
#   충분히 과거)으로 두고 eval_time은 for: 5m 충족에 필요한 10m만 시뮬레이션한다(스텝 20개).
#   t=0부터 조건이 이미 참이므로 eval_time=10m 시점에 for: 5m을 채우고 발화한다.
#   `+0xN` = 동일값 N+1개(30s 간격). 시리즈 길이는 eval_time 이상이어야 한다.
# [REQ-WM-025] 모든 alert에 tier(PAGE|TICKET) 라벨이 부여되므로 exp_labels에 tier를 명시한다
#   (누락 시 vmalert-tool이 라벨 불일치로 FAILED 처리).
# =============================================================================

rule_files:
  - rules.yml

evaluation_interval: 30s

tests:
  # ===========================================================================
  # 룰 10: collector-collection-gap-weekly — 8d + 장중 게이트
  # SPEC-OBSV-BATCH-COVERAGE-001 AC-2 / AC-3 / AC-6 / REQ-005
  # ===========================================================================
  # anchor=-700000 → t=0 시점 staleness=700000s > 8d(691200s). 시리즈 길이:
  # eval_time 10m=600s → N=600/30=20, 여유분 포함 `+0x30`(31샘플=900s 커버).

  # T23. [발화] domestic-financial-ratio stale>8d AND market_open==1 → 발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="domestic-financial-ratio"}'
        values: '-700000+0x30'
      - series: 'aaa_collector_market_open'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 10m
        groupname: collector-collection-gap-weekly
        alertname: CollectorBatchStale
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
              batch: domestic-financial-ratio
              tier: TICKET
            exp_annotations:
              summary: "주간 배치 수집 중단 — domestic-financial-ratio 8일 초과 미적재"
              description: "주 1회 배치 domestic-financial-ratio의 마지막 적재 후 8일(주기 7일 + 마진 1일) 초과 경과 — 새 데이터 유입 중단. 휴장 시 억제됨."
              action: "collector 로그(토·월 아침 주간 배치 실행분) → 실행 여부·KIS 오류 확인"

  # T24. [발화] domestic-etf-representative stale>8d AND market_open==1 → 발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="domestic-etf-representative"}'
        values: '-700000+0x30'
      - series: 'aaa_collector_market_open'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 10m
        groupname: collector-collection-gap-weekly
        alertname: CollectorBatchStale
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
              batch: domestic-etf-representative
              tier: TICKET
            exp_annotations:
              summary: "주간 배치 수집 중단 — domestic-etf-representative 8일 초과 미적재"
              description: "주 1회 배치 domestic-etf-representative의 마지막 적재 후 8일(주기 7일 + 마진 1일) 초과 경과 — 새 데이터 유입 중단. 휴장 시 억제됨."
              action: "collector 로그(토·월 아침 주간 배치 실행분) → 실행 여부·KIS 오류 확인"

  # T25. [휴장 억제] domestic-financial-ratio stale>8d 이지만 market_open==0 → 억제(AC-3).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="domestic-financial-ratio"}'
        values: '-700000+0x30'
      - series: 'aaa_collector_market_open'
        values: '0+0x30'
    alert_rule_test:
      - eval_time: 10m
        groupname: collector-collection-gap-weekly
        alertname: CollectorBatchStale
        exp_alerts: []

  # T26. [absent 억제] 주간 배치 last_load 시계열 부재 → 미발화(AC-6 / REQ-010).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_market_open'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 10m
        groupname: collector-collection-gap-weekly
        alertname: CollectorBatchStale
        exp_alerts: []

  # T26a. [경계 미발화] anchor=-(8d-5m)=-690900 → t=0 staleness=690900s < 8d.
  # eval_time=4m 시점엔 임계(8d) 자체를 아직 못 넘어 미발화 — 음수 anchor 모델이
  # 임계 경계를 실제로 구분하는지 확인(시간 모델 전환 시 자기 검증 케이스).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="domestic-financial-ratio"}'
        values: '-690900+0x30'
      - series: 'aaa_collector_market_open'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 4m
        groupname: collector-collection-gap-weekly
        alertname: CollectorBatchStale
        exp_alerts: []
