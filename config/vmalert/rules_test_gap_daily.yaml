# =============================================================================
# vmalert 룰 유닛테스트 — 수집 갭(단·중주기) — 28h 기본(룰7)·뉴스 1h(룰11)·watchlist-us 28h(룰12)
# SPEC-OBSV-BATCH-COVERAGE-001
# =============================================================================
# 실행(전체): ./run-unittests.sh          — 파일별 docker 병렬 실행(권장)
#   또는: vmalert-tool unittest --files='/rules/rules_test_*.yaml'  (순차, CWD=config/vmalert 마운트)
# 실행(이 파일만): docker run --rm -v "$PWD":/rules victoriametrics/vmalert-tool:v1.145.0 \
#     unittest --files=/rules/rules_test_gap_daily.yaml
# rule_files 는 본 파일 기준 상대경로(rules.yml = 같은 디렉토리).
#
# [시간 모델 — 음수 anchor] unittest의 time()은 eval_time(초, 0=epoch 기준)과 동일.
#   룰이 `time() - last_load > 임계` 차이값 비교이므로, "X시간 경과"는 eval_time을 X까지
#   감는 대신 last_load anchor를 -(임계+마진)으로 두고 eval_time은 for: 5m 충족에 필요한
#   10m만 시뮬레이션한다(스텝 20개). t=0부터 조건이 이미 참이므로 eval_time=10m에 발화한다.
#   경계 미발화 케이스는 anchor를 임계 미만 staleness로 잡아 재현한다(예: T31).
#   `+0xN` = 동일값 N+1개(30s 간격). 시리즈 길이는 eval_time 이상이어야 한다.
# [REQ-WM-025] 모든 alert에 tier(PAGE|TICKET) 라벨이 부여되므로 exp_labels에 tier를 명시한다
#   (누락 시 vmalert-tool이 라벨 불일치로 FAILED 처리).
# =============================================================================

rule_files:
  - rules.yml

evaluation_interval: 30s

tests:
  # ===========================================================================
  # SPEC-OBSV-BATCH-COVERAGE-001 — 신규 배치 모니터링 사각 해소
  # ===========================================================================
  # anchor 계산: 28h 임계=100800s → 초과 anchor=-105000 / 미만(25h) anchor=-90000.
  #              1h 임계=3600s → 초과 anchor=-4000.
  # 시리즈 길이: eval_time 10m=600s → N=20, 여유분 포함 `+0x30`(31샘플=900s 커버).

  # ===========================================================================
  # 룰 7: collector-collection-gap — 기존 28h 룰 batch 필터 검증
  # SPEC-OBSV-BATCH-COVERAGE-001 AC-2 / REQ-003 / REQ-004
  # ===========================================================================

  # T12. [REQ-WM-024 신규 제외 재확인] domestic-invest-opinion(series=analyst-estimates 대응)도
  #      ACTIVE 워터마크 신선도로 전환되어 그룹2 기본 28h 룰에서 제외됨 — stale+market_open==1이어도 미발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="domestic-invest-opinion"}'
        values: '-105000+0x30'
      - series: 'aaa_collector_market_open'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 10m
        groupname: collector-collection-gap
        alertname: CollectorBatchStale
        exp_alerts: []

  # T13. [SPEC-COLLECTOR-EXPECTED-RUN-001 REQ-XR-021 재분류 확인] watchlist-sync-krx는 예상-실행
  #      모델(collector-collection-gap-expected-run)로 재분류되어 구 그룹2 필터에서 제외됨 —
  #      stale+market_open==1이어도 미발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="watchlist-sync-krx"}'
        values: '-105000+0x30'
      - series: 'aaa_collector_market_open'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 10m
        groupname: collector-collection-gap
        alertname: CollectorBatchStale
        exp_alerts: []

  # T13a. [SPEC-COLLECTOR-MARKETIND-004 후속, 2026-07-17] market-usdkrw(화~토 10:30 전용 배치)는
  #      그룹2 필터에서 제외 — 주말 갭(토 10:30→월 게이트 on ≈45.7h)이 28h 임계와 구조 불합치라
  #      제외하지 않으면 매주 월요일 오발. 실행 감시는 expected-run 모델(레지스트리 편입)이 전담.
  #      stale>28h + market_open==1이어도 미발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="market-usdkrw"}'
        values: '-165000+0x30'
      - series: 'aaa_collector_market_open'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 10m
        groupname: collector-collection-gap
        alertname: CollectorBatchStale
        exp_alerts: []

  # T14. [배치 필터 검증] overseas-daily stale>28h + market_open==1 이지만
  #      batch 필터(batch!~"overseas-.*") 로 collector-collection-gap에서 미발화.
  #      overseas-daily는 예상-실행 모델(collector-collection-gap-expected-run)이 전담 — 28h 룰은 오발하지 않아야 함.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="overseas-daily"}'
        values: '-105000+0x30'
      - series: 'aaa_collector_market_open'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 10m
        groupname: collector-collection-gap
        alertname: CollectorBatchStale
        exp_alerts: []

  # T15. [REQ-WM-024 신규 제외 재확인] macro-external(series=macro-ecos/macro-fred 공유 배치)도
  #      ACTIVE 워터마크 신선도로 전환되어 그룹2 기본 28h 룰에서 제외됨 — stale+market_open==1이어도 미발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="macro-external"}'
        values: '-105000+0x30'
      - series: 'aaa_collector_market_open'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 10m
        groupname: collector-collection-gap
        alertname: CollectorBatchStale
        exp_alerts: []

  # T15a. [발화 양성 대조] 필터에 걸리지 않는 기본 28h 배치(domestic-financial)가
  #       stale>28h + market_open==1 이면 발화 — 위 제외 케이스들이 "필터 때문"임을 보증하는
  #       자기 검증 케이스(음수 anchor 모델 전환 시 추가).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="domestic-financial"}'
        values: '-105000+0x30'
      - series: 'aaa_collector_market_open'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 10m
        groupname: collector-collection-gap
        alertname: CollectorBatchStale
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
              batch: domestic-financial
              tier: TICKET
            exp_annotations:
              summary: "일일 배치 수집 중단 — domestic-financial 28시간 초과 미적재"
              description: "일 1회 배치 domestic-financial의 마지막 적재 후 28시간 초과 경과 — 새 데이터 유입 중단. 장중에만 판정하며 휴장 시 억제됨."
              action: "collector 로그(domestic-financial 실행 오류) → KIS 호출 실패·스케줄 누락 확인"

  # ===========================================================================
  # [REMOVED 2026-07-12, SPEC-COLLECTOR-EXPECTED-RUN-001 REQ-XR-022/027] 룰 8
  # (collector-collection-gap-overseas, 100h)의 T16~T20을 삭제 — 대상 배치
  # (overseas-daily/overseas-shortsale-daily)는 collector-collection-gap-expected-run이 대체.
  # ===========================================================================

  # ===========================================================================
  # 룰 11: collector-collection-gap-news — 1h + 장중 게이트
  # SPEC-OBSV-BATCH-COVERAGE-001 AC-2 / AC-3 / AC-6 / REQ-006
  # ===========================================================================

  # T27. [발화] domestic-news stale>1h AND market_open==1 → 발화.
  # anchor=-4000 → t=0 staleness=4000s > 1h(3600s) → for:5m 후 eval_time=10m 발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="domestic-news"}'
        values: '-4000+0x30'
      - series: 'aaa_collector_market_open'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 10m
        groupname: collector-collection-gap-news
        alertname: CollectorBatchStale
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
              batch: domestic-news
              tier: TICKET
            exp_annotations:
              summary: "국내 뉴스 수집 중단 — 1시간 초과"
              description: "장중 10분 주기 국내 뉴스 수집이 1시간 이상 중단(연속 6회 실패 상당). 휴장 시 억제됨."
              action: "collector 로그(domestic-news 오류) → KIS 뉴스 API 응답·키 상태 확인"

  # T28. [휴장 억제] domestic-news stale>1h 이지만 market_open==0 → 억제(AC-3).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="domestic-news"}'
        values: '-4000+0x30'
      - series: 'aaa_collector_market_open'
        values: '0+0x30'
    alert_rule_test:
      - eval_time: 10m
        groupname: collector-collection-gap-news
        alertname: CollectorBatchStale
        exp_alerts: []

  # T29. [absent 억제] domestic-news 시계열 부재 → 미발화(AC-6 / REQ-010).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_market_open'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 10m
        groupname: collector-collection-gap-news
        alertname: CollectorBatchStale
        exp_alerts: []

  # ===========================================================================
  # 룰 12: collector-collection-gap-watchlist-us — 28h 무게이트(REQ-013)
  # SPEC-OBSV-BATCH-COVERAGE-001 AC-4 / AC-6
  # ===========================================================================

  # T30. [발화] watchlist-sync-us stale>28h → 발화(게이트 무관, 매일 잡이라 무억제).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="watchlist-sync-us"}'
        values: '-105000+0x30'
    alert_rule_test:
      - eval_time: 10m
        groupname: collector-collection-gap-watchlist-us
        alertname: CollectorBatchStale
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
              batch: watchlist-sync-us
              tier: TICKET
            exp_annotations:
              summary: "미국 관심종목 동기화 중단 — 28시간 초과"
              description: "매일 ET 08:50 실행되는 미국 관심종목 동기화의 마지막 적재 후 28시간 초과 경과. 매일 잡이라 주말 갭 없음(휴장 억제 없음)."
              action: "collector 로그(watchlist-sync-us 실행분) → 실행 여부·KIS 오류 확인"

  # T31. [무발화] watchlist-sync-us stale<28h → 미발화(정상 24h 주기 허용).
  # anchor=-90000(25h) → t=0~10m staleness=90000~90600s < 28h(100800s) → 미발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="watchlist-sync-us"}'
        values: '-90000+0x30'
    alert_rule_test:
      - eval_time: 10m
        groupname: collector-collection-gap-watchlist-us
        alertname: CollectorBatchStale
        exp_alerts: []

  # T32. [absent 억제] watchlist-sync-us 시계열 부재 → 미발화(AC-6 / REQ-010).
  - interval: 30s
    input_series: []
    alert_rule_test:
      - eval_time: 10m
        groupname: collector-collection-gap-watchlist-us
        alertname: CollectorBatchStale
        exp_alerts: []
