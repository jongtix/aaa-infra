# =============================================================================
# vmalert 룰 유닛테스트 — analyzer 추론 데드맨 스위치 (재설계, 라우팅 활성화 완료 M6)
# SPEC-OBSV-ANALYZER-DEADMAN-001 REQ-DMR-006~011 (M3/M4)
# =============================================================================
# 실행(전체): ./run-unittests.sh          — 파일별 docker 병렬 실행(권장)
# 실행(이 파일만): docker run --rm -v "$PWD":/rules victoriametrics/vmalert-tool:v1.147.0 \
#     unittest --files=/rules/rules_test_analyzer_inference.yaml
# rule_files 는 본 파일 기준 상대경로(rules.yml = 같은 디렉토리).
#
# [재작성 이유] 구 TI-AIF-DEADMAN-001~003은 구 expr
# absent_over_time(aaa_analyzer_inference_cycle_duration_seconds_count[35m])만
# 검증했다 — SPEC-OBSV-ANALYZER-DEADMAN-001 §1이 그 expr 자체를 재설계했으므로
# (analyzer 재기동 시 Prometheus 멀티프로세스 디렉터리 초기화로 인한 거짓 양성/
# 거짓 음성 양방향 결함, rules.yml의 analyzer-inference-deadman 그룹 주석 참조)
# 이 파일도 새 expr(collector 앵커 label_replace 비교)에 맞게 전면 재작성됐다.
# 구 케이스는 더 이상 유효하지 않으므로 재사용하지 않는다.
#
# [새 expr 요약] aaa_analyzer_inference_last_cycle_seconds{market}(analyzer,
# Redis 영속 warm-start, REQ-DMR-001~005 — M1/M2 aaa-analyzer 구현 전제, 이
# 테스트는 게이지 값 자체를 시뮬레이션 입력으로 직접 지정한다)를
# aaa_collector_batch_last_load_seconds{batch="domestic-daily"|"overseas-daily"}와
# label_replace(batch→market)로 정렬해 비교한다. 발화 조건은 AND로 결합된 두
# 조건 모두 충족: (a) drift = collector_last_load - analyzer_last_cycle >= 60초,
# (b) time() - collector_last_load > 35분(CATCHUP_MARGIN, 잠정값·M5 재확인 대상).
#
# [시간 모델] unittest의 time()은 eval_time(초, 0=epoch 기준)과 동일. 이 파일의
# 게이지 값은 collector-collection-gap-expected-run 등 기존 그룹과 동일 관례로
# "0 또는 음수 상수"를 사용해 time() - value 형태로 경과시간을 직접 읽을 수
# 있게 한다(예: 값 0, eval_time=300 → 경과 300초).
# =============================================================================

rule_files:
  - rules.yml

evaluation_interval: 30s

tests:
  # ===========================================================================
  # 룰: analyzer-inference-deadman — AnalyzerInferenceDeadman (재설계, REQ-DMR-006~008)
  # ===========================================================================

  # TI-DMR-DEADMAN-001. [무발화, 신선] collector(domestic-daily)가 t=0에 완료,
  #   analyzer(domestic)는 아직 이전 사이클 값(t=0 기준 90000초 전, 즉 하루
  #   가까이 이전)에 머물러 있어 drift(90000s)는 임계치(60s)를 이미 초과하지만,
  #   collector 완료로부터의 경과 시간(eval_time=300s=5분)이 CATCHUP_MARGIN(35분)
  #   이내이므로 아직 정체로 판정하지 않는다 — AC-DMR-009.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="domestic-daily"}'
        values: '0+0x15'
      - series: 'aaa_analyzer_inference_last_cycle_seconds{market="domestic"}'
        values: '-90000+0x15'
    alert_rule_test:
      - eval_time: 300s
        groupname: analyzer-inference-deadman
        alertname: AnalyzerInferenceDeadman
        exp_alerts: []

  # TI-DMR-DEADMAN-002. [발화, 진짜 정체] collector(domestic-daily)가 t=0에
  #   완료했고 analyzer(domestic)는 여전히 90000초 전 값에 머물러 정체
  #   상태(drift=90000s >= 60s) — eval_time=2130s(35분+30초, CATCHUP_MARGIN
  #   경과)에서 발화한다 — AC-DMR-010.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="domestic-daily"}'
        values: '0+0x75'
      - series: 'aaa_analyzer_inference_last_cycle_seconds{market="domestic"}'
        values: '-90000+0x75'
    alert_rule_test:
      - eval_time: 2130s
        groupname: analyzer-inference-deadman
        alertname: AnalyzerInferenceDeadman
        exp_alerts:
          - exp_labels:
              severity: warning
              component: analyzer
              market: domestic
              tier: TICKET
            exp_annotations:
              summary: "analyzer 추론 사이클 정체 — domestic"
              description: "collector 배치(domestic-daily) 완료 시각이 analyzer의 마지막 추론 사이클 완료 시각(aaa_analyzer_inference_last_cycle_seconds)보다 앞서 있고, 그 배치 완료로부터 35분(CATCHUP_MARGIN, 잠정값·M5 재확인 대상) 이상 경과 — stream:daily:complete 구독 컨슈머 정지 또는 자식 프로세스 스폰 실패 의심."
              action: "docker logs aaa-analyzer → stream:daily:complete XREADGROUP/자식 스폰(spawn.py) 로그 확인, Redis GET observability:analyzer:last-cycle:domestic 값 대조."

  # TI-DMR-DEADMAN-003. [무발화, 재기동 직후 게이지 일시 부재 — 회귀 가드]
  #   collector(overseas-daily)는 t=0에 방금 완료(경과 300s < 마진)했고,
  #   analyzer(overseas) 게이지 시계열 자체가 아예 존재하지 않는 상태를
  #   시뮬레이션(재기동 후 멀티프로세스 디렉터리 초기화~warm-start 반영 전
  #   찰나의 창을 대리). label_replace 조인 상대가 없어 결과 벡터가 비므로
  #   구 absent_over_time 설계와 달리 상시 발화 재발 없이 무발화한다 — REQ-DMR-011(c).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="overseas-daily"}'
        values: '0+0x15'
    alert_rule_test:
      - eval_time: 300s
        groupname: analyzer-inference-deadman
        alertname: AnalyzerInferenceDeadman
        exp_alerts: []

  # TI-DMR-DEADMAN-004. [무발화, 캐치업 완료 — 부가 회귀 가드] collector
  #   (domestic-daily)가 t=0에 완료해 경과 시간은 마진(35분)을 이미 초과했지만
  #   (eval_time=2130s), analyzer(domestic)가 그 이후(t=100s)에 사이클을
  #   완료해 이미 따라잡음(drift = 0 - 100 = -100 < 60) — 마진 초과 단독으로는
  #   발화하지 않고 drift 조건(REQ-DMR-008 (a))도 함께 충족해야 함을 확인.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="domestic-daily"}'
        values: '0+0x75'
      - series: 'aaa_analyzer_inference_last_cycle_seconds{market="domestic"}'
        values: '100+0x75'
    alert_rule_test:
      - eval_time: 2130s
        groupname: analyzer-inference-deadman
        alertname: AnalyzerInferenceDeadman
        exp_alerts: []
