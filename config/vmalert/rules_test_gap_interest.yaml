# =============================================================================
# vmalert 룰 유닛테스트 — 수집 갭(장주기) — 해외 금리 18d 무억제(룰9). 시뮬레이션 시간이 가장 긴 샤드라 단독 분리.
# SPEC-OBSV-BATCH-COVERAGE-001
# =============================================================================
# 실행(전체): ./run-unittests.sh          — 파일별 docker 병렬 실행(권장)
#   또는: vmalert-tool unittest --files='/rules/rules_test_*.yaml'  (순차, CWD=config/vmalert 마운트)
# 실행(이 파일만): docker run --rm -v "$PWD":/rules victoriametrics/vmalert-tool:v1.145.0 \
#     unittest --files=/rules/rules_test_gap_interest.yaml
# rule_files 는 본 파일 기준 상대경로(rules.yml = 같은 디렉토리).
#
# [시간 모델] unittest의 time()은 eval_time(초, 0=epoch 기준)과 동일.
#   "X시간 경과"는 last_update 계열을 0으로 두고 eval_time 을 X시간보다 크게 잡아 재현한다.
#   `+0xN` = 동일값 N+1개(30s 간격). 시리즈 길이는 eval_time 이상이어야 한다.
# [REQ-WM-025] 모든 alert에 tier(PAGE|TICKET) 라벨이 부여되므로 exp_labels에 tier를 명시한다
#   (누락 시 vmalert-tool이 라벨 불일치로 FAILED 처리).
# =============================================================================

rule_files:
  - rules.yml

evaluation_interval: 30s

tests:
  # ===========================================================================
  # 룰 9: collector-collection-gap-overseas-interest — 18d 무억제
  # SPEC-OBSV-BATCH-COVERAGE-001 AC-4 / AC-6 / REQ-009
  # ===========================================================================
  # 시리즈 길이: 19d5m = 19*24*3600+5*60 = 1641900s → N = 1641900/30 = 54730

  # T21. [발화] overseas-shortsale-interest stale>18d → 발화(게이트 무관).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="overseas-shortsale-interest"}'
        values: '0+0x54730'
    alert_rule_test:
      - eval_time: 19d5m
        groupname: collector-collection-gap-overseas-interest
        alertname: CollectorBatchStale
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
              batch: overseas-shortsale-interest
              tier: TICKET
            exp_annotations:
              summary: "해외 공매도 잔고 신선도 갭 — overseas-shortsale-interest > 18d 미적재"
              description: "FINRA 반월 공매도 잔고 마지막 적재 후 18일 초과 경과(반월 주기 15~16일 + 공시 지연 마진). 게이트 억제 없음(REQ-009)."

  # T22. [absent 억제] overseas-shortsale-interest 시계열 부재 → 미발화(AC-6).
  - interval: 30s
    input_series: []
    alert_rule_test:
      - eval_time: 19d5m
        groupname: collector-collection-gap-overseas-interest
        alertname: CollectorBatchStale
        exp_alerts: []

