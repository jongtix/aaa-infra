        values: '0+48x10'
      - series: 'node_cpu_seconds_total{cpu="1",mode="idle"}'
        values: '0+12x10'
      - series: 'node_cpu_seconds_total{cpu="1",mode="nice"}'
        values: '0+48x10'
    alert_rule_test:
      - eval_time: 7m
        groupname: node-resource
        alertname: NodeCpuWarning1
        exp_alerts:
          - exp_labels:
              severity: warning
              component: node
              tier: TICKET
            exp_annotations:
              summary: "NAS CPU 사용률 1단계 — 80%"
              description: "CPU 사용률(idle·iowait 제외, nice 포함)이 70% 초과 지속."
              action: "ssh nas-ugreen \"uptime && docker stats --no-stream\" → 상위 CPU 소비 컨테이너 확인. 05~08시 KST에는 nice 작업(약 1코어)이 흔함(출처는 antivirus_serv로 추정, 미검증)"
      - eval_time: 7m
        groupname: node-resource
        alertname: NodeCpuWarning2
        exp_alerts: []

