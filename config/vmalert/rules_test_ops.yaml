              description: "5분 부하평균(코어 대비)이 90% 초과 지속 — 디스크 I/O 대기도 포함되는 지표라 CPU가 아닌 I/O 병목일 수 있음. CPU는 TICKET 유지(오탐성)."
              action: "ssh nas-ugreen \"uptime && docker stats --no-stream\" → 부하 원인 컨테이너·I/O 확인"

  # TI-NODE-014. [디스크 다단계 동시 발화] 95%(avail=5) — W1·W2·Critical 동시 발화(6m) (AC-3a / REQ-NE-005~007)
  # 주의: vmalert-tool은 alertname 필터로 단일 alert 검증. 3개 alertname을 각각 alert_rule_test 항목으로 분리.
  - interval: 60s
    input_series:
      - series: 'node_filesystem_avail_bytes{mountpoint="/volume1",fstype="ext4"}'
        values: '5+0x7'
      - series: 'node_filesystem_size_bytes{mountpoint="/volume1",fstype="ext4"}'
        values: '100+0x7'
    alert_rule_test:
      - eval_time: 6m
        groupname: node-resource
        alertname: NodeDiskWarning1
        exp_alerts:
          - exp_labels:
              severity: warning
              component: node
              mountpoint: /volume1
              fstype: ext4
              tier: TICKET
            exp_annotations:
              summary: "NAS 디스크 사용률 1단계 — /volume1 (95%)"
              description: "/volume1 사용률이 70% 초과 지속."
              action: "ssh nas-ugreen \"df -h /volume1 /volume2\" → docker system df·로그·백업 순으로 대용량 정리"
      - eval_time: 6m
        groupname: node-resource
        alertname: NodeDiskWarning2
        exp_alerts:
          - exp_labels:
              severity: warning
              component: node
              mountpoint: /volume1
              fstype: ext4
              tier: TICKET
            exp_annotations:
              summary: "NAS 디스크 사용률 2단계 — /volume1 (95%)"
              description: "/volume1 사용률이 80% 초과 지속."
              action: "ssh nas-ugreen \"df -h /volume1 /volume2\" → docker system df·로그·백업 순으로 대용량 정리"
      - eval_time: 6m
        groupname: node-resource
        alertname: NodeDiskCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              component: node
              mountpoint: /volume1
              fstype: ext4
              tier: PAGE
            exp_annotations:
              summary: "NAS 디스크 사용률 3단계 — /volume1 (95%)"
              description: "/volume1 사용률이 90% 초과 지속 — 쓰기 실패 임박, 즉시 공간 확보 필요."
              action: "ssh nas-ugreen \"df -h /volume1 /volume2\" → docker system df·로그·백업 순으로 대용량 정리"

  # TI-NODE-015. [게이트 무관 발화] /volume1 75% + market_open=0(휴장) → NodeDiskWarning1 발화 (AC-7 / REQ-NE-015)
  # market_open=0 시계열을 input_series에 포함해 휴장 상태에서도 알림이 발화함을 기계적으로 증명.
  # node-resource 룰은 market_open과 AND하지 않으므로(REQ-NE-015), 0 입력은 발화에 영향 없음.
  - interval: 60s
    input_series:
      - series: 'node_filesystem_avail_bytes{mountpoint="/volume1",fstype="ext4"}'
        values: '25+0x7'
      - series: 'node_filesystem_size_bytes{mountpoint="/volume1",fstype="ext4"}'
        values: '100+0x7'
      - series: 'aaa_collector_market_open'
        values: '0+0x7'
    alert_rule_test:
      - eval_time: 6m
        groupname: node-resource
        alertname: NodeDiskWarning1
        exp_alerts:
          - exp_labels:
              severity: warning
              component: node
              mountpoint: /volume1
              fstype: ext4
              tier: TICKET
            exp_annotations:
              summary: "NAS 디스크 사용률 1단계 — /volume1 (75%)"
              description: "/volume1 사용률이 70% 초과 지속."
              action: "ssh nas-ugreen \"df -h /volume1 /volume2\" → docker system df·로그·백업 순으로 대용량 정리"

  # ===========================================================================
  # SPEC-OBSV-VLOGS-HEALTH-001: victorialogs-liveness 룰 유닛테스트
  # ===========================================================================
  # T1. up==0 지속 → 90s for 충족 후 발화. 게이트 무관 발화(collector CollectorDown 준용).
  - interval: 30s
    input_series:
      - series: 'up{job="victorialogs"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 120s
        groupname: victorialogs-liveness
        alertname: VictorialogsDown
        exp_alerts:
          - exp_labels:
              severity: critical
              component: victorialogs
              job: victorialogs
              tier: TICKET
            exp_annotations:
              summary: "victorialogs 스크랩 실패(다운) — 90s 연속"
              description: "VictoriaMetrics가 victorialogs /metrics 스크랩에 90s(30s×3) 연속 실패. 게이트 무관 발화."
              action: "ssh nas-ugreen \"docker ps -a | grep victorialogs\" → 컨테이너 기동·재시작 상태 확인. 이상 시 \"docker logs aaa-vector\"로 적재 공백(victorialogs 연결 실패 에러) 확인"

  # T2. up==1(정상) → 미발화.
  - interval: 30s
    input_series:
      - series: 'up{job="victorialogs"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 120s
        groupname: victorialogs-liveness
        alertname: VictorialogsDown
        exp_alerts: []
