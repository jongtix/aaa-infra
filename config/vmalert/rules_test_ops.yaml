  # ===========================================================================
  # 룰 10: node-resource — NAS 호스트 자원(디스크·RAM·CPU·온도) (SPEC-INFRA-NODE-001/002)
  # ===========================================================================
  # interval: 60s (node-resource 그룹 평가 주기).
  # 디스크 ratio: node_filesystem_size_bytes=100, node_filesystem_avail_bytes=<값>으로 사용률 재현.
  # RAM: MemTotal=100, MemAvailable=<값>.
  # CPU(SPEC-INFRA-NODE-002): node_cpu_seconds_total{cpu,mode} 카운터를 '0+<1분 증분>x10'으로 입력.
  #   CPU 2개(cpu="0"·"1"), CPU별 1분 증분 합 = 60(초). 사용률 = 1 − (idle+iowait 증분 합) / (전체 증분 합).
  # 디스크·RAM: warning for:5m → eval_time 6m, critical for:2m → eval_time 3m(게이지는 0m부터 참).
  # CPU: rate()가 두 번째 표본(1m)부터 값을 내므로 1주기 여유 — warning 7m, critical 4m. 미발화: 임계 직하값.
  # 온도(SPEC-INFRA-NODE-002): 게이지 node_hwmon_temp_celsius{chip="platform_coretemp_0",sensor="temp1"}를
  #   '<온도>+0x10'으로 입력. warning for:5m → 6m, critical for:2m → 3m(게이지는 0m부터 참 — 디스크와 같은 관례).
  #   max() 집계라 기대 라벨에 chip·sensor·instance가 없다.

  # TI-NODE-001. [디스크] NodeDiskWarning1 발화 — /volume1 75%(avail=25) > 70%, 6m (AC-3a / REQ-NE-005)
  - interval: 60s
    input_series:
      - series: 'node_filesystem_avail_bytes{mountpoint="/volume1",fstype="ext4"}'
        values: '25+0x7'
      - series: 'node_filesystem_size_bytes{mountpoint="/volume1",fstype="ext4"}'
        values: '100+0x7'
    alert_rule_test:
      - eval_time: 6m
        groupname: node-resource
        alertname: NodeDiskWarning1
        exp_alerts:
          - exp_labels:
              severity: warning
              component: node
              mountpoint: /volume1
              fstype: ext4
              tier: TICKET
            exp_annotations:
              summary: "NAS 디스크 사용률 1단계 — /volume1 (75%)"
              description: "/volume1 사용률이 70% 초과 지속."
              action: "ssh nas-ugreen \"df -h /volume1 /volume2\" → docker system df·로그·백업 순으로 대용량 정리"

  # TI-NODE-002. [디스크] NodeDiskWarning1 미발화 — /volume1 60%(avail=40) < 70%, 6m (AC-3b / REQ-NE-005)
