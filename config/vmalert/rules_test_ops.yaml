      - eval_time: 6m
        groupname: node-resource
        alertname: NodeDiskWarning1
        exp_alerts: []

  # TI-NODE-006/007 제거 2026-07-18: 1단계(80%) 룰을 rules.yml에서 주석 처리하며 대응 테스트도 삭제.
  # 원문은 git history 참조(TODO: 16GB RAM 업그레이드 후 룰·테스트 함께 복원).

  # TI-NODE-008. [RAM] NodeMemoryWarning2 발화 — 92%(MemAvailable=8) > 90%, 11m (AC-4a / REQ-NE-009, 2026-07-05 임계 상향)
  - interval: 60s
    input_series:
      - series: 'node_memory_MemAvailable_bytes'
        values: '8+0x12'
      - series: 'node_memory_MemTotal_bytes'
        values: '100+0x12'
    alert_rule_test:
      - eval_time: 11m
        groupname: node-resource
        alertname: NodeMemoryWarning2
        exp_alerts:
          - exp_labels:
              severity: warning
              component: node
              tier: TICKET
            exp_annotations:
              summary: "NAS 메모리 사용률 2단계 — 92%"
              description: "호스트 메모리 사용률이 90% 초과 지속."
              action: "ssh nas-ugreen \"free -h && docker stats --no-stream\" → 과다 사용 컨테이너 식별"

  # TI-NODE-009. [RAM] NodeMemoryCritical 발화 — 97%(MemAvailable=3) > 95%, 4m, PAGE 승격 (AC-4a / REQ-NE-010, 2026-07-05 임계 상향)
  - interval: 60s
    input_series:
      - series: 'node_memory_MemAvailable_bytes'
        values: '3+0x5'
      - series: 'node_memory_MemTotal_bytes'
        values: '100+0x5'
    alert_rule_test:
      - eval_time: 4m
        groupname: node-resource
        alertname: NodeMemoryCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              component: node
              tier: PAGE
            exp_annotations:
              summary: "NAS 메모리 사용률 3단계 — 97%"
              description: "호스트 메모리 사용률이 95% 초과 지속 — OOM Killer가 컨테이너를 강제 종료할 위험."
              action: "ssh nas-ugreen \"free -h && docker stats --no-stream\" → 과다 사용 컨테이너 식별"

  # TI-NODE-010. [CPU] NodeCpuWarning1 발화 — load5=3.0(75%) > 70%, 6m (AC-5a / REQ-NE-011)
  - interval: 60s
    input_series:
      - series: 'node_load5'
        values: '3.0+0x7'
    alert_rule_test:
      - eval_time: 6m
        groupname: node-resource
        alertname: NodeCpuWarning1
        exp_alerts:
          - exp_labels:
              severity: warning
              component: node
              tier: TICKET
            exp_annotations:
              summary: "NAS CPU 부하 1단계 — 75%"
              description: "5분 부하평균(코어 대비)이 70% 초과 지속 — 디스크 I/O 대기도 포함되는 지표라 CPU가 아닌 I/O 병목일 수 있음."
              action: "ssh nas-ugreen \"uptime && docker stats --no-stream\" → 부하 원인 컨테이너·I/O 확인"

  # TI-NODE-011. [CPU] NodeCpuWarning1 미발화 — load5=2.4(60%) < 70%, 6m (AC-5b / REQ-NE-011)
  - interval: 60s
    input_series:
      - series: 'node_load5'
        values: '2.4+0x7'
    alert_rule_test:
      - eval_time: 6m
        groupname: node-resource
        alertname: NodeCpuWarning1
        exp_alerts: []

  # TI-NODE-012. [CPU] NodeCpuWarning2 발화 — load5=3.6(90%>85%), 6m (AC-5a / REQ-NE-012)
  - interval: 60s
