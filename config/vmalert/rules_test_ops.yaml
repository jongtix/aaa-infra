              action: "ssh nas-ugreen \"df -h /volume1 /volume2\" → docker system df·로그·백업 순으로 대용량 정리"

  # TI-NODE-005. [디스크 absent] 시계열 부재 → NodeDiskWarning1 미발화 — 구조적 억제(AC-6 / REQ-NE-014)
  - interval: 60s
