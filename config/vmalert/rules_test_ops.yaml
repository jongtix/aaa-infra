# =============================================================================
# vmalert 룰 유닛테스트 — 운영 — 안전 모드(SYSALERT-001)·시장지표 기본 소스 중단(MI)·NAS 자원(node-resource, INFRA-NODE-001)
# =============================================================================
# 실행(전체): ./run-unittests.sh          — 파일별 docker 병렬 실행(권장)
#   또는: vmalert-tool unittest --files='/rules/rules_test_*.yaml'  (순차, CWD=config/vmalert 마운트)
# 실행(이 파일만): docker run --rm -v "$PWD":/rules victoriametrics/vmalert-tool:v1.145.0 \
#     unittest --files=/rules/rules_test_ops.yaml
# rule_files 는 본 파일 기준 상대경로(rules.yml = 같은 디렉토리).
#
# [시간 모델] unittest의 time()은 eval_time(초, 0=epoch 기준)과 동일.
#   "X시간 경과"는 last_update 계열을 0으로 두고 eval_time 을 X시간보다 크게 잡아 재현한다.
#   `+0xN` = 동일값 N+1개(30s 간격). 시리즈 길이는 eval_time 이상이어야 한다.
# [REQ-WM-025] 모든 alert에 tier(PAGE|TICKET) 라벨이 부여되므로 exp_labels에 tier를 명시한다
#   (누락 시 vmalert-tool이 라벨 불일치로 FAILED 처리).
# =============================================================================

rule_files:
  - rules.yml

evaluation_interval: 30s

tests:
  # ====================================================================
  # SPEC-OBSV-SYSALERT-001: collector-safemode 룰 유닛테스트
  # ===========================================================================
  # 검증 목표:
  #   TI-SAFEMODE-001: CollectorSafeModeEntered — enter_total increase>0 → 즉시 발화
  #   TI-SAFEMODE-002: CollectorSafeModeExited  — exit_total  increase>0 → 즉시 발화
  #   TI-SAFEMODE-003: [미발화] enter_total 변화 없음(increase==0) → 미발화
  #
  # [시간 모델] increase(metric[5m])를 발화시키려면:
  #   eval_time 기준 [eval_time-5m, eval_time] 범위 내 counter 증가가 필요하다.
  #   - values: '0+0x10 1+0x5' = t=0..300s: 0, t=330..480s: 1
  #   - eval_time=330s → range [30s,330s] 내 0→1 증가 → increase=1 > 0 → 발화
  #   - for: 0m 이므로 조건 충족 즉시 발화 (pending 없음)
  # ===========================================================================

  # TI-SAFEMODE-001. [발화] enter_total 5분 내 증가 → CollectorSafeModeEntered 발화
  - interval: 30s
    input_series:
      - series: 'aaa_collector_safe_mode_enter_total{module="token",alias="isa"}'
        values: '0+0x10 1+0x5'
    alert_rule_test:
      - eval_time: 330s
        groupname: collector-safemode
        alertname: CollectorSafeModeEntered
        exp_alerts:
          - exp_labels:
              severity: critical
              component: collector
              module: token
              alias: isa
              tier: PAGE
              notify: fire_only
            exp_annotations:
              summary: "안전 모드 진입 — KIS 토큰 (계좌 isa)"
              description: "토큰 발급 실패로 계좌 isa의 KIS 호출 차단 중. 1~4시간 백오프 후 자동 재시도 — 짧은 간격 반복 진입이면 앱키 문제 의심."
              action: "collector 로그(진입 원인 예외) → 재발급 성공 로그 또는 redis 키 safe_mode:collector:token:{alias} 소멸 확인"

  # TI-SAFEMODE-002. [발화, SM-1b] ws module enter_total 5분 내 증가 → CollectorSafeModeEntered 발화(PAGE 유지).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_safe_mode_enter_total{module="ws",alias="key1"}'
        values: '0+0x10 1+0x5'
    alert_rule_test:
      - eval_time: 330s
        groupname: collector-safemode
        alertname: CollectorSafeModeEntered
        exp_alerts:
          - exp_labels:
              severity: critical
              component: collector
              module: ws
              alias: key1
              tier: PAGE
              notify: fire_only
            exp_annotations:
              summary: "안전 모드 진입 — WebSocket (계좌 key1)"
              description: "WebSocket 연결 오류 반복으로 계좌 key1의 재연결 차단 중. 자동 복구 없음 — 수동 해제 전까지 유지."
              action: "collector 로그(진입 원인 예외) → 원인 해소 후 redis 키 safe_mode:collector:ws:{alias} 수동 삭제(TECHSPEC §1.3)"

  # TI-SAFEMODE-003. [발화, SM-2] exit_total 5분 내 증가 → CollectorSafeModeExited 발화
  - interval: 30s
    input_series:
      - series: 'aaa_collector_safe_mode_exit_total{module="token",alias="isa"}'
        values: '0+0x10 1+0x5'
    alert_rule_test:
      - eval_time: 330s
        groupname: collector-safemode
        alertname: CollectorSafeModeExited
        exp_alerts:
          - exp_labels:
              severity: info
              component: collector
              module: token
              alias: isa
              tier: TICKET
              notify: fire_only
            exp_annotations:
              summary: "안전 모드 해제 — 토큰 (계좌 isa)"
              description: "계좌 isa 안전 모드 해제(토큰 발급 성공). 참고: TTL 자연 만료·수동 삭제로 풀린 경우엔 이 알림이 오지 않음(aaa-infra#85)."
              action: "이후 배치·WS 정상 수집 재개 여부 확인"

  # TI-SAFEMODE-004. [미발화] enter_total 변화 없음(increase==0) → 미발화
  - interval: 30s
    input_series:
      - series: 'aaa_collector_safe_mode_enter_total{module="token",alias="isa"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 330s
        groupname: collector-safemode
        alertname: CollectorSafeModeEntered
        exp_alerts: []

  # ===========================================================================
  # 룰 11: collector-market-indicator — MarketIndicatorPrimaryStale (Family MI, 2026-07-10 재설계)
  # SPEC-COLLECTOR-MARKETIND-002, MarketIndicatorExhausted는 2026-07-10 삭제(워터마크 일원화).
  # [2026-07-14 SPEC-COLLECTOR-WARMSTART-REDIS-003 M2] `> 0` 가드 제거에 맞춰 케이스 갱신:
  #   TI-WM-MI-002는 "가드 억제"(무발화)에서 "가드 제거 후 정상 발화"로 반전. TI-WM-MI-004(warm-start
  #   복원 후 정상 발화)·TI-WM-MI-005(전면 Redis 유실 시 구조적 침묵)를 신규 추가(REQ-WSR-026~028).
  # [2026-07-17 SPEC-COLLECTOR-MARKETIND-004 후속] 소스별 2룰 분할 반영: KOREAEXIM 룰 좌변이
  #   batch="market-usdkrw"(화~토 10:30 전용 배치)로 재배선 — KOREAEXIM 케이스(MI-001/-004)의 좌변
  #   시리즈 라벨 교체. CBOE 케이스(MI-002/-003)는 기존 market-indicators 좌변 유지. 신규:
  #   TI-WM-MI-006(KOREAEXIM 1회 실패 24h 관용 무발화)·TI-WM-MI-007(좌변 market-usdkrw 부재 시
  #   구조적 침묵).
  # ===========================================================================
  # 시간 모델: batch_last_load_seconds − source_last_success_seconds > 25h(90000s), for:5m.
  # 두 게이지 모두 상수(시간 경과와 무관) — diff는 값 자체로 고정, for:5m 안정성만 검증하면 됨.

  # TI-WM-MI-001. [발화] 기본 소스(KOREAEXIM) 2회차 실패 — diff=100000s(≈27.8h>25h) 상시 → for:5m 후 발화.
  # 좌변은 2026-07-17 분할로 market-usdkrw(전용 배치) 기준.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="market-usdkrw"}'
        values: '200000+0x15'
      - series: 'aaa_collector_market_indicator_source_last_success_seconds{indicator="USDKRW",source="KOREAEXIM"}'
        values: '100000+0x15'
    alert_rule_test:
      - eval_time: 5m30s
        groupname: collector-market-indicator
        alertname: MarketIndicatorPrimaryStale
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
              tier: TICKET
              indicator: USDKRW
              source: KOREAEXIM
            exp_annotations:
              summary: "시장지표 수집 기본 소스 중단 — USDKRW (KOREAEXIM)"
              description: "USDKRW의 수집 기본 소스 KOREAEXIM가 2회차 이상 연속 실패 — 예비 소스가 대체 수집 중(데이터 결손 없음), 기본 소스 복구 필요(예비 상시화 방지)."
              action: "collector 로그(usdkrw 전용 배치 화~토 10:30, KOREAEXIM 실패 사유) → market_indicators 테이블 source 컬럼으로 실제 적재 소스 확인"

  # TI-WM-MI-002. [발화, `>0` 가드 제거 검증] source_last_success=0(한 번도 성공한 적 없는 기본 소스) →
  # diff가 25h 초과이면 가드 제거 후 정상 발화한다(#88 결함 해소 — 이전엔 가드가 이 케이스를 영구 침묵시켰음).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="market-indicators"}'
        values: '200000+0x15'
      - series: 'aaa_collector_market_indicator_source_last_success_seconds{indicator="VIX",source="CBOE"}'
        values: '0+0x15'
    alert_rule_test:
      - eval_time: 5m30s
        groupname: collector-market-indicator
        alertname: MarketIndicatorPrimaryStale
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
              tier: TICKET
              indicator: VIX
              source: CBOE
            exp_annotations:
              summary: "시장지표 수집 기본 소스 중단 — VIX (CBOE)"
              description: "VIX의 수집 기본 소스 CBOE가 2회차 이상 연속 실패 — 예비 소스가 대체 수집 중(데이터 결손 없음), 기본 소스 복구 필요(예비 상시화 방지)."
              action: "collector 로그(market-indicators 배치 평일 17:05, CBOE 실패 사유) → market_indicators 테이블 source 컬럼으로 실제 적재 소스 확인"

  # TI-WM-MI-003. [무발화, 1회 실패 용인] diff=86400s(24h, 정확히 1회차 계단) → 25h 미초과로 미발화(월요일 오탐 소멸 검증 — 이전 24h 벽시계 임계였다면 발화했을 케이스).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="market-indicators"}'
        values: '186400+0x15'
      - series: 'aaa_collector_market_indicator_source_last_success_seconds{indicator="VIX",source="CBOE"}'
        values: '100000+0x15'
    alert_rule_test:
      - eval_time: 5m30s
        groupname: collector-market-indicator
        alertname: MarketIndicatorPrimaryStale
        exp_alerts: []

  # TI-WM-MI-004. [발화, warm-start 복원 시나리오] 게이지가 재기동 시 Redis 값(비영)으로 warm-start된
  # 상태를 재현 — source_last_success가 과거의 non-zero 값으로 유지되고 기본 소스가 25h 초과 지연되면
  # 가드 제거와 무관하게 정상 발화한다(REQ-WSR-021/026, AC-3/AC-7 — 정상 케이스가 가드 제거로 영향받지
  # 않음을 검증). 좌변은 2026-07-17 분할로 market-usdkrw 기준.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="market-usdkrw"}'
        values: '250000+0x15'
      - series: 'aaa_collector_market_indicator_source_last_success_seconds{indicator="USDKRW",source="KOREAEXIM"}'
        values: '150000+0x15'
    alert_rule_test:
      - eval_time: 5m30s
        groupname: collector-market-indicator
        alertname: MarketIndicatorPrimaryStale
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
              tier: TICKET
              indicator: USDKRW
              source: KOREAEXIM
            exp_annotations:
              summary: "시장지표 수집 기본 소스 중단 — USDKRW (KOREAEXIM)"
              description: "USDKRW의 수집 기본 소스 KOREAEXIM가 2회차 이상 연속 실패 — 예비 소스가 대체 수집 중(데이터 결손 없음), 기본 소스 복구 필요(예비 상시화 방지)."
              action: "collector 로그(usdkrw 전용 배치 화~토 10:30, KOREAEXIM 실패 사유) → market_indicators 테이블 source 컬럼으로 실제 적재 소스 확인"

  # TI-WM-MI-005. [무발화, 전면 Redis 유실 — 구조적 침묵] 좌변(batch_last_load)·우변(source_last_success)
  # 모두 부재(시리즈 자체가 없음, 값 0이 아님) → 뺄셈이 빈 벡터가 되어 규칙이 발화할 수 없다(REQ-WSR-027,
  # AC-8). `> 0` 가드 제거 후에도 전면 유실 시 오발하지 않음을 검증하는 핵심 안전망 케이스(분할된 2룰
  # 모두 좌변 부재로 침묵).
  - interval: 30s
    input_series: []
    alert_rule_test:
      - eval_time: 5m30s
        groupname: collector-market-indicator
        alertname: MarketIndicatorPrimaryStale
        exp_alerts: []

  # TI-WM-MI-006. [무발화, KOREAEXIM 1회 실패 관용] diff=86400s(24h, 정확히 1회차 계단) → 25h 미초과로
  # 미발화 — 좌변 market-usdkrw 재배선으로 24h 계단이 복원됐음을 검증(재배선 전에는 스케줄 skew 6.6h가
  # 더해져 1회 실패에 30.6h>25h로 즉시 발화했음, 2026-07-17 분할의 핵심 목적).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="market-usdkrw"}'
        values: '186400+0x15'
      - series: 'aaa_collector_market_indicator_source_last_success_seconds{indicator="USDKRW",source="KOREAEXIM"}'
        values: '100000+0x15'
    alert_rule_test:
      - eval_time: 5m30s
        groupname: collector-market-indicator
        alertname: MarketIndicatorPrimaryStale
        exp_alerts: []

  # TI-WM-MI-007. [무발화, 좌변 단독 부재 — 구조적 침묵] market-usdkrw 좌변 시리즈 부재 + KOREAEXIM
  # 우변 존재 → KOREAEXIM 룰의 뺄셈이 빈 벡터가 되어 침묵. CBOE 룰도 좌변(market-indicators) 부재로
  # 침묵. (배포 전이 구간·Redis 부분 유실에서 오발하지 않음을 고정)
  - interval: 30s
    input_series:
      - series: 'aaa_collector_market_indicator_source_last_success_seconds{indicator="USDKRW",source="KOREAEXIM"}'
        values: '100000+0x15'
    alert_rule_test:
      - eval_time: 5m30s
        groupname: collector-market-indicator
        alertname: MarketIndicatorPrimaryStale
        exp_alerts: []

  # ===========================================================================
  # 룰 10: node-resource — NAS 호스트 자원(디스크·RAM·CPU) (SPEC-INFRA-NODE-001)
  # ===========================================================================
  # interval: 60s (node-resource 그룹 평가 주기).
  # 디스크 ratio: node_filesystem_size_bytes=100, node_filesystem_avail_bytes=<값>으로 사용률 재현.
  # RAM: MemTotal=100, MemAvailable=<값>. CPU: node_load5=<값>(4코어, load/4=사용률).
  # warning for:5m → eval_time 6m. critical for:2m → eval_time 3m. 미발화: 임계 직하값.

  # TI-NODE-001. [디스크] NodeDiskWarning1 발화 — /volume1 75%(avail=25) > 70%, 6m (AC-3a / REQ-NE-005)
  - interval: 60s
    input_series:
      - series: 'node_filesystem_avail_bytes{mountpoint="/volume1",fstype="ext4"}'
        values: '25+0x7'
      - series: 'node_filesystem_size_bytes{mountpoint="/volume1",fstype="ext4"}'
        values: '100+0x7'
    alert_rule_test:
      - eval_time: 6m
        groupname: node-resource
        alertname: NodeDiskWarning1
        exp_alerts:
          - exp_labels:
              severity: warning
              component: node
              mountpoint: /volume1
              fstype: ext4
              tier: TICKET
            exp_annotations:
              summary: "NAS 디스크 사용률 1단계 — /volume1 (75%)"
              description: "/volume1 사용률이 70% 초과 지속."
              action: "ssh nas-ugreen \"df -h /volume1 /volume2\" → docker system df·로그·백업 순으로 대용량 정리"

  # TI-NODE-002. [디스크] NodeDiskWarning1 미발화 — /volume1 60%(avail=40) < 70%, 6m (AC-3b / REQ-NE-005)
  - interval: 60s
    input_series:
      - series: 'node_filesystem_avail_bytes{mountpoint="/volume1",fstype="ext4"}'
        values: '40+0x7'
      - series: 'node_filesystem_size_bytes{mountpoint="/volume1",fstype="ext4"}'
        values: '100+0x7'
    alert_rule_test:
      - eval_time: 6m
        groupname: node-resource
        alertname: NodeDiskWarning1
        exp_alerts: []

  # TI-NODE-003. [디스크] NodeDiskWarning2 발화 — /volume1 85%(avail=15) > 80%, 6m (AC-3a / REQ-NE-006)
  - interval: 60s
    input_series:
      - series: 'node_filesystem_avail_bytes{mountpoint="/volume1",fstype="ext4"}'
        values: '15+0x7'
      - series: 'node_filesystem_size_bytes{mountpoint="/volume1",fstype="ext4"}'
        values: '100+0x7'
    alert_rule_test:
      - eval_time: 6m
        groupname: node-resource
        alertname: NodeDiskWarning2
        exp_alerts:
          - exp_labels:
              severity: warning
              component: node
              mountpoint: /volume1
              fstype: ext4
              tier: TICKET
            exp_annotations:
              summary: "NAS 디스크 사용률 2단계 — /volume1 (85%)"
              description: "/volume1 사용률이 80% 초과 지속."
              action: "ssh nas-ugreen \"df -h /volume1 /volume2\" → docker system df·로그·백업 순으로 대용량 정리"

  # TI-NODE-004. [디스크] NodeDiskCritical 발화 — /volume1 95%(avail=5) > 90%, 3m, PAGE 승격 (AC-3a / REQ-NE-007)
  - interval: 60s
    input_series:
      - series: 'node_filesystem_avail_bytes{mountpoint="/volume1",fstype="ext4"}'
        values: '5+0x4'
      - series: 'node_filesystem_size_bytes{mountpoint="/volume1",fstype="ext4"}'
        values: '100+0x4'
    alert_rule_test:
      - eval_time: 3m
        groupname: node-resource
        alertname: NodeDiskCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              component: node
              mountpoint: /volume1
              fstype: ext4
              tier: PAGE
            exp_annotations:
