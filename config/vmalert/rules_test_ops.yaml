# =============================================================================
# vmalert 룰 유닛테스트 — 운영 — 안전 모드(SYSALERT-001)·시장지표 기본 소스 중단(MI)·NAS 자원(node-resource, INFRA-NODE-001)
# =============================================================================
# 실행(전체): ./run-unittests.sh          — 파일별 docker 병렬 실행(권장)
#   또는: vmalert-tool unittest --files='/rules/rules_test_*.yaml'  (순차, CWD=config/vmalert 마운트)
# 실행(이 파일만): docker run --rm -v "$PWD":/rules victoriametrics/vmalert-tool:v1.145.0 \
#     unittest --files=/rules/rules_test_ops.yaml
# rule_files 는 본 파일 기준 상대경로(rules.yml = 같은 디렉토리).
#
# [시간 모델] unittest의 time()은 eval_time(초, 0=epoch 기준)과 동일.
#   "X시간 경과"는 last_update 계열을 0으로 두고 eval_time 을 X시간보다 크게 잡아 재현한다.
#   `+0xN` = 동일값 N+1개(30s 간격). 시리즈 길이는 eval_time 이상이어야 한다.
# [REQ-WM-025] 모든 alert에 tier(PAGE|TICKET) 라벨이 부여되므로 exp_labels에 tier를 명시한다
#   (누락 시 vmalert-tool이 라벨 불일치로 FAILED 처리).
# =============================================================================

rule_files:
  - rules.yml

evaluation_interval: 30s

tests:
  # ====================================================================
  # SPEC-OBSV-SYSALERT-001 / SPEC-COLLECTOR-SAFEMODEGAUGE-001: collector-safemode 룰 유닛테스트
  # ===========================================================================
  # 검증 목표(상태형 게이지 aaa_collector_safe_mode_active 전환, aaa-infra#85):
  #   TI-SAFEMODE-001: CollectorSafeModeEntered(token) — active==1 firing → 0 지속 시 resolved 전이(AC-9)
  #   TI-SAFEMODE-002: CollectorSafeModeEntered(ws)    — active==1 firing → 0 지속 시 resolved 전이(AC-10)
  #   TI-SAFEMODE-003: [해제 포착] exit() 미경유(TTL 자연 만료) 해제도 게이지 1→0으로 resolved —
  #                    구 SM-2(CollectorSafeModeExited, exit_total 기반)가 절대 못 잡던 경로를 대체
  #   TI-SAFEMODE-004: [미발화] active 상시 0(안전 모드 꺼짐) → 진입 알림 미발화
  #   TI-SAFEMODE-005: [완충] active 순간 1→0→1(단일 스크레이프 0) → keep_firing_for로 firing 유지(REQ-SMG-017)
  #
  # [시간 모델] evaluation_interval 30s. expr은 게이지 순시값 비교(active==1)이므로
  #   increase() range가 아니라 값 자체로 firing 판정한다. for:0m → 조건 충족 즉시 발화.
  #   keep_firing_for:2m(=4주기) — expr 매칭이 끊겨도 마지막 매칭 후 2m 동안 firing을 유지하며,
  #   2m 내내 0을 유지해야 resolved로 전이한다(순간 1~2주기 0은 완충으로 firing 유지).
  #   `1+0xN` = 값 1을 N+1개(30s 간격) 반복. exit_total/enter_total 참조는 전면 제거됨.
  # ===========================================================================

  # TI-SAFEMODE-001. [전이, SM-1a token] active==1 firing → 0 지속(완충 초과) 후 resolved(AC-9).
  #   values '1+0x10 0+0x15' = t=0..300s: 1(활성), t=330..780s: 0(해제).
  #   firing@300s(active==1) → 마지막 매칭 300s + keep_firing_for 120s = 420s까지 firing 유지 →
  #   480s(>420s, 0을 완충 내내 유지)에 resolved.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_safe_mode_active{module="token",alias="isa"}'
        values: '1+0x10 0+0x15'
    alert_rule_test:
      - eval_time: 300s
        groupname: collector-safemode
        alertname: CollectorSafeModeEntered
        exp_alerts:
          - exp_labels:
              severity: critical
              component: collector
              module: token
              alias: isa
              tier: PAGE
            exp_annotations:
              summary: "안전 모드 진입 — KIS 토큰 (계좌 isa)"
              description: "토큰 발급 실패로 계좌 isa의 KIS 호출 차단 중. 1~4시간 백오프 후 자동 재시도 — 짧은 간격 반복 진입이면 앱키 문제 의심."
              action: "collector 로그(진입 원인 예외) → 재발급 성공 로그 또는 redis 키 safe_mode:collector:token:{alias} 소멸 확인"
      - eval_time: 480s
        groupname: collector-safemode
        alertname: CollectorSafeModeEntered
        exp_alerts: []

  # TI-SAFEMODE-002. [전이, SM-1b ws] active==1 firing → 0 지속 후 resolved(AC-10). WS도 동일 상태형 전이.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_safe_mode_active{module="ws",alias="key1"}'
        values: '1+0x10 0+0x15'
    alert_rule_test:
      - eval_time: 300s
        groupname: collector-safemode
        alertname: CollectorSafeModeEntered
        exp_alerts:
          - exp_labels:
              severity: critical
              component: collector
              module: ws
              alias: key1
              tier: PAGE
            exp_annotations:
              summary: "안전 모드 진입 — WebSocket (계좌 key1)"
              description: "WebSocket 연결 오류 반복으로 계좌 key1의 재연결 차단 중. WS-RESILIENCE-001 TTL 백오프(1h→2h→4h)로 자동 복구 — 수동 삭제도 가능."
              action: "collector 로그(진입 원인 예외) → 원인 해소 후 TTL 백오프 자동 복구 대기 또는 redis 키 safe_mode:collector:ws:{alias} 수동 삭제(TECHSPEC §1.3)"
      - eval_time: 480s
        groupname: collector-safemode
        alertname: CollectorSafeModeEntered
        exp_alerts: []

  # TI-SAFEMODE-003. [해제 포착] exit() 미경유 해제(TTL 자연 만료)도 게이지 1→0으로 resolved 포착.
  #   구 SM-2(CollectorSafeModeExited, exit_total 기반)는 exit() 호출 경로만 잡아 TTL 만료 해제를
  #   영원히 놓쳤다(이슈#85 핵심 결함). 상태형 게이지는 해제 경로 무관하게 firing→resolved로 포착한다.
  #   values '1+0x6 0+0x15' = t=0..180s: 1, t=210..660s: 0. firing@180s → 300s까지 완충 → 420s resolved.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_safe_mode_active{module="token",alias="isa"}'
        values: '1+0x6 0+0x15'
    alert_rule_test:
      - eval_time: 180s
        groupname: collector-safemode
        alertname: CollectorSafeModeEntered
        exp_alerts:
          - exp_labels:
              severity: critical
              component: collector
              module: token
              alias: isa
              tier: PAGE
            exp_annotations:
              summary: "안전 모드 진입 — KIS 토큰 (계좌 isa)"
              description: "토큰 발급 실패로 계좌 isa의 KIS 호출 차단 중. 1~4시간 백오프 후 자동 재시도 — 짧은 간격 반복 진입이면 앱키 문제 의심."
              action: "collector 로그(진입 원인 예외) → 재발급 성공 로그 또는 redis 키 safe_mode:collector:token:{alias} 소멸 확인"
      - eval_time: 420s
        groupname: collector-safemode
        alertname: CollectorSafeModeEntered
        exp_alerts: []

  # TI-SAFEMODE-004. [미발화] active 상시 0(안전 모드 꺼짐) → 진입 알림 미발화. 게이지 모델에서
  #   active==1 매칭이 한 번도 없으므로 firing 자체가 성립하지 않음(구 enter_total==0 음성 케이스의 대체).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_safe_mode_active{module="token",alias="isa"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 330s
        groupname: collector-safemode
        alertname: CollectorSafeModeEntered
        exp_alerts: []

  # TI-SAFEMODE-005. [완충, REQ-SMG-017/AC-17] active 순간 1→0→1(단일 스크레이프 0 = Redis 순간
  #   예외 또는 TTL 만료 직후 재진입 gap 모사) → keep_firing_for 완충으로 즉시 resolved 미전이.
  #   values '1+0x5 0 1+0x10' = t=0..150s: 1, t=180s: 0(순간), t=210..510s: 1.
  #   180s에서 active==1 매칭이 없어도 마지막 매칭 150s + 완충 120s 내이므로 firing 유지 → 즉시
  #   resolved 안 됨. 210s에 값이 1로 복귀해 firing 지속. (완충 duration 값 자체는 AC-17 검증 대상 아님.)
  - interval: 30s
    input_series:
      - series: 'aaa_collector_safe_mode_active{module="token",alias="isa"}'
        values: '1+0x5 0 1+0x10'
    alert_rule_test:
      - eval_time: 180s
        groupname: collector-safemode
        alertname: CollectorSafeModeEntered
        exp_alerts:
          - exp_labels:
              severity: critical
              component: collector
              module: token
              alias: isa
              tier: PAGE
            exp_annotations:
              summary: "안전 모드 진입 — KIS 토큰 (계좌 isa)"
              description: "토큰 발급 실패로 계좌 isa의 KIS 호출 차단 중. 1~4시간 백오프 후 자동 재시도 — 짧은 간격 반복 진입이면 앱키 문제 의심."
              action: "collector 로그(진입 원인 예외) → 재발급 성공 로그 또는 redis 키 safe_mode:collector:token:{alias} 소멸 확인"
      - eval_time: 210s
        groupname: collector-safemode
        alertname: CollectorSafeModeEntered
        exp_alerts:
          - exp_labels:
              severity: critical
              component: collector
              module: token
              alias: isa
              tier: PAGE
            exp_annotations:
              summary: "안전 모드 진입 — KIS 토큰 (계좌 isa)"
              description: "토큰 발급 실패로 계좌 isa의 KIS 호출 차단 중. 1~4시간 백오프 후 자동 재시도 — 짧은 간격 반복 진입이면 앱키 문제 의심."
              action: "collector 로그(진입 원인 예외) → 재발급 성공 로그 또는 redis 키 safe_mode:collector:token:{alias} 소멸 확인"

  # ===========================================================================
  # 룰 11: collector-market-indicator — MarketIndicatorPrimaryStale (Family MI, 2026-07-10 재설계)
  # SPEC-COLLECTOR-MARKETIND-002, MarketIndicatorExhausted는 2026-07-10 삭제(워터마크 일원화).
  # [2026-07-14 SPEC-COLLECTOR-WARMSTART-REDIS-003 M2] `> 0` 가드 제거에 맞춰 케이스 갱신:
  #   TI-WM-MI-002는 "가드 억제"(무발화)에서 "가드 제거 후 정상 발화"로 반전. TI-WM-MI-004(warm-start
  #   복원 후 정상 발화)·TI-WM-MI-005(전면 Redis 유실 시 구조적 침묵)를 신규 추가(REQ-WSR-026~028).
  # [2026-07-17 SPEC-COLLECTOR-MARKETIND-004 후속] 소스별 2룰 분할 반영: KOREAEXIM 룰 좌변이
  #   batch="market-usdkrw"(화~토 10:30 전용 배치)로 재배선 — KOREAEXIM 케이스(MI-001/-004)의 좌변
  #   시리즈 라벨 교체. CBOE 케이스(MI-002/-003)는 기존 market-indicators 좌변 유지. 신규:
  #   TI-WM-MI-006(KOREAEXIM 1회 실패 24h 관용 무발화)·TI-WM-MI-007(좌변 market-usdkrw 부재 시
  #   구조적 침묵).
  # ===========================================================================
  # 시간 모델: batch_last_load_seconds − source_last_success_seconds > 25h(90000s), for:5m.
  # 두 게이지 모두 상수(시간 경과와 무관) — diff는 값 자체로 고정, for:5m 안정성만 검증하면 됨.

  # TI-WM-MI-001. [발화] 기본 소스(KOREAEXIM) 2회차 실패 — diff=100000s(≈27.8h>25h) 상시 → for:5m 후 발화.
  # 좌변은 2026-07-17 분할로 market-usdkrw(전용 배치) 기준.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="market-usdkrw"}'
        values: '200000+0x15'
      - series: 'aaa_collector_market_indicator_source_last_success_seconds{indicator="USDKRW",source="KOREAEXIM"}'
        values: '100000+0x15'
    alert_rule_test:
      - eval_time: 5m30s
        groupname: collector-market-indicator
        alertname: MarketIndicatorPrimaryStale
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
              tier: TICKET
              indicator: USDKRW
              source: KOREAEXIM
            exp_annotations:
              summary: "시장지표 수집 기본 소스 중단 — USDKRW (KOREAEXIM)"
              description: "USDKRW의 수집 기본 소스 KOREAEXIM가 2회차 이상 연속 실패 — 예비 소스가 대체 수집 중(데이터 결손 없음), 기본 소스 복구 필요(예비 상시화 방지)."
              action: "collector 로그(usdkrw 전용 배치 화~토 10:30, KOREAEXIM 실패 사유) → market_indicators 테이블 source 컬럼으로 실제 적재 소스 확인"

  # TI-WM-MI-002. [발화, `>0` 가드 제거 검증] source_last_success=0(한 번도 성공한 적 없는 기본 소스) →
  # diff가 25h 초과이면 가드 제거 후 정상 발화한다(#88 결함 해소 — 이전엔 가드가 이 케이스를 영구 침묵시켰음).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="market-indicators"}'
        values: '200000+0x15'
      - series: 'aaa_collector_market_indicator_source_last_success_seconds{indicator="VIX",source="CBOE"}'
        values: '0+0x15'
    alert_rule_test:
      - eval_time: 5m30s
        groupname: collector-market-indicator
        alertname: MarketIndicatorPrimaryStale
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
              tier: TICKET
              indicator: VIX
              source: CBOE
            exp_annotations:
              summary: "시장지표 수집 기본 소스 중단 — VIX (CBOE)"
              description: "VIX의 수집 기본 소스 CBOE가 2회차 이상 연속 실패 — 예비 소스가 대체 수집 중(데이터 결손 없음), 기본 소스 복구 필요(예비 상시화 방지)."
              action: "collector 로그(market-indicators 배치 평일 17:05, CBOE 실패 사유) → market_indicators 테이블 source 컬럼으로 실제 적재 소스 확인"

  # TI-WM-MI-003. [무발화, 1회 실패 용인] diff=86400s(24h, 정확히 1회차 계단) → 25h 미초과로 미발화(월요일 오탐 소멸 검증 — 이전 24h 벽시계 임계였다면 발화했을 케이스).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="market-indicators"}'
        values: '186400+0x15'
      - series: 'aaa_collector_market_indicator_source_last_success_seconds{indicator="VIX",source="CBOE"}'
        values: '100000+0x15'
    alert_rule_test:
      - eval_time: 5m30s
        groupname: collector-market-indicator
        alertname: MarketIndicatorPrimaryStale
        exp_alerts: []

  # TI-WM-MI-004. [발화, warm-start 복원 시나리오] 게이지가 재기동 시 Redis 값(비영)으로 warm-start된
  # 상태를 재현 — source_last_success가 과거의 non-zero 값으로 유지되고 기본 소스가 25h 초과 지연되면
  # 가드 제거와 무관하게 정상 발화한다(REQ-WSR-021/026, AC-3/AC-7 — 정상 케이스가 가드 제거로 영향받지
  # 않음을 검증). 좌변은 2026-07-17 분할로 market-usdkrw 기준.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="market-usdkrw"}'
        values: '250000+0x15'
      - series: 'aaa_collector_market_indicator_source_last_success_seconds{indicator="USDKRW",source="KOREAEXIM"}'
        values: '150000+0x15'
    alert_rule_test:
      - eval_time: 5m30s
        groupname: collector-market-indicator
        alertname: MarketIndicatorPrimaryStale
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
              tier: TICKET
              indicator: USDKRW
              source: KOREAEXIM
            exp_annotations:
              summary: "시장지표 수집 기본 소스 중단 — USDKRW (KOREAEXIM)"
              description: "USDKRW의 수집 기본 소스 KOREAEXIM가 2회차 이상 연속 실패 — 예비 소스가 대체 수집 중(데이터 결손 없음), 기본 소스 복구 필요(예비 상시화 방지)."
              action: "collector 로그(usdkrw 전용 배치 화~토 10:30, KOREAEXIM 실패 사유) → market_indicators 테이블 source 컬럼으로 실제 적재 소스 확인"

  # TI-WM-MI-005. [무발화, 전면 Redis 유실 — 구조적 침묵] 좌변(batch_last_load)·우변(source_last_success)
  # 모두 부재(시리즈 자체가 없음, 값 0이 아님) → 뺄셈이 빈 벡터가 되어 규칙이 발화할 수 없다(REQ-WSR-027,
  # AC-8). `> 0` 가드 제거 후에도 전면 유실 시 오발하지 않음을 검증하는 핵심 안전망 케이스(분할된 2룰
  # 모두 좌변 부재로 침묵).
  - interval: 30s
    input_series: []
    alert_rule_test:
      - eval_time: 5m30s
        groupname: collector-market-indicator
        alertname: MarketIndicatorPrimaryStale
        exp_alerts: []

  # TI-WM-MI-006. [무발화, KOREAEXIM 1회 실패 관용] diff=86400s(24h, 정확히 1회차 계단) → 25h 미초과로
  # 미발화 — 좌변 market-usdkrw 재배선으로 24h 계단이 복원됐음을 검증(재배선 전에는 스케줄 skew 6.6h가
  # 더해져 1회 실패에 30.6h>25h로 즉시 발화했음, 2026-07-17 분할의 핵심 목적).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="market-usdkrw"}'
        values: '186400+0x15'
      - series: 'aaa_collector_market_indicator_source_last_success_seconds{indicator="USDKRW",source="KOREAEXIM"}'
        values: '100000+0x15'
    alert_rule_test:
      - eval_time: 5m30s
        groupname: collector-market-indicator
        alertname: MarketIndicatorPrimaryStale
        exp_alerts: []

  # TI-WM-MI-007. [무발화, 좌변 단독 부재 — 구조적 침묵] market-usdkrw 좌변 시리즈 부재 + KOREAEXIM
  # 우변 존재 → KOREAEXIM 룰의 뺄셈이 빈 벡터가 되어 침묵. CBOE 룰도 좌변(market-indicators) 부재로
  # 침묵. (배포 전이 구간·Redis 부분 유실에서 오발하지 않음을 고정)
  - interval: 30s
    input_series:
      - series: 'aaa_collector_market_indicator_source_last_success_seconds{indicator="USDKRW",source="KOREAEXIM"}'
        values: '100000+0x15'
    alert_rule_test:
      - eval_time: 5m30s
        groupname: collector-market-indicator
        alertname: MarketIndicatorPrimaryStale
        exp_alerts: []

  # ===========================================================================
  # 룰 10: node-resource — NAS 호스트 자원(디스크·RAM·CPU) (SPEC-INFRA-NODE-001)
  # ===========================================================================
  # interval: 60s (node-resource 그룹 평가 주기).
  # 디스크 ratio: node_filesystem_size_bytes=100, node_filesystem_avail_bytes=<값>으로 사용률 재현.
  # RAM: MemTotal=100, MemAvailable=<값>. CPU: node_load5=<값>(4코어, load/4=사용률).
  # warning for:5m → eval_time 6m. critical for:2m → eval_time 3m. 미발화: 임계 직하값.

  # TI-NODE-001. [디스크] NodeDiskWarning1 발화 — /volume1 75%(avail=25) > 70%, 6m (AC-3a / REQ-NE-005)
  - interval: 60s
    input_series:
      - series: 'node_filesystem_avail_bytes{mountpoint="/volume1",fstype="ext4"}'
        values: '25+0x7'
      - series: 'node_filesystem_size_bytes{mountpoint="/volume1",fstype="ext4"}'
        values: '100+0x7'
    alert_rule_test:
      - eval_time: 6m
        groupname: node-resource
        alertname: NodeDiskWarning1
        exp_alerts:
          - exp_labels:
              severity: warning
              component: node
              mountpoint: /volume1
              fstype: ext4
              tier: TICKET
            exp_annotations:
              summary: "NAS 디스크 사용률 1단계 — /volume1 (75%)"
              description: "/volume1 사용률이 70% 초과 지속."
              action: "ssh nas-ugreen \"df -h /volume1 /volume2\" → docker system df·로그·백업 순으로 대용량 정리"

  # TI-NODE-002. [디스크] NodeDiskWarning1 미발화 — /volume1 60%(avail=40) < 70%, 6m (AC-3b / REQ-NE-005)
  - interval: 60s
    input_series:
      - series: 'node_filesystem_avail_bytes{mountpoint="/volume1",fstype="ext4"}'
        values: '40+0x7'
      - series: 'node_filesystem_size_bytes{mountpoint="/volume1",fstype="ext4"}'
        values: '100+0x7'
    alert_rule_test:
      - eval_time: 6m
        groupname: node-resource
        alertname: NodeDiskWarning1
        exp_alerts: []

  # TI-NODE-003. [디스크] NodeDiskWarning2 발화 — /volume1 85%(avail=15) > 80%, 6m (AC-3a / REQ-NE-006)
  - interval: 60s
    input_series:
      - series: 'node_filesystem_avail_bytes{mountpoint="/volume1",fstype="ext4"}'
        values: '15+0x7'
      - series: 'node_filesystem_size_bytes{mountpoint="/volume1",fstype="ext4"}'
        values: '100+0x7'
    alert_rule_test:
      - eval_time: 6m
        groupname: node-resource
        alertname: NodeDiskWarning2
        exp_alerts:
          - exp_labels:
              severity: warning
              component: node
              mountpoint: /volume1
              fstype: ext4
              tier: TICKET
            exp_annotations:
              summary: "NAS 디스크 사용률 2단계 — /volume1 (85%)"
              description: "/volume1 사용률이 80% 초과 지속."
              action: "ssh nas-ugreen \"df -h /volume1 /volume2\" → docker system df·로그·백업 순으로 대용량 정리"

  # TI-NODE-004. [디스크] NodeDiskCritical 발화 — /volume1 95%(avail=5) > 90%, 3m, PAGE 승격 (AC-3a / REQ-NE-007)
  - interval: 60s
    input_series:
      - series: 'node_filesystem_avail_bytes{mountpoint="/volume1",fstype="ext4"}'
        values: '5+0x4'
      - series: 'node_filesystem_size_bytes{mountpoint="/volume1",fstype="ext4"}'
        values: '100+0x4'
    alert_rule_test:
      - eval_time: 3m
        groupname: node-resource
        alertname: NodeDiskCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              component: node
              mountpoint: /volume1
              fstype: ext4
              tier: PAGE
            exp_annotations:
              summary: "NAS 디스크 사용률 3단계 — /volume1 (95%)"
              description: "/volume1 사용률이 90% 초과 지속 — 쓰기 실패 임박, 즉시 공간 확보 필요."
              action: "ssh nas-ugreen \"df -h /volume1 /volume2\" → docker system df·로그·백업 순으로 대용량 정리"

  # TI-NODE-005. [디스크 absent] 시계열 부재 → NodeDiskWarning1 미발화 — 구조적 억제(AC-6 / REQ-NE-014)
  - interval: 60s
    input_series: []
    alert_rule_test:
      - eval_time: 6m
        groupname: node-resource
        alertname: NodeDiskWarning1
        exp_alerts: []

  # TI-NODE-006/007 제거 2026-07-18: 1단계(80%) 룰을 rules.yml에서 주석 처리하며 대응 테스트도 삭제.
  # 원문은 git history 참조(TODO: 16GB RAM 업그레이드 후 룰·테스트 함께 복원).

  # TI-NODE-008. [RAM] NodeMemoryWarning2 발화 — 92%(MemAvailable=8) > 90%, 11m (AC-4a / REQ-NE-009, 2026-07-05 임계 상향)
  - interval: 60s
    input_series:
      - series: 'node_memory_MemAvailable_bytes'
        values: '8+0x12'
      - series: 'node_memory_MemTotal_bytes'
        values: '100+0x12'
    alert_rule_test:
      - eval_time: 11m
        groupname: node-resource
        alertname: NodeMemoryWarning2
        exp_alerts:
          - exp_labels:
              severity: warning
              component: node
              tier: TICKET
            exp_annotations:
              summary: "NAS 메모리 사용률 2단계 — 92%"
              description: "호스트 메모리 사용률이 90% 초과 지속."
              action: "ssh nas-ugreen \"free -h && docker stats --no-stream\" → 과다 사용 컨테이너 식별"

  # TI-NODE-009. [RAM] NodeMemoryCritical 발화 — 97%(MemAvailable=3) > 95%, 4m, PAGE 승격 (AC-4a / REQ-NE-010, 2026-07-05 임계 상향)
  - interval: 60s
    input_series:
      - series: 'node_memory_MemAvailable_bytes'
        values: '3+0x5'
      - series: 'node_memory_MemTotal_bytes'
        values: '100+0x5'
    alert_rule_test:
      - eval_time: 4m
        groupname: node-resource
        alertname: NodeMemoryCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              component: node
              tier: PAGE
            exp_annotations:
              summary: "NAS 메모리 사용률 3단계 — 97%"
              description: "호스트 메모리 사용률이 95% 초과 지속 — OOM Killer가 컨테이너를 강제 종료할 위험."
              action: "ssh nas-ugreen \"free -h && docker stats --no-stream\" → 과다 사용 컨테이너 식별"

  # TI-NODE-010. [CPU] NodeCpuWarning1 발화 — load5=3.0(75%) > 70%, 6m (AC-5a / REQ-NE-011)
  - interval: 60s
    input_series:
      - series: 'node_load5'
        values: '3.0+0x7'
    alert_rule_test:
      - eval_time: 6m
        groupname: node-resource
        alertname: NodeCpuWarning1
        exp_alerts:
          - exp_labels:
              severity: warning
              component: node
              tier: TICKET
            exp_annotations:
              summary: "NAS CPU 부하 1단계 — 75%"
              description: "5분 부하평균(코어 대비)이 70% 초과 지속 — 디스크 I/O 대기도 포함되는 지표라 CPU가 아닌 I/O 병목일 수 있음."
              action: "ssh nas-ugreen \"uptime && docker stats --no-stream\" → 부하 원인 컨테이너·I/O 확인"

  # TI-NODE-011. [CPU] NodeCpuWarning1 미발화 — load5=2.4(60%) < 70%, 6m (AC-5b / REQ-NE-011)
  - interval: 60s
    input_series:
      - series: 'node_load5'
        values: '2.4+0x7'
    alert_rule_test:
      - eval_time: 6m
        groupname: node-resource
        alertname: NodeCpuWarning1
        exp_alerts: []

  # TI-NODE-012. [CPU] NodeCpuWarning2 발화 — load5=3.6(90%>85%), 6m (AC-5a / REQ-NE-012)
  - interval: 60s
    input_series:
      - series: 'node_load5'
        values: '3.6+0x7'
    alert_rule_test:
      - eval_time: 6m
        groupname: node-resource
        alertname: NodeCpuWarning2
        exp_alerts:
          - exp_labels:
              severity: warning
              component: node
              tier: TICKET
            exp_annotations:
              summary: "NAS CPU 부하 2단계 — 90%"
              description: "5분 부하평균(코어 대비)이 85% 초과 지속 — 디스크 I/O 대기도 포함되는 지표라 CPU가 아닌 I/O 병목일 수 있음."
              action: "ssh nas-ugreen \"uptime && docker stats --no-stream\" → 부하 원인 컨테이너·I/O 확인"

  # TI-NODE-013. [CPU] NodeCpuCritical 발화 — load5=3.8(95%) > 90%, 3m (AC-5a / REQ-NE-013)
  - interval: 60s
    input_series:
      - series: 'node_load5'
        values: '3.8+0x4'
    alert_rule_test:
      - eval_time: 3m
        groupname: node-resource
        alertname: NodeCpuCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              component: node
              tier: TICKET
            exp_annotations:
              summary: "NAS CPU 부하 3단계 — 95%"
              description: "5분 부하평균(코어 대비)이 90% 초과 지속 — 디스크 I/O 대기도 포함되는 지표라 CPU가 아닌 I/O 병목일 수 있음. CPU는 TICKET 유지(오탐성)."
              action: "ssh nas-ugreen \"uptime && docker stats --no-stream\" → 부하 원인 컨테이너·I/O 확인"

  # TI-NODE-014. [디스크 다단계 동시 발화] 95%(avail=5) — W1·W2·Critical 동시 발화(6m) (AC-3a / REQ-NE-005~007)
  # 주의: vmalert-tool은 alertname 필터로 단일 alert 검증. 3개 alertname을 각각 alert_rule_test 항목으로 분리.
  - interval: 60s
    input_series:
      - series: 'node_filesystem_avail_bytes{mountpoint="/volume1",fstype="ext4"}'
        values: '5+0x7'
      - series: 'node_filesystem_size_bytes{mountpoint="/volume1",fstype="ext4"}'
        values: '100+0x7'
    alert_rule_test:
      - eval_time: 6m
        groupname: node-resource
        alertname: NodeDiskWarning1
        exp_alerts:
          - exp_labels:
              severity: warning
              component: node
              mountpoint: /volume1
              fstype: ext4
              tier: TICKET
            exp_annotations:
              summary: "NAS 디스크 사용률 1단계 — /volume1 (95%)"
              description: "/volume1 사용률이 70% 초과 지속."
              action: "ssh nas-ugreen \"df -h /volume1 /volume2\" → docker system df·로그·백업 순으로 대용량 정리"
      - eval_time: 6m
        groupname: node-resource
        alertname: NodeDiskWarning2
        exp_alerts:
          - exp_labels:
              severity: warning
              component: node
              mountpoint: /volume1
              fstype: ext4
              tier: TICKET
            exp_annotations:
              summary: "NAS 디스크 사용률 2단계 — /volume1 (95%)"
              description: "/volume1 사용률이 80% 초과 지속."
              action: "ssh nas-ugreen \"df -h /volume1 /volume2\" → docker system df·로그·백업 순으로 대용량 정리"
      - eval_time: 6m
        groupname: node-resource
        alertname: NodeDiskCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              component: node
              mountpoint: /volume1
              fstype: ext4
              tier: PAGE
            exp_annotations:
              summary: "NAS 디스크 사용률 3단계 — /volume1 (95%)"
              description: "/volume1 사용률이 90% 초과 지속 — 쓰기 실패 임박, 즉시 공간 확보 필요."
              action: "ssh nas-ugreen \"df -h /volume1 /volume2\" → docker system df·로그·백업 순으로 대용량 정리"

  # TI-NODE-015. [게이트 무관 발화] /volume1 75% + market_open=0(휴장) → NodeDiskWarning1 발화 (AC-7 / REQ-NE-015)
  # market_open=0 시계열을 input_series에 포함해 휴장 상태에서도 알림이 발화함을 기계적으로 증명.
  # node-resource 룰은 market_open과 AND하지 않으므로(REQ-NE-015), 0 입력은 발화에 영향 없음.
  - interval: 60s
    input_series:
      - series: 'node_filesystem_avail_bytes{mountpoint="/volume1",fstype="ext4"}'
        values: '25+0x7'
      - series: 'node_filesystem_size_bytes{mountpoint="/volume1",fstype="ext4"}'
        values: '100+0x7'
      - series: 'aaa_collector_market_open'
        values: '0+0x7'
    alert_rule_test:
      - eval_time: 6m
        groupname: node-resource
        alertname: NodeDiskWarning1
        exp_alerts:
          - exp_labels:
              severity: warning
              component: node
              mountpoint: /volume1
              fstype: ext4
              tier: TICKET
            exp_annotations:
              summary: "NAS 디스크 사용률 1단계 — /volume1 (75%)"
              description: "/volume1 사용률이 70% 초과 지속."
              action: "ssh nas-ugreen \"df -h /volume1 /volume2\" → docker system df·로그·백업 순으로 대용량 정리"

  # ===========================================================================
  # SPEC-OBSV-VLOGS-HEALTH-001: victorialogs-liveness 룰 유닛테스트
  # ===========================================================================
  # T1. up==0 지속 → 90s for 충족 후 발화. 게이트 무관 발화(collector CollectorDown 준용).
  - interval: 30s
    input_series:
      - series: 'up{job="victorialogs"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 120s
        groupname: victorialogs-liveness
        alertname: VictorialogsDown
        exp_alerts:
          - exp_labels:
              severity: critical
              component: victorialogs
              job: victorialogs
              tier: TICKET
            exp_annotations:
              summary: "victorialogs 스크랩 실패(다운) — 90s 연속"
              description: "VictoriaMetrics가 victorialogs /metrics 스크랩에 90s(30s×3) 연속 실패. 게이트 무관 발화."
              action: "ssh nas-ugreen \"docker ps -a | grep victorialogs\" → 컨테이너 기동·재시작 상태 확인. 이상 시 \"docker logs aaa-vector\"로 적재 공백(victorialogs 연결 실패 에러) 확인"

  # T2. up==1(정상) → 미발화.
  - interval: 30s
    input_series:
      - series: 'up{job="victorialogs"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 120s
        groupname: victorialogs-liveness
        alertname: VictorialogsDown
        exp_alerts: []
