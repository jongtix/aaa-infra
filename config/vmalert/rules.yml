# =============================================================================
# vmalert 알림 룰 — collector 수집 정상성 판정 (Prometheus alerting-rule 포맷)
# SPEC-COLLECTOR-OBSV-001 TI-003 + TI-004 / SPEC-OBSV-WATERMARK-001 M2(REQ-WM-016~028)
# =============================================================================
# vmalert가 `-rule=/etc/vmalert/rules.yml`로 로드한다.
# 런타임 마운트: ${AAA_SSD_BASE}/config/vmalert/rules.yml → /etc/vmalert/rules.yml:ro
#
# 메트릭 노출명은 collector 소스 Grep 실측(tasks-infra [D5]) — 추론 금지:
#   aaa_collector_market_open                        (gauge 1/0, batch 라벨 없음)
#   aaa_collector_market_gate_last_update_seconds    (gauge KST epoch, 부팅 후 미갱신 시 0.0)
#   aaa_collector_batch_completeness_ratio           (gauge, label batch)
#   aaa_collector_batch_last_load_seconds            (gauge KST epoch, label batch)
#   up{job="collector"}                              (VM 스크랩 합성 메트릭)
#
#   [SPEC-OBSV-WATERMARK-001 M1, 2026-07-05] 신규 게이지(collector 배포 후 노출, M2 룰이 소비):
#   aaa_collector_data_watermark_seconds{series, market}      (gauge, KST 자정 epoch, forward-only, 17시계열)
#   aaa_collector_expected_watermark_seconds{market}          (gauge, KST 자정 epoch, absent=캘린더 미로드/gate 미완료)
#   aaa_collector_data_coverage_ratio{series}                 (gauge, 0~1, daily-ohlcv-krx/us만 ACTIVE)
#   aaa_collector_backfill_pending_slots                      (gauge, 라벨 없음, PENDING+IN_PROGRESS만)
#   aaa_collector_backfill_clamp_suspected_total              (counter, 라벨 없음)
#   aaa_collector_backfill_windows_total                      (counter, 라벨 없음)
#   aaa_collector_tick_last_seen_seconds{symbol, market}      (gauge, market="domestic"|"overseas")
#   aaa_collector_tick_active_subscriptions                   (gauge, 국내+해외 합산, 라벨 없음)
#   aaa_collector_us_market_open                              (gauge 1/0, 반일 13:00 ET 이후 0 보정)
#   aaa_collector_us_market_gate_holiday_count                (gauge, fail-open 가드용, >=20 정상)
#   aaa_collector_batch_silent_drops_total                    (counter, 라벨 없음, 총합만)
#
# 휴장 억제(REQ-043) 핵심 = `and on() aaa_collector_market_open == 1` 조인:
#   market_open 은 batch 라벨이 없고 batch 메트릭은 batch 라벨이 있어 라벨셋이 다르다.
#   `and on()`(공집합 매칭)으로 라벨 무시 교집합을 만들어 "장중일 때만" 게이팅한다.
#   게이트가 0이거나 market_open 시계열이 부재(absent)하면 `and on() ...==1`이 빈 벡터가 되어
#   (a)/(b) 룰은 발화하지 않는다 → 휴장/게이트부재 자동 억제(REQ-043 구조적 충족).
#
# [SPEC-OBSV-WATERMARK-001 REQ-WM-025] 모든 알림에 tier 라벨(PAGE|TICKET)을 부여한다.
#   PAGE = 최소 핵심셋: CollectorDown, 데드맨(워터마크 시계열 소실), 일봉 워터마크 KRX/US 신선도,
#   국내·해외 틱 침묵, 안전모드 진입, 시장지표 전소스 탈진. 나머지 전부 TICKET(§8 결정 1+4).
#   Alertmanager가 tier 라벨로 [PAGE]/[TICKET] 텔레그램 접두어 라우팅을 수행한다(alertmanager.yml).
#
# [SPEC-OBSV-WATERMARK-001 REQ-WM-024 배치 라벨 매핑 참고, research.md §2 실측]
#   series(워터마크 사전) ≠ batch(실행완료 라벨). 예: series=investor-trend → batch=domestic-supply-investor,
#   series=credit-balance → batch=domestic-supply-credit-balance, series=short-sale-domestic →
#   batch=domestic-supply-short-sale, series=analyst-estimates → batch=domestic-invest-opinion,
#   series=macro-ecos/macro-fred → 단일 batch=macro-external(공유 스케줄러). series=market-vix/market-usdkrw는
#   전용 batch 라벨이 없음(market-indicators 7종 묶음 + group11 source-chain으로만 감시, Exclusion 4) —
#   REQ-WM-024 제거 대상에 market-vix가 명시되어 있으나 대응하는 batch 실행 룰 자체가 없어 조치 불필요.
#   series=daily-ohlcv-krx/us(batch=domestic-daily/overseas-daily)는 REQ-WM-024 제거 목록에 없으므로
#   기존 실행 신선도(그룹 2 28h·그룹 5 100h)를 워터마크 PAGE 룰과 이중 안전망으로 그대로 유지한다.

groups:
  # ---------------------------------------------------------------------------
  # 그룹 1: collector 생존 — 게이트 무관(휴장 중에도 발화)
  # ---------------------------------------------------------------------------
  - name: collector-liveness
    # 평가 주기: 스크랩 30s와 정합
    interval: 30s
    rules:
      # TI-003 collector-down: 연속 스크랩 실패(30s×3=90s)
      # [D1·HARD] job="collector"는 scrape.yml의 job_name: collector와 일치 필수.
      - alert: CollectorDown
        expr: up{job="collector"} == 0
        for: 90s
        labels:
          severity: critical
          component: collector
          tier: PAGE
        annotations:
          summary: "collector 스크랩 실패(다운) — 90s 연속"
          description: "VictoriaMetrics가 collector /actuator/prometheus 스크랩에 90s(30s×3) 연속 실패. 게이트 무관 발화."

  # ---------------------------------------------------------------------------
  # 그룹 2: 수집 미달/정지 — 장중 게이트 ANDing(휴장 억제)
  # [SPEC-OBSV-WATERMARK-001] REQ-WM-023: CollectorBatchCompletenessLow 폐기(#66 구조적 오탐,
  #   커버리지+워터마크 신선도가 대체, AC-1). REQ-WM-024: ACTIVE 전환된 시리즈의 batch 라벨을
  #   추가 제외(이중 감시 정리) — domestic-supply-investor/credit-balance/short-sale, macro-external,
  #   domestic-invest-opinion. 신규 Module E 라벨(extended-hours/corp-code/dart-backfill) 제외
  #   — 전용 그룹(아래)에서 별도 임계로 처리하므로 기본 28h 룰과 이중 발화하지 않도록 필터.
  #   overseas-news/overseas-rights는 기존 `overseas-.*` 패턴에 이미 포함되어 자동 제외.
  # ---------------------------------------------------------------------------
  - name: collector-collection-gap
    interval: 30s
    rules:
      # TI-004b 신선도 갭: 마지막 적재 후 경과 > 28h AND 장중
      # 28h = 일1회 배치 cron(~24h) + 마진(spec AC-8, M5 튜닝 전제).
      # [SPEC-OBSV-BATCH-COVERAGE-001] batch 필터: 100h·8d·1h·무게이트 임계 배치는 별도 그룹에서 처리.
      #   overseas-*(100h 무게이트), domestic-financial-ratio/etf-representative(8d), domestic-news(1h),
      #   watchlist-sync-us(28h 무게이트) 제외.
      # [SPEC-OBSV-WATERMARK-001 REQ-WM-024] 추가 제외: 워터마크 신선도 ACTIVE 전환으로 실행 신선도가
      #   중복이 된 라벨(domestic-supply-investor/credit-balance/short-sale, macro-external,
      #   domestic-invest-opinion) + 신규 Module E 라벨(extended-hours/corp-code/dart-backfill, 전용
      #   그룹에서 별도 처리).
      # [유지보수] aaa-collector에 신규 스케줄러 추가 시:
      #   기본 28h+gate 임계 → 이 필터 변경 불필요.
      #   커스텀 임계(100h/18d/8d/1h 등) → 이 정규식에 추가 AND 별도 그룹 생성. 누락 시 오발.
      - alert: CollectorBatchStale
        expr: |
          ((time() - aaa_collector_batch_last_load_seconds{batch!~"overseas-.*|domestic-financial-ratio|domestic-etf-representative|domestic-news|watchlist-sync-us|domestic-supply-investor|domestic-supply-credit-balance|domestic-supply-short-sale|domestic-invest-opinion|macro-external|extended-hours|corp-code|dart-backfill"}) > 28 * 3600)
          and on() (aaa_collector_market_open == 1)
        for: 5m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "배치 신선도 갭 — {{ $labels.batch }} > 28h 미적재"
          description: "장중(market_open==1) 배치 {{ $labels.batch }} 마지막 적재 후 28h 초과 경과. 휴장 시 억제됨."

  # ---------------------------------------------------------------------------
  # 그룹 3: 게이트 신선도 — 억제·collector-down과 독립 발화(REQ-046)
  # ---------------------------------------------------------------------------
  - name: collector-gate-health
    interval: 30s
    rules:
      # TI-004d 게이트-staleness: 게이트가 set 된 적 있으나(>0) 30h 초과 미갱신.
      # 게이트 신선도 임계 30h = spec.md §2.4 REQ-034 단일 출처(게이트 cron 일1회 ~24h + 마진 6h).
      # [HARD] `> 0` 가드: boot-unset(==0)을 제외 — x=0이면 time()-x는 항상 30h 초과라 오발하므로 분리.
      # [D3] cron 연속 실패는 별도 카운터 없이 이 staleness가 포섭(last-update 정지=stale).
      - alert: CollectorGateStale
        expr: |
          ((time() - aaa_collector_market_gate_last_update_seconds) > 30 * 3600)
          and (aaa_collector_market_gate_last_update_seconds > 0)
        for: 5m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "시장 세션 게이트 stale — 30h 초과 미갱신"
          description: "collector UP이나 게이트 last-update가 30h 초과 미갱신(cron 침묵 실패 포함). 억제·다운과 독립 발화."

      # TI-004d boot-unset: 게이트가 부팅 후 한 번도 설정되지 않음(==0).
      # [D3·HARD] `for: 26h` — 게이트 cron은 일1회(~24h). 26h(24h 사이클 + 마진 2h) 동안 줄곧 0이면
      #   "한 사이클이 지나도 게이트가 끝내 설정되지 않음"으로 판정. 매 부팅/배포 직후에는
      #   다음 cron(최대 ~24h 내)이 곧 게이트를 set 하므로 26h 임계를 넘기지 못해 오발하지 않는다.
      - alert: CollectorGateUnset
        expr: aaa_collector_market_gate_last_update_seconds == 0
        for: 26h
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "시장 세션 게이트 미설정 고착 — 부팅 후 26h 미갱신"
          description: "게이트 last-update가 부팅 후 26h(>1 cron 사이클) 동안 0 유지. 부팅 직후 오발 방지용 26h for 적용."

  # ---------------------------------------------------------------------------
  # 그룹 4: WebSocket 구독 무음 — 장중 틱 수집 완전 중단 탐지(SPEC-OBSV-WEBSOCKET-001)
  # ---------------------------------------------------------------------------
  - name: collector-websocket
    interval: 30s
    rules:
      # TI-WS-001~004 장중 구독 0 → 3m 지속 시 발화. 장외·absent 시 억제.
      # `and on() (aaa_collector_market_open == 1)` — 기존 휴장 억제 패턴 재사용.
      # market_open 이 국내 전용이므로 발화 범위는 국내 장중으로 한정된다.
      # tick_active_subscriptions absent 시 expr이 빈 벡터 → 구조적 억제(REQ-003).
      - alert: CollectorWebSocketNoSubscription
        expr: |
          (aaa_collector_tick_active_subscriptions == 0)
          and on() (aaa_collector_market_open == 1)
        for: 3m
        labels:
          severity: critical
          component: collector
          tier: TICKET
        annotations:
          summary: "국내 WebSocket 구독 종목 0 — 틱 수집 완전 중단"
          description: "장중(market_open==1)에 tick_active_subscriptions가 3분 이상 0. WebSocket 장 개시 실패 또는 전체 구독 해제 의심."

      # TI-WS-005~011 장중 특정 alias 세션 끊김 → 5m 지속 시 발화. 장외·absent 시 억제.
      # severity: warning — 특정 alias 부분 장애(full critical은 CollectorWebSocketNoSubscription).
      # `and on() (aaa_collector_market_open == 1)` — 기존 휴장 억제 패턴 재사용(REQ-002).
      # alias 라벨 벡터 매칭으로 alias별 개별 발화(REQ-004). CollectorWebSocketNoSubscription과 독립(REQ-005).
      - alert: CollectorWebSocketSessionDisconnected
        expr: |
          (aaa_collector_websocket_session_connected == 0)
          and on() (aaa_collector_market_open == 1)
        for: 5m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "WebSocket 세션 연결 끊김 — {{ $labels.alias }}"
          description: "장중(market_open==1) alias={{ $labels.alias }} 세션이 5분 이상 disconnected 상태. partial failure 의심."

  # ---------------------------------------------------------------------------
  # 그룹 5: 해외(미국) 일봉·공매도 Daily stale — 100h 무억제
  # SPEC-OBSV-BATCH-COVERAGE-001 REQ-007/008
  # [SPEC-OBSV-WATERMARK-001] daily-ohlcv-us(overseas-daily)는 워터마크 PAGE 룰과 이중 안전망으로 유지.
  #   short-sale-overseas-daily(overseas-shortsale-daily)는 워터마크 신선도 O-1 잔여(aaa-infra#77 미해소)라
  #   본 그룹이 유일한 감시망 — 활성 유지 필수(REQ-WM-017 §4.2).
  # ---------------------------------------------------------------------------
  # overseas-daily(OverseasDailyOhlcvScheduler, MON-FRI 16:30 ET) +
  # overseas-shortsale-daily(ShortSaleOverseasScheduler, MON-FRI 10:00 ET)
  # MON-FRI 잡이라 국내 market_open 억제가 주말 커버 불가 → 무억제.
  # 100h = 정상 주말 갭(72h) + 미국 3일 연휴 최대 갭(96h) + 마진 4h.
  # absent 시 `time()-absent`가 빈 벡터 → REQ-010 구조적 억제.
  - name: collector-collection-gap-overseas
    interval: 30s
    rules:
      - alert: CollectorBatchStale
        expr: |
          (time() - aaa_collector_batch_last_load_seconds{batch=~"overseas-daily|overseas-shortsale-daily"}) > 100 * 3600
        for: 5m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "해외 배치 신선도 갭 — {{ $labels.batch }} > 100h 미적재"
          description: "해외(미국) MON-FRI 배치 {{ $labels.batch }} 마지막 적재 후 100h 초과 경과(정상 주말 72h·3일 연휴 96h + 마진 4h). 게이트 억제 없음(REQ-007/008)."

  # ---------------------------------------------------------------------------
  # 그룹 6: 해외 공매도 잔고(반월) stale — 18d 무억제
  # SPEC-OBSV-BATCH-COVERAGE-001 REQ-009
  # [SPEC-OBSV-WATERMARK-001 MI-01] short-sale-overseas-interest는 반월 주기라 워터마크 신선도 룰을
  #   두지 않는다(§3) — 본 그룹이 유일한 감시망, 반드시 유지.
  # ---------------------------------------------------------------------------
  # overseas-shortsale-interest(ShortSaleOverseasScheduler Interest, 반월 미국장).
  # FINRA Equity Short Interest 공시 주기 ~15~16일 + 공시 지연 마진 → 18d.
  # absent 시 구조적 억제(REQ-010).
  - name: collector-collection-gap-overseas-interest
    interval: 30s
    rules:
      - alert: CollectorBatchStale
        expr: |
          (time() - aaa_collector_batch_last_load_seconds{batch="overseas-shortsale-interest"}) > 18 * 24 * 3600
        for: 5m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "해외 공매도 잔고 신선도 갭 — overseas-shortsale-interest > 18d 미적재"
          description: "FINRA 반월 공매도 잔고 마지막 적재 후 18일 초과 경과(반월 주기 15~16일 + 공시 지연 마진). 게이트 억제 없음(REQ-009)."

  # ---------------------------------------------------------------------------
  # 그룹 7: 국내 주간 배치 stale — 8d + 장중 게이트
  # SPEC-OBSV-BATCH-COVERAGE-001 REQ-005
  # [SPEC-OBSV-WATERMARK-001] 이벤트성 테이블(financials/etf_representative_history)은 워터마크·
  #   커버리지 제외 대상(Exclusion 1) — 본 그룹이 유일한 감시망, 유지.
  # ---------------------------------------------------------------------------
  # domestic-financial-ratio(FinancialRatioScheduler, 토요일 08:00 KST) +
  # domestic-etf-representative(EtfRepresentativeScheduler, 월요일 07:50 KST)
  # completeness 미적용(운영 관찰 전 stale-only, §3.3).
  # 8d = 7일 주기 + 마진 1일. 장중 억제 재사용(REQ-005).
  - name: collector-collection-gap-weekly
    interval: 30s
    rules:
      - alert: CollectorBatchStale
        expr: |
          ((time() - aaa_collector_batch_last_load_seconds{batch=~"domestic-financial-ratio|domestic-etf-representative"}) > 8 * 24 * 3600)
          and on() (aaa_collector_market_open == 1)
        for: 5m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "주간 배치 신선도 갭 — {{ $labels.batch }} > 8d 미적재"
          description: "장중(market_open==1) 주간 배치 {{ $labels.batch }} 마지막 적재 후 8일(7일 주기 + 마진 1일) 초과 경과. 휴장 시 억제됨(REQ-005)."

  # ---------------------------------------------------------------------------
  # 그룹 8: 국내 뉴스 배치 stale — 1h + 장중 게이트
  # SPEC-OBSV-BATCH-COVERAGE-001 REQ-006
  # [SPEC-OBSV-WATERMARK-001 Exclusion 7] news-domestic은 일-grain 워터마크 신선도 대상이 아니므로
  #   본 실행 신선도(1h)가 유일한 감시망 — 유지.
  # ---------------------------------------------------------------------------
  # domestic-news(NewsScheduler, 장중 10분 간격 09~15시 KST MON-FRI).
  # 발행량 변동이 커 completeness 비적용, stale-only(§3.3 REQ-006).
  # 1h = 10분 주기 기준 6회 연속 실패 허용 + 마진.
  # 뉴스 수집창(09~15시)이 market_open과 겹치므로 동일 억제 패턴 재사용.
  - name: collector-collection-gap-news
    interval: 30s
    rules:
      - alert: CollectorBatchStale
        expr: |
          ((time() - aaa_collector_batch_last_load_seconds{batch="domestic-news"}) > 1 * 3600)
          and on() (aaa_collector_market_open == 1)
        for: 5m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "뉴스 배치 신선도 갭 — domestic-news > 1h 미적재"
          description: "장중(market_open==1) 뉴스 배치 10분 주기 수집이 1h 이상 중단됨. 휴장 시 억제됨(REQ-006)."

  # ---------------------------------------------------------------------------
  # 그룹 9: 미국 관심종목 동기화 stale — 28h 무억제(무게이트)
  # SPEC-OBSV-BATCH-COVERAGE-001 REQ-013
  # ---------------------------------------------------------------------------
  # watchlist-sync-us(WatchlistSyncScheduler.syncUs, 매일 ET 08:50 — MON-FRI 아닌 매일).
  # WatchlistSyncService.sync()가 휴장 가드 없이 무조건 돌아 주말 갭이 없으므로 100h 아닌 28h 적용.
  # 국내 market_open이 ET 스케줄과 무관 → 게이트 억제 제거(무게이트 stale-only).
  # 28h = 24h 매일 주기 + 마진 4h. absent 시 구조적 억제(REQ-010).
  - name: collector-collection-gap-watchlist-us
    interval: 30s
    rules:
      - alert: CollectorBatchStale
        expr: |
          (time() - aaa_collector_batch_last_load_seconds{batch="watchlist-sync-us"}) > 28 * 3600
        for: 5m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "미국 관심종목 동기화 신선도 갭 — watchlist-sync-us > 28h 미적재"
          description: "미국 관심종목 동기화(매일 ET 08:50) 마지막 적재 후 28h 초과 경과. 매일 잡이라 주말 갭 없음. 게이트 억제 없음(REQ-013)."

  # ---------------------------------------------------------------------------
  # 그룹 9a: 해외 뉴스 실행 신선도 — 1h + US 세션 게이트(신규, REQ-WM-024)
  # ---------------------------------------------------------------------------
  # overseas-news(OverseasNewsScheduler, ET 10분 폴링 09~16시 MON-FRI).
  # us_market_open 게이팅 + holiday_count>=20 가드(fail-open 방지, 국내 domestic-news 그룹8 대칭 클래스).
  # 워터마크 신선도 대상 아님(일-grain 한계, Exclusion 7) — 본 룰이 유일한 감시망.
  - name: collector-collection-gap-overseas-news
    interval: 30s
    rules:
      - alert: CollectorBatchStale
        expr: |
          ((time() - aaa_collector_batch_last_load_seconds{batch="overseas-news"}) > 1 * 3600)
          and on() (aaa_collector_us_market_open == 1)
          and on() (aaa_collector_us_market_gate_holiday_count >= 20)
        for: 5m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "해외 뉴스 배치 신선도 갭 — overseas-news > 1h 미적재"
          description: "US 세션 중(us_market_open==1, holiday_count>=20) 해외 뉴스 배치 10분 주기 수집이 1h 이상 중단됨(REQ-WM-024)."

  # ---------------------------------------------------------------------------
  # 그룹 9b: MON-FRI 무게이트 100h 배치 — overseas-rights + extended-hours(신규, REQ-WM-024)
  # ---------------------------------------------------------------------------
  # overseas-rights(OverseasRightsScheduler, ET 일1회 17:00 MON-FRI) — corporate_events 기록,
  #   워터마크 대상 아님(이벤트성, Exclusion 1) — 본 룰이 유일한 감시망.
  # extended-hours(ExtendedHoursScheduler pre+after 공유 라벨, ET 10:00/20:30 MON-FRI) — 실행 신선도
  #   백스톱(REQ-WM-013). 데이터 신선도는 워터마크 시리즈 extended-hours-pre/after(즉시형 6h)가 별도 추적하며,
  #   본 룰은 "스케줄러 자체가 실행됐는가"를 감시하는 독립 안전망(제거 불변식과 무관하게 유지, REQ-WM-013).
  # MON-FRI 잡이라 국내 market_open 억제가 주말 커버 불가 → 무억제(그룹5 100h와 동일 클래스).
  - name: collector-collection-gap-nogate-100h
    interval: 30s
    rules:
      - alert: CollectorBatchStale
        expr: |
          (time() - aaa_collector_batch_last_load_seconds{batch=~"overseas-rights|extended-hours"}) > 100 * 3600
        for: 5m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "무게이트 배치 신선도 갭 — {{ $labels.batch }} > 100h 미적재"
          description: "MON-FRI 배치 {{ $labels.batch }} 마지막 적재 후 100h 초과 경과(정상 주말 72h·3일 연휴 96h + 마진 4h). 게이트 억제 없음(REQ-WM-024)."

  # ---------------------------------------------------------------------------
  # 그룹 9c: 매일 무게이트 28h 배치 — corp-code + dart-backfill(신규, REQ-WM-024)
  # ---------------------------------------------------------------------------
  # corp-code(CorpCodeUpdateScheduler, KST 매일 07:30) — DART corp_code 매핑, 시계열 아님(MI-07).
  # dart-backfill(DartDisclosureBackfillScheduler, KST 매일 04:30) — disclosures 테이블에 과거 날짜만
  #   기록(forward-only watermark라 dart-disclosure와 이중 writer 안전, REQ-WM-013 MA-03).
  # 매일 잡이라 주말 갭 없음(watchlist-sync-us 그룹9 클래스와 동일) → 28h 무게이트.
  - name: collector-collection-gap-nogate-28h
    interval: 30s
    rules:
      - alert: CollectorBatchStale
        expr: |
          (time() - aaa_collector_batch_last_load_seconds{batch=~"corp-code|dart-backfill"}) > 28 * 3600
        for: 5m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "무게이트 배치 신선도 갭 — {{ $labels.batch }} > 28h 미적재"
          description: "매일 배치 {{ $labels.batch }} 마지막 적재 후 28h 초과 경과. 매일 잡이라 주말 갭 없음. 게이트 억제 없음(REQ-WM-024)."

  # ---------------------------------------------------------------------------
  # 그룹 W1: 워터마크 데드맨 스위치 — REQ-WM-016
  # ---------------------------------------------------------------------------
  # PAGE 대상 시리즈(daily-ohlcv-krx/us) 중 하나라도 소실되거나, 17시계열 사전 전체가 부족하면 발화.
  # `for: 10m` — 스크랩 staleness(~5m)보다 길게 잡아 CollectorDown과의 중복 발화를 억제한다(MI-08,
  #   Alertmanager inhibit 대안 채택 — 별도 inhibit_rule 미도입).
  - name: collector-watermark-deadman
    interval: 30s
    rules:
      - alert: CollectorWatermarkSeriesMissing
        expr: |
          absent(aaa_collector_data_watermark_seconds{series="daily-ohlcv-krx"})
          or absent(aaa_collector_data_watermark_seconds{series="daily-ohlcv-us"})
        for: 10m
        labels:
          severity: critical
          component: collector
          tier: PAGE
        annotations:
          summary: "PAGE 대상 워터마크 시계열 소실 — daily-ohlcv-krx/us"
          description: "aaa_collector_data_watermark_seconds{series=\"daily-ohlcv-krx\" 또는 \"daily-ohlcv-us\"}가 10분 이상 부재. 단일 시리즈 소실 감시(REQ-WM-016)."

      # [유지보수 HARD] 임계 17은 §3 사전(시리즈 사전) 크기와 동기화되어야 한다.
      #   시리즈 사전에 항목을 추가/제거하면 이 임계값을 함께 갱신할 것(MI-05).
      - alert: CollectorWatermarkSeriesCountLow
        expr: count(aaa_collector_data_watermark_seconds) < 17
        for: 10m
        labels:
          severity: critical
          component: collector
          tier: PAGE
        annotations:
          summary: "워터마크 시계열 개수 부족 — {{ $value }} < 17"
          description: "aaa_collector_data_watermark_seconds 노출 시계열 수가 사전 크기(17) 미만으로 10분 이상 지속. 부분 소실 감시(REQ-WM-016)."

  # ---------------------------------------------------------------------------
  # 그룹 W2: 워터마크 신선도 — 즉시형(REQ-WM-017 §4.1)
  # ---------------------------------------------------------------------------
  # (expected - on(market) group_right data_watermark{series=...}) > 0 이 deadline 동안 지속되면 발화.
  # group_right — data_watermark(시장당 여러 series)가 "many"측, expected(시장당 1개)가 "one"측이므로
  #   many측 라벨(series 포함)이 결과 벡터에 자동 보존된다.
  - name: collector-watermark-freshness-immediate
    interval: 30s
    rules:
      # daily-ohlcv-krx/us — PAGE, 4h(§4.1)
      - alert: CollectorWatermarkFreshnessStalePage
        expr: |
          (aaa_collector_expected_watermark_seconds
           - on(market) group_right aaa_collector_data_watermark_seconds{series=~"daily-ohlcv-krx|daily-ohlcv-us"}
          ) > 0
        for: 4h
        labels:
          severity: critical
          component: collector
          tier: PAGE
        annotations:
          summary: "일봉 워터마크 신선도 갭 — {{ $labels.series }} 4h 초과"
          description: "expected_watermark 대비 data_watermark({{ $labels.series }})가 세션 마감 후 4h 이상 뒤처짐(REQ-WM-017 즉시형, PAGE)."

      # market-usdkrw / investor-trend / short-sale-domestic — TICKET, 4h
      - alert: CollectorWatermarkFreshnessStaleTicket4h
        expr: |
          (aaa_collector_expected_watermark_seconds
           - on(market) group_right aaa_collector_data_watermark_seconds{series=~"market-usdkrw|investor-trend|short-sale-domestic"}
          ) > 0
        for: 4h
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "워터마크 신선도 갭 — {{ $labels.series }} 4h 초과"
          description: "expected_watermark 대비 data_watermark({{ $labels.series }})가 세션 마감 후 4h 이상 뒤처짐(REQ-WM-017 즉시형)."

      # extended-hours-pre / extended-hours-after — TICKET, 6h(US 마감 기산)
      - alert: CollectorWatermarkFreshnessStaleTicket6h
        expr: |
          (aaa_collector_expected_watermark_seconds
           - on(market) group_right aaa_collector_data_watermark_seconds{series=~"extended-hours-pre|extended-hours-after"}
          ) > 0
        for: 6h
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "워터마크 신선도 갭 — {{ $labels.series }} 6h 초과"
          description: "expected_watermark(US) 대비 data_watermark({{ $labels.series }})가 US 세션 마감 후 6h 이상 뒤처짐(REQ-WM-017 즉시형)."

      # disclosures — TICKET, 8h
      - alert: CollectorWatermarkFreshnessStaleTicket8h
        expr: |
          (aaa_collector_expected_watermark_seconds
           - on(market) group_right aaa_collector_data_watermark_seconds{series="disclosures"}
          ) > 0
        for: 8h
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "워터마크 신선도 갭 — disclosures 8h 초과"
          description: "expected_watermark 대비 data_watermark(disclosures)가 세션 마감 후 8h 이상 뒤처짐(REQ-WM-017 즉시형)."

      # market-vix — TICKET, 24h
      - alert: CollectorWatermarkFreshnessStaleTicket24h
        expr: |
          (aaa_collector_expected_watermark_seconds
           - on(market) group_right aaa_collector_data_watermark_seconds{series="market-vix"}
          ) > 0
        for: 24h
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "워터마크 신선도 갭 — market-vix 24h 초과"
          description: "expected_watermark(US) 대비 data_watermark(market-vix)가 세션 마감 후 24h 이상 뒤처짐(REQ-WM-017 즉시형)."

  # ---------------------------------------------------------------------------
  # 그룹 W3: 워터마크 신선도 — lag 허용형(REQ-WM-017 §4.1)
  # ---------------------------------------------------------------------------
  # 정당한 T+N 지연을 허용하고 초과분만 감지: (expected - watermark) > N일, debounce for:1h.
  - name: collector-watermark-freshness-lag
    interval: 30s
    rules:
      # credit-balance(T+3영업일) / macro-fred(T+2영업일) — TICKET, >6d
      - alert: CollectorWatermarkFreshnessLagStale6d
        expr: |
          (aaa_collector_expected_watermark_seconds
           - on(market) group_right aaa_collector_data_watermark_seconds{series=~"credit-balance|macro-fred"}
          ) > 6 * 24 * 3600
        for: 1h
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "워터마크 lag 허용 초과 — {{ $labels.series }} 6일 초과"
          description: "expected_watermark 대비 data_watermark({{ $labels.series }})가 정당 지연 허용치(6일)를 초과(REQ-WM-017 lag 허용형)."

      # analyst-estimates(T+1 희소) — TICKET, >5d
      - alert: CollectorWatermarkFreshnessLagStale5d
        expr: |
          (aaa_collector_expected_watermark_seconds
           - on(market) group_right aaa_collector_data_watermark_seconds{series="analyst-estimates"}
          ) > 5 * 24 * 3600
        for: 1h
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "워터마크 lag 허용 초과 — analyst-estimates 5일 초과"
          description: "expected_watermark 대비 data_watermark(analyst-estimates)가 정당 지연 허용치(5일)를 초과(REQ-WM-017 lag 허용형)."

      # macro-ecos(잠정) — TICKET, >4d
      - alert: CollectorWatermarkFreshnessLagStale4d
        expr: |
          (aaa_collector_expected_watermark_seconds
           - on(market) group_right aaa_collector_data_watermark_seconds{series="macro-ecos"}
          ) > 4 * 24 * 3600
        for: 1h
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "워터마크 lag 허용 초과 — macro-ecos 4일 초과"
          description: "expected_watermark 대비 data_watermark(macro-ecos)가 정당 지연 허용치(4일, 잠정)를 초과(REQ-WM-017 lag 허용형)."

  # ---------------------------------------------------------------------------
  # 그룹 W4: 워터마크 커버리지 — REQ-WM-018
  # ---------------------------------------------------------------------------
  # ACTIVE 커버리지 시리즈(daily-ohlcv-krx/us만, 유니버스 정제 전제)의 coverage_ratio<0.95가 1h 지속.
  - name: collector-watermark-coverage
    interval: 30s
    rules:
      - alert: CollectorWatermarkCoverageLow
        expr: aaa_collector_data_coverage_ratio{series=~"daily-ohlcv-krx|daily-ohlcv-us"} < 0.95
        for: 1h
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "워터마크 커버리지 미달 — {{ $labels.series }} < 0.95"
          description: "{{ $labels.series }} coverage_ratio {{ $value }} < 0.95가 1h 이상 지속(REQ-WM-018). 일1회 계산이라 해소 후 최대 ~24h 잔류 가능(MI-06)."

  # ---------------------------------------------------------------------------
  # 그룹 W5: 백필 이상 — REQ-WM-019(clamp) / REQ-WM-020(정체)
  # ---------------------------------------------------------------------------
  - name: collector-backfill-anomaly
    interval: 30s
    rules:
      - alert: CollectorBackfillClampSuspected
        expr: increase(aaa_collector_backfill_clamp_suspected_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "백필 clamp 의심 — 1h 내 증가"
          description: "aaa_collector_backfill_clamp_suspected_total이 1h 내 증가. KIS 응답 클램프로 인한 조기 COMPLETED 오판 의심(REQ-WM-019)."

      # pending_slots(PENDING+IN_PROGRESS)>0 이면서 26h 동안 windows_total 무전진 → 정체.
      # FAILED 종결·전량 COMPLETED 시 pending_slots=0이 되어 발화하지 않는다(MI-09).
      - alert: CollectorBackfillStalled
        expr: |
          (aaa_collector_backfill_pending_slots > 0)
          and (increase(aaa_collector_backfill_windows_total[26h]) == 0)
        for: 5m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "백필 정체 — pending_slots > 0 그리고 26h 무전진"
          description: "미완료 백필 슬롯이 잔존하나 26h 동안 windows_total 증가 없음(REQ-WM-020). progress_ratio 절대값으로는 판단하지 않음(lazy 시딩 분모 증가 시 정당 하락)."

  # ---------------------------------------------------------------------------
  # 그룹 W6: 틱 침묵 — REQ-WM-021(국내) / REQ-WM-028(해외)
  # ---------------------------------------------------------------------------
  - name: collector-tick-silence
    interval: 30s
    rules:
      # 국내 장중 구독>0인데 국내 틱이 300초 이상 침묵(absent 포함) → PAGE.
      - alert: CollectorTickSilentDomestic
        expr: |
          (aaa_collector_market_open == 1)
          and on() (aaa_collector_tick_active_subscriptions > 0)
          and on() (
            absent(aaa_collector_tick_last_seen_seconds{market="domestic"})
            or (time() - max(aaa_collector_tick_last_seen_seconds{market="domestic"}) > 300)
          )
        for: 0m
        labels:
          severity: critical
          component: collector
          tier: PAGE
        annotations:
          summary: "국내 틱 침묵 — 300초 이상 무수신"
          description: "국내 장중(market_open==1) 구독>0 상태에서 tick_last_seen_seconds{market=\"domestic\"}가 300초 이상 갱신되지 않거나 부재(REQ-WM-021, absent-aware)."

      # US 세션 중(holiday_count>=20 가드) 구독>0인데 해외 틱이 300초 이상 침묵(absent 포함) → PAGE.
      # 반일 조기폐장 오탐은 REQ-WM-030(us_market_open 13:00 ET 이후 0 보정)이 해소.
      - alert: CollectorTickSilentOverseas
        expr: |
          (aaa_collector_us_market_open == 1)
          and on() (aaa_collector_us_market_gate_holiday_count >= 20)
          and on() (aaa_collector_tick_active_subscriptions > 0)
          and on() (
            absent(aaa_collector_tick_last_seen_seconds{market="overseas"})
            or (time() - max(aaa_collector_tick_last_seen_seconds{market="overseas"}) > 300)
          )
        for: 0m
        labels:
          severity: critical
          component: collector
          tier: PAGE
        annotations:
          summary: "해외 틱 침묵 — 300초 이상 무수신"
          description: "US 세션 중(us_market_open==1, holiday_count>=20) 구독>0 상태에서 tick_last_seen_seconds{market=\"overseas\"}가 300초 이상 갱신되지 않거나 부재(REQ-WM-028, 결정 4)."

  # ---------------------------------------------------------------------------
  # 그룹 W7: silent_drops — REQ-WM-022
  # ---------------------------------------------------------------------------
  - name: collector-silent-drops
    interval: 30s
    rules:
      - alert: CollectorSilentDropsDetected
        expr: increase(aaa_collector_batch_silent_drops_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "silent_drops 증가 — 1h 내 발생"
          description: "aaa_collector_batch_silent_drops_total(총합, 라벨 없음)이 1h 내 증가. INSERT IGNORE 중복 제외분 감시(REQ-WM-022)."

  # ---------------------------------------------------------------------------
  # 그룹 10: 안전 모드 진입/해제 — SPEC-OBSV-SYSALERT-001
  # ---------------------------------------------------------------------------
  # collector가 KIS 토큰·WebSocket 안전 모드에 진입/해제할 때 즉시 경보.
  # 메트릭: SafeModeManager.enter()/exit()가 Micrometer counter를 증가시킨다.
  # for: 0m — 안전 모드는 즉시 알림이 필요하며 지속 시간 조건 불필요.
  - name: collector-safemode
    interval: 30s
    rules:
      - alert: CollectorSafeModeEntered
        expr: increase(aaa_collector_safe_mode_enter_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
          component: collector
          tier: PAGE
        annotations:
          summary: "수집기 안전 모드 진입 — {{ $labels.module }}/{{ $labels.alias }}"
          description: "5분 내 안전 모드 진입 감지. 원인 확인 → 수동 해제 필요 (TECHSPEC §1.3 수동 개입 절차 참조)."

      - alert: CollectorSafeModeExited
        expr: increase(aaa_collector_safe_mode_exit_total[5m]) > 0
        for: 0m
        labels:
          severity: info
          component: collector
          tier: TICKET
        annotations:
          summary: "수집기 안전 모드 해제 — {{ $labels.module }}/{{ $labels.alias }}"
          description: "안전 모드 해제 감지. 정상 수집 재개 여부를 확인하세요."

  # ---------------------------------------------------------------------------
  # 그룹 11: 시장지표 소스 체인 Fallback 가시성 — SPEC-COLLECTOR-MARKETIND-002
  # ---------------------------------------------------------------------------
  # REQ-014: Primary 소스(KOREAEXIM/CBOE) 28h+ 미수집 경보 (State-Driven)
  # REQ-015: 전 소스 탈진 즉시 경보 (Unwanted)
  # 두 룰 모두 기존 system-bot-telegram receiver 사용.
  - name: collector-market-indicator
    interval: 30s
    rules:
      # REQ-014: Primary 소스(KOREAEXIM/CBOE) staleness > 28h AND market_open == 1
      # `> 0` 가드: boot-unset(==0) 제외 — 초기값 0이면 time()-0 항상 28h 초과라 오발 방지.
      - alert: MarketIndicatorPrimaryStale
        expr: >
          (
            (time() - aaa_collector_market_indicator_source_last_success_seconds{source=~"KOREAEXIM|CBOE"}) > 28 * 3600
          ) and (
            aaa_collector_market_indicator_source_last_success_seconds{source=~"KOREAEXIM|CBOE"} > 0
          ) and on() aaa_collector_market_open == 1
        for: 0m
        labels:
          severity: warning
          tier: TICKET
        annotations:
          summary: "시장지표 Primary 소스({{ $labels.source }}) 28시간 이상 미수집"
          description: "indicator={{ $labels.indicator }}, source={{ $labels.source }}"

      # REQ-015: 전 소스 탈진 즉시 경보 (5분 내 increase > 0)
      - alert: MarketIndicatorExhausted
        expr: increase(aaa_collector_market_indicator_exhausted_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
          tier: PAGE
        annotations:
          summary: "시장지표 소스 체인 전원 탈진 — {{ $labels.indicator }} {{ $labels.method }}"
          description: "indicator={{ $labels.indicator }}, method={{ $labels.method }}"

  # ---------------------------------------------------------------------------
  # 그룹 12: NAS 호스트 자원 — 디스크·RAM·CPU 3단계 (SPEC-INFRA-NODE-001)
  # ---------------------------------------------------------------------------
  # 게이트 무관·24h 상시. 디스크는 mountpoint 라벨(/volume1·/volume2)로 각각 발화.
  # CPU = node_load5/4 (N100 4코어 하드코딩, §5 V-1). absent 시 비교식 빈 벡터로 구조적 억제(REQ-NE-014).
  # 다단계 동시 발화: 임계 초과 시 해당하는 모든 단계가 동시에 발화한다(예: 95% → W1+W2+Critical).
  # 의도적 설계 — AM inhibit 룰 제외(§6). 상위 알림이 유실되더라도 하위 알림이 보장된다.
  # [SPEC-OBSV-WATERMARK-001 REQ-WM-026] PAGE 최소 핵심셋에 미포함 — 전부 TICKET.
  - name: node-resource
    interval: 60s
    rules:
      # --- 디스크: /volume[12] 사용률 70/80/90% ---
      - alert: NodeDiskWarning1
        expr: |
          (1 - (node_filesystem_avail_bytes{mountpoint=~"/volume[12]",fstype!~"tmpfs|overlay|devtmpfs"}
                / node_filesystem_size_bytes{mountpoint=~"/volume[12]",fstype!~"tmpfs|overlay|devtmpfs"})) > 0.70
        for: 5m
        labels:
          severity: warning
          component: node
          tier: TICKET
        annotations:
          summary: "디스크 사용률 경고(1단계) — {{ $labels.mountpoint }} > 70%"
          description: "{{ $labels.mountpoint }} 사용률 {{ $value | humanizePercentage }} > 70%. 5분 지속."

      - alert: NodeDiskWarning2
        expr: |
          (1 - (node_filesystem_avail_bytes{mountpoint=~"/volume[12]",fstype!~"tmpfs|overlay|devtmpfs"}
                / node_filesystem_size_bytes{mountpoint=~"/volume[12]",fstype!~"tmpfs|overlay|devtmpfs"})) > 0.80
        for: 5m
        labels:
          severity: warning
          component: node
          tier: TICKET
        annotations:
          summary: "디스크 사용률 경고(2단계) — {{ $labels.mountpoint }} > 80%"
          description: "{{ $labels.mountpoint }} 사용률 {{ $value | humanizePercentage }} > 80%. 5분 지속."

      - alert: NodeDiskCritical
        expr: |
          (1 - (node_filesystem_avail_bytes{mountpoint=~"/volume[12]",fstype!~"tmpfs|overlay|devtmpfs"}
                / node_filesystem_size_bytes{mountpoint=~"/volume[12]",fstype!~"tmpfs|overlay|devtmpfs"})) > 0.90
        for: 2m
        labels:
          severity: critical
          component: node
          tier: TICKET
        annotations:
          summary: "디스크 사용률 위험(3단계) — {{ $labels.mountpoint }} > 90%"
          description: "{{ $labels.mountpoint }} 사용률 {{ $value | humanizePercentage }} > 90%. 2분 지속 — 쓰기 실패 임박."

      # --- RAM: 사용률 80/90/95% (8GB NAS 상시 60~70%대 운영 패턴 반영, 2026-07-05 상향) ---
      - alert: NodeMemoryWarning1
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.80
        for: 10m
        labels:
          severity: warning
          component: node
          tier: TICKET
        annotations:
          summary: "RAM 사용률 경고(1단계) — > 80%"
          description: "호스트 메모리 사용률 {{ $value | humanizePercentage }} > 80%. 10분 지속."

      - alert: NodeMemoryWarning2
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.90
        for: 10m
        labels:
          severity: warning
          component: node
          tier: TICKET
        annotations:
          summary: "RAM 사용률 경고(2단계) — > 90%"
          description: "호스트 메모리 사용률 {{ $value | humanizePercentage }} > 90%. 10분 지속."

      - alert: NodeMemoryCritical
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.95
        for: 3m
        labels:
          severity: critical
          component: node
          tier: TICKET
        annotations:
          summary: "RAM 사용률 위험(3단계) — > 95%"
          description: "호스트 메모리 사용률 {{ $value | humanizePercentage }} > 95%. 3분 지속 — OOM Killer 위험."

      # --- CPU: node_load5/4 70/85/90% ---
      # node_load5/4: 5분 부하평균 ÷ 코어수(4, N100 하드코딩). 순수 CPU 사용률이 아닌 프록시.
      # I/O 대기(D 상태) 포함. NAS 디스크 I/O 폭증 시 CPU 부하 없이도 지표 상승 가능(§5 V-1).
      - alert: NodeCpuWarning1
        expr: (node_load5 / 4) > 0.70
        for: 5m
        labels:
          severity: warning
          component: node
          tier: TICKET
        annotations:
          summary: "CPU 부하 경고(1단계) — load5/4 > 70%"
          description: "5분 부하평균/코어수 {{ $value | humanizePercentage }} > 70%. 5분 지속."

      - alert: NodeCpuWarning2
        expr: (node_load5 / 4) > 0.85
        for: 5m
        labels:
          severity: warning
          component: node
          tier: TICKET
        annotations:
          summary: "CPU 부하 경고(2단계) — load5/4 > 85%"
          description: "5분 부하평균/코어수 {{ $value | humanizePercentage }} > 85%. 5분 지속."

      - alert: NodeCpuCritical
        expr: (node_load5 / 4) > 0.90
        for: 2m
        labels:
          severity: critical
          component: node
          tier: TICKET
        annotations:
          summary: "CPU 부하 위험(3단계) — load5/4 > 90%"
          description: "5분 부하평균/코어수 {{ $value | humanizePercentage }} > 90%. 2분 지속."
