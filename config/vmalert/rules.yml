# =============================================================================
# vmalert 알림 룰 — collector 수집 정상성 판정 (Prometheus alerting-rule 포맷)
# SPEC-COLLECTOR-OBSV-001 TI-003 + TI-004 / SPEC-OBSV-WATERMARK-001 M2(REQ-WM-016~028)
# =============================================================================
# vmalert가 `-rule=/etc/vmalert/rules.yml`로 로드한다.
# 런타임 마운트: ${AAA_SSD_BASE}/config/vmalert/rules.yml → /etc/vmalert/rules.yml:ro
#
# 메트릭 노출명은 collector 소스 Grep 실측(tasks-infra [D5]) — 추론 금지:
#   aaa_collector_market_open                        (gauge 1/0, batch 라벨 없음)
#   aaa_collector_market_gate_last_update_seconds    (gauge KST epoch, 부팅 후 미갱신 시 0.0)
#   aaa_collector_batch_completeness_ratio           (gauge, label batch)
#   aaa_collector_batch_last_load_seconds            (gauge KST epoch, label batch)
#   up{job="collector"}                              (VM 스크랩 합성 메트릭)
#
#   [SPEC-OBSV-WATERMARK-001 M1, 2026-07-05] 신규 게이지(collector 배포 후 노출, M2 룰이 소비):
#   aaa_collector_data_watermark_seconds{series, market}      (gauge, KST 자정 epoch, forward-only, 17시계열)
#   aaa_collector_expected_watermark_seconds{market}          (gauge, KST 자정 epoch, absent=캘린더 미로드/gate 미완료)
#   aaa_collector_data_coverage_ratio{series}                 (gauge, 0~1, daily-ohlcv-krx/us만 ACTIVE)
#   aaa_collector_backfill_pending_slots                      (gauge, 라벨 없음, PENDING+IN_PROGRESS만)
#   aaa_collector_backfill_clamp_suspected_total              (counter, 라벨 없음)
#   aaa_collector_backfill_windows_total                      (counter, 라벨 없음)
#   aaa_collector_tick_last_seen_seconds{symbol, market}      (gauge, market="domestic"|"overseas")
#   aaa_collector_tick_active_subscriptions                   (gauge, 국내+해외 합산, 라벨 없음)
#   aaa_collector_us_market_open                              (gauge 1/0, 반일 13:00 ET 이후 0 보정)
#   aaa_collector_us_market_gate_holiday_count                (gauge, fail-open 가드용, >=20 정상)
#   aaa_collector_batch_silent_drops_total                    (counter, 라벨 없음, 총합만)
#   aaa_collector_backfill_early_completion_suspect_total     (counter, 라벨 없음, SPEC-COLLECTOR-BACKFILL-010)
#   aaa_collector_backfill_anomaly_failed_total               (counter, 라벨 없음, SPEC-COLLECTOR-BACKFILL-010)
#   aaa_collector_backfill_below_floor_stocks{series}         (gauge, SPEC-COLLECTOR-BACKFILL-010)
#   aaa_collector_backfill_internal_gap_stocks{series}        (gauge, SPEC-COLLECTOR-BACKFILL-010)
#   aaa_collector_backfill_cap_saturated_total                (counter, 라벨 없음, GROUPC REQ-GC-013)
#   aaa_collector_backfill_covered_walk_anomaly_total{kind}    (counter, kind="front_gap"|"all_rejected"|"calendar_unknown", SPEC-COLLECTOR-BACKFILL-011)
#   aaa_collector_backfill_covered_walk_front_gap_suppressed_total (counter, 라벨 없음, 알림 없음 — 대시보드·검증 전용, SPEC-COLLECTOR-BACKFILL-011)
#
#   [SPEC-OBSV-WATERMARK-002 M1, collector v1.57.0 배포 후 노출, M2(B-2)만 소비]:
#   aaa_collector_expected_watermark_daily_seconds{market="overseas"}  (gauge, KST 자정 epoch, US 일봉
#     D+2 적재 지연 반영한 직전 개장일 기대치. market당 단일 시계열 — 기존 공유 기대 게이지
#     aaa_collector_expected_watermark_seconds와는 별도 메트릭명, 다른 해외 신선도 룰은 영향 없음(REQ-WM2-010).
#     absent=US 게이트 미준비(holiday_count<20), B-2 구조적 억제(REQ-WM2-002)
#
# [2026-07-10 텔레그램 메시지 규격 재설계, aaa-infra#78] annotations에 선택 필드 `action`을 도입한다
#   (없는 룰은 alertmanager 메시지의 "확인:" 줄이 렌더되지 않음 — 점진 도입). 이벤트형(카운터 증분)
#   룰 일부는 `notify: fire_only` 라벨을 부여해 5분 윈도우 소진 등으로 인한 가짜 ✅해소 통지를
#   alertmanager.yml에서 억제한다(대상: SM 3종, SD-1, BF-1/3/4/7 — 각 그룹 주석 참조).
#
#   [SPEC-COLLECTOR-EXPECTED-RUN-001 M1, collector 배포 후 노출, M2 신규 그룹만 소비 — ADD-only,
#    §8.1 확인 게이트 통과 전까지 구 그룹과 병행 실행]:
#   aaa_collector_batch_expected_run_seconds{batch}   (gauge, cron 산출 KST epoch, 순수 함수·휴장 캘린더 무의존,
#                                                       주말엔 직전 슬롯값 고정, 부팅 시 eager 전수 등록)
#   aaa_collector_batch_run_margin_seconds{batch}      (gauge, 배치별 허용 마진 초, 부팅 시 eager 전수 등록)
#   aaa_collector_batch_enrolled                 (gauge, 라벨 없음, 레지스트리 크기 self-updating)
#   aaa_collector_batch_last_data_seconds{batch}       (gauge, KST epoch, 현재 overseas-shortsale-interest만 —
#                                                       success>0 도착 시에만 갱신, 본 세션에서는 미소비)
#
# 휴장 억제(REQ-043) 핵심 = `and on() aaa_collector_market_open == 1` 조인:
#   market_open 은 batch 라벨이 없고 batch 메트릭은 batch 라벨이 있어 라벨셋이 다르다.
#   `and on()`(공집합 매칭)으로 라벨 무시 교집합을 만들어 "장중일 때만" 게이팅한다.
#   게이트가 0이거나 market_open 시계열이 부재(absent)하면 `and on() ...==1`이 빈 벡터가 되어
#   (a)/(b) 룰은 발화하지 않는다 → 휴장/게이트부재 자동 억제(REQ-043 구조적 충족).
#
# [SPEC-OBSV-WATERMARK-001 REQ-WM-025, 2026-07-10 개정] 모든 알림에 tier 라벨(PAGE|TICKET)을 부여한다.
#   PAGE = 최소 핵심셋: CollectorDown, 데드맨(워터마크 시계열 소실), 일봉 워터마크 KRX/US 신선도,
#   국내·해외 틱 침묵, WebSocket 구독 0(틱 침묵 알림의 유일 대체 경보), 안전모드 진입,
#   NAS 디스크·RAM Critical(쓰기 실패·OOM 전조). 나머지 전부 TICKET(§8 결정 1+4, MarketIndicator
#   전소스 탈진은 2026-07-10 룰 삭제로 PAGE 최소 핵심셋에서 제외).
#   Alertmanager가 tier 라벨로 [PAGE]/[TICKET] 텔레그램 접두어 라우팅을 수행한다(alertmanager.yml).
#
# [SPEC-OBSV-WATERMARK-001 REQ-WM-024 배치 라벨 매핑 참고, research.md §2 실측]
#   series(워터마크 사전) ≠ batch(실행완료 라벨). 예: series=investor-trend → batch=domestic-supply-investor,
#   series=credit-balance → batch=domestic-supply-credit-balance, series=short-sale-domestic →
#   batch=domestic-supply-short-sale, series=analyst-estimates → batch=domestic-invest-opinion,
#   series=macro-ecos/macro-fred → 단일 batch=macro-external(공유 스케줄러). series=market-vix는
#   전용 batch 라벨이 없음(market-indicators 6종 묶음 + group11 source-chain으로만 감시, Exclusion 4) —
#   REQ-WM-024 제거 대상에 market-vix가 명시되어 있으나 대응하는 batch 실행 룰 자체가 없어 조치 불필요.
#   series=market-usdkrw는 SPEC-COLLECTOR-MARKETIND-004(2026-07-17)로 전용 batch=market-usdkrw
#   (화~토 10:30 KST, D−1 확정값)를 획득 — 실행 감시는 그룹 2 제외 + expected-run 레지스트리 편입으로
#   이관, group11 KOREAEXIM 룰의 좌변 앵커로도 사용한다.
#   series=daily-ohlcv-krx/us(batch=domestic-daily/overseas-daily)는 REQ-WM-024 제거 목록에 없으므로
#   기존 실행 신선도(그룹 2 28h·그룹 5 100h)를 워터마크 PAGE 룰과 이중 안전망으로 그대로 유지한다.

groups:
  # ---------------------------------------------------------------------------
  # 그룹 1: collector 생존 — 게이트 무관(휴장 중에도 발화)
  # ---------------------------------------------------------------------------
  - name: collector-liveness
    # 평가 주기: 스크랩 30s와 정합
    interval: 30s
    rules:
      # TI-003 collector-down: 연속 스크랩 실패(30s×3=90s)
      # [D1·HARD] job="collector"는 scrape.yml의 job_name: collector와 일치 필수.
      - alert: CollectorDown
        expr: up{job="collector"} == 0
        for: 90s
        labels:
          severity: critical
          component: collector
          tier: PAGE
        annotations:
          summary: "collector 스크랩 실패(다운) — 90s 연속"
          description: "VictoriaMetrics가 collector /actuator/prometheus 스크랩에 90s(30s×3) 연속 실패. 게이트 무관 발화."
          action: "ssh nas-ugreen \"docker ps -a | grep collector\" → 컨테이너 기동·재시작 상태와 collector 파일 로그 확인"

  # ---------------------------------------------------------------------------
  # 그룹 2: 수집 미달/정지 — 장중 게이트 ANDing(휴장 억제)
  # [SPEC-OBSV-WATERMARK-001] REQ-WM-023: CollectorBatchCompletenessLow 폐기(#66 구조적 오탐,
  #   커버리지+워터마크 신선도가 대체, AC-1). REQ-WM-024: ACTIVE 전환된 시리즈의 batch 라벨을
  #   추가 제외(이중 감시 정리) — domestic-supply-investor/credit-balance/short-sale, macro-external,
  #   domestic-invest-opinion. 신규 Module E 라벨(extended-hours/corp-code/dart-backfill) 제외
  #   — 전용 그룹(아래)에서 별도 임계로 처리하므로 기본 28h 룰과 이중 발화하지 않도록 필터.
  #   overseas-news/overseas-rights는 기존 `overseas-.*` 패턴에 이미 포함되어 자동 제외.
  # [SPEC-COLLECTOR-EXPECTED-RUN-001 REQ-XR-020/021] 추가 제외: 게이트-레거시 3배치
  #   (domestic-daily/market-indicators/dart-disclosure — 워터마크가 데이터 신선도를 이미 커버,
  #   실행 감시에서만 제거) + watchlist-sync-krx(라벨 무관 예상-실행 모델로 재분류,
  #   그룹 collector-collection-gap-expected-run이 대체).
  # ---------------------------------------------------------------------------
  - name: collector-collection-gap
    interval: 30s
    rules:
      # TI-004b 신선도 갭: 마지막 적재 후 경과 > 28h AND 장중
      # 28h = 일1회 배치 cron(~24h) + 마진(spec AC-8, M5 튜닝 전제).
      # [SPEC-OBSV-BATCH-COVERAGE-001] batch 필터: 100h·8d·1h·무게이트 임계 배치는 별도 그룹에서 처리.
      #   overseas-*(100h 무게이트), domestic-financial-ratio/etf-representative(8d), domestic-news(1h),
      #   watchlist-sync-us(28h 무게이트) 제외.
      # [SPEC-OBSV-WATERMARK-001 REQ-WM-024] 추가 제외: 워터마크 신선도 ACTIVE 전환으로 실행 신선도가
      #   중복이 된 라벨(domestic-supply-investor/credit-balance/short-sale, macro-external,
      #   domestic-invest-opinion) + 신규 Module E 라벨(extended-hours/corp-code/dart-backfill, 전용
      #   그룹에서 별도 처리).
      # [SPEC-COLLECTOR-EXPECTED-RUN-001 REQ-XR-020/021] 추가 제외: domestic-daily/market-indicators/
      #   dart-disclosure(게이트-레거시, 실행 감시 제거)·watchlist-sync-krx(예상-실행 모델로 재분류).
      # [SPEC-COLLECTOR-MARKETIND-004 후속, 2026-07-17] 추가 제외: market-usdkrw(화~토 10:30 전용 배치) —
      #   주말 갭(토 10:30 → 월 게이트 on ≈45.7h)이 28h 임계와 구조적으로 불합치해 매주 월요일 오발.
      #   실행 감시는 expected-run 모델(collector BatchRunRegistry 편입)이 담당.
      # [2026-07-17 제외 무효 정정] 구 항목 `extended-hours`는 실제 라벨(extended-hours-pre/-after)과
      #   전체 일치하지 않아 제외가 무효였다 — MetricsQL 라벨 정규식은 전체 앵커링되므로 접두 부분일치가
      #   성립하지 않는다(vmalert-tool 프로브 실측). 그 결과 두 라벨이 매주 월요일 장중 이 룰을 오발해
      #   왔다(2026-07-13 월 09:30~15:30 KST firing, ALERTS 이력 실측). 접미사 라벨 2종을 명시 나열로
      #   정정한다. 실행 감시는 expected-run 모델(레지스트리 18·19번)이 이미 전담 중이라 감시 공백 없음.
      #   [유지보수 — 앵커링 주의] 이 정규식의 각 항목은 라벨 값과 "전체 일치"해야 제외된다. 접두어만
      #   쓰면 조용히 무효가 되므로, 신규 배치 라벨 추가 시 정확한 전체 라벨을 나열할 것.
      # [유지보수] aaa-collector에 신규 스케줄러 추가 시:
      #   기본 28h+gate 임계 → 이 필터 변경 불필요.
      #   커스텀 임계(100h/18d/8d/1h 등) → 이 정규식에 추가 AND 별도 그룹 생성. 누락 시 오발.
      - alert: CollectorBatchStale
        expr: |
          ((time() - aaa_collector_batch_last_load_seconds{batch!~"overseas-.*|domestic-financial-ratio|domestic-etf-representative|domestic-news|watchlist-sync-us|domestic-supply-investor|domestic-supply-credit-balance|domestic-supply-short-sale|domestic-invest-opinion|macro-external|extended-hours-pre|extended-hours-after|corp-code|dart-backfill|domestic-daily|market-indicators|dart-disclosure|watchlist-sync-krx|market-usdkrw"}) > 28 * 3600)
          and on() (aaa_collector_market_open == 1)
        for: 5m
        keep_firing_for: 10m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "일일 배치 수집 중단 — {{ $labels.batch }} 28시간 초과 미적재"
          description: "일 1회 배치 {{ $labels.batch }}의 마지막 적재 후 28시간 초과 경과 — 새 데이터 유입 중단. 장중에만 판정하며 휴장 시 억제됨."
          action: "collector 로그({{ $labels.batch }} 실행 오류) → KIS 호출 실패·스케줄 누락 확인"

  # ---------------------------------------------------------------------------
  # 그룹 3: 국장 휴장일 캘린더 건강 — 억제·collector-down과 독립 발화(REQ-046)
  # [2026-07-10] "시장 세션 게이트" 용어를 "국장 휴장일 캘린더"로 치환(실체 명확화 — KIS CTCA0903R
  #   기반 개장일 캘린더, 매일 08:10 KST + 부팅 시 즉시 1회 갱신). GA-1 임계 30h→26h 개정(마진
  #   6h→2h — 갱신은 하루 1회 단발이라 26h 시점이면 이미 사이클 확실 상실, GA-2와 마진 통일).
  # ---------------------------------------------------------------------------
  - name: collector-gate-health
    interval: 30s
    rules:
      # TI-004d 캘린더-staleness: 캘린더가 set 된 적 있으나(>0) 26h 초과 미갱신.
      # 캘린더 신선도 임계 26h = spec.md §2.4 REQ-034 단일 출처(캘린더 cron 일1회 ~24h + 마진 2h,
      # 2026-07-10 30h→26h 개정).
      # [HARD] `> 0` 가드: boot-unset(==0)을 제외 — x=0이면 time()-x는 항상 26h 초과라 오발하므로 분리.
      # [D3] cron 연속 실패는 별도 카운터 없이 이 staleness가 포섭(last-update 정지=stale).
      - alert: CollectorGateStale
        expr: |
          ((time() - aaa_collector_market_gate_last_update_seconds) > 26 * 3600)
          and (aaa_collector_market_gate_last_update_seconds > 0)
        for: 5m
        keep_firing_for: 10m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "국장 휴장일 캘린더 갱신 중단 — 26시간 초과"
          description: "KIS 국장 휴장일 캘린더(매일 08:10 KST 갱신)가 26시간 이상 미갱신 — 직전 캘린더로 동작 중. 방치 시 휴장일을 개장일로 오판해 장중 알림(틱 침묵 등)이 휴장일에 오발 가능."
          action: "collector 로그(08:10 \"시장 세션 게이트 갱신 실패\" 경고) → KIS CTCA0903R 호출 실패 원인(키·네트워크) 확인"

      # TI-004d boot-unset: 캘린더가 부팅 후 한 번도 설정되지 않음(==0).
      # [D3·HARD] `for: 26h` — 캘린더 cron은 일1회(~24h). 26h(24h 사이클 + 마진 2h) 동안 줄곧 0이면
      #   "한 사이클이 지나도 캘린더가 끝내 설정되지 않음"으로 판정. 매 부팅/배포 직후에는
      #   다음 cron(최대 ~24h 내)이 곧 캘린더를 set 하므로 26h 임계를 넘기지 못해 오발하지 않는다.
      - alert: CollectorGateUnset
        expr: aaa_collector_market_gate_last_update_seconds == 0
        for: 26h
        keep_firing_for: 10m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "국장 휴장일 캘린더 미설정 고착 — 부팅 후 26시간"
          description: "부팅 직후 갱신과 다음 08:10 정기 갱신이 모두 실패 — 캘린더 없이 요일·시각만으로 장중 판정 중."
          action: "collector 로그(부팅/08:10 갱신 실패 경고) → KIS CTCA0903R 호출 실패 원인 확인"

  # ---------------------------------------------------------------------------
  # 그룹 4: WebSocket 구독 무음 — 장중 틱 수집 완전 중단 탐지(SPEC-OBSV-WEBSOCKET-001)
  # [2026-07-10 Family TI 확정] TI-3(NoSubscription) TICKET→PAGE 승격(severity/tier 불일치 해소 —
  #   구독 0이면 틱 침묵 PAGE 2종이 `구독>0` 조건으로 억제되는 유일 경보, 틱은 원본 비보관이라
  #   중단 시간만큼 영구 유실). TI-3·TI-4 미장 게이트 확장(국내 market_open 단독은 해외 WS 추가
  #   이전 유산 — OBSV-001) — 국장 또는(미장 세션 중 + holiday_count 가드) 조건으로 확대.
  # ---------------------------------------------------------------------------
  - name: collector-websocket
    interval: 30s
    rules:
      # TI-WS-001~004 장중(국장 또는 미장) 구독 0 → 3m 지속 시 발화. 장외·absent 시 억제.
      # holiday_count>=20 가드 = 미장 캘린더 init 완료 판정 상수와 동일 기준(TI-2 관용구 재사용).
      # tick_active_subscriptions absent 시 expr이 빈 벡터 → 구조적 억제(REQ-003).
      - alert: CollectorWebSocketNoSubscription
        expr: |
          (aaa_collector_tick_active_subscriptions == 0)
          and on() (
            (aaa_collector_market_open == 1)
            or (aaa_collector_us_market_open == 1 and on() aaa_collector_us_market_gate_holiday_count >= 20)
          )
        for: 3m
        keep_firing_for: 10m
        labels:
          severity: critical
          component: collector
          tier: PAGE
        annotations:
          summary: "WebSocket 구독 0 — 틱 수집 전면 중단"
          description: "장중 구독 종목이 3분 이상 0 — 장 개시 구독 실패 또는 전체 구독 해제. 이 상태에선 틱 침묵 알림(도메스틱/해외)도 억제되므로 이 알림이 유일한 경보."
          action: "collector 로그(장 개시 구독·세션 연결) → 복구 후 stream:tick:domestic|overseas 발행 재개 확인"

      # TI-WS-005~011 장중(국장 또는 미장) 특정 alias 세션 끊김 → 5m 지속 시 발화. 장외·absent 시 억제.
      # severity: warning — 특정 alias 부분 장애(full critical은 CollectorWebSocketNoSubscription).
      # alias 라벨 벡터 매칭으로 alias별 개별 발화(REQ-004). CollectorWebSocketNoSubscription과 독립(REQ-005).
      - alert: CollectorWebSocketSessionDisconnected
        expr: |
          (aaa_collector_websocket_session_connected == 0)
          and on() (
            (aaa_collector_market_open == 1)
            or (aaa_collector_us_market_open == 1 and on() aaa_collector_us_market_gate_holiday_count >= 20)
          )
        for: 5m
        keep_firing_for: 10m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "WebSocket 세션 끊김 — {{ $labels.alias }}"
          description: "계좌 {{ $labels.alias }} 세션이 5분 이상 미연결(재연결 실패 지속). 부분 장애 — 다른 계좌 세션·구독은 유지 중."
          action: "collector 로그(해당 alias 재연결) → 구독 수·틱 수신 정상 여부 확인"

  # ---------------------------------------------------------------------------
  # [REMOVED 2026-07-12, SPEC-COLLECTOR-EXPECTED-RUN-001 REQ-XR-022/§8.2] 구 그룹 5
  # (collector-collection-gap-overseas, 100h, overseas-daily/overseas-shortsale-daily)와
  # 구 그룹 6(collector-collection-gap-overseas-interest, 18d, overseas-shortsale-interest)를
  # collector-collection-gap-expected-run(라벨 무관 단일 룰, REQ-XR-019)이 대체 — §8.1 확인
  # 게이트(count(expected_run)==enrolled, ≥24h 연속) 충족 확인 후 제거. overseas-shortsale-daily/
  # -interest는 §7 유일-안전망 4배치이므로 §8.2 순서(추가→검증→제거)를 준수해 제거함.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # 그룹 7: 국내 주간 배치 stale — 8d + 장중 게이트
  # SPEC-OBSV-BATCH-COVERAGE-001 REQ-005
  # [SPEC-OBSV-WATERMARK-001] 이벤트성 테이블(financials/etf_representative_history)은 워터마크·
  #   커버리지 제외 대상(Exclusion 1) — 본 그룹이 유일한 감시망, 유지.
  # ---------------------------------------------------------------------------
  # domestic-financial-ratio(FinancialRatioScheduler, 토요일 08:00 KST) +
  # domestic-etf-representative(EtfRepresentativeScheduler, 월요일 07:50 KST)
  # completeness 미적용(운영 관찰 전 stale-only, §3.3).
  # 8d = 7일 주기 + 마진 1일. 장중 억제 재사용(REQ-005).
  - name: collector-collection-gap-weekly
    interval: 30s
    rules:
      - alert: CollectorBatchStale
        expr: |
          ((time() - aaa_collector_batch_last_load_seconds{batch=~"domestic-financial-ratio|domestic-etf-representative"}) > 8 * 24 * 3600)
          and on() (aaa_collector_market_open == 1)
        for: 5m
        keep_firing_for: 10m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "주간 배치 수집 중단 — {{ $labels.batch }} 8일 초과 미적재"
          description: "주 1회 배치 {{ $labels.batch }}의 마지막 적재 후 8일(주기 7일 + 마진 1일) 초과 경과 — 새 데이터 유입 중단. 휴장 시 억제됨."
          action: "collector 로그(토·월 아침 주간 배치 실행분) → 실행 여부·KIS 오류 확인"

  # ---------------------------------------------------------------------------
  # 그룹 8: 국내 뉴스 배치 stale — 1h + 장중 게이트
  # SPEC-OBSV-BATCH-COVERAGE-001 REQ-006
  # [SPEC-OBSV-WATERMARK-001 Exclusion 7] news-domestic은 일-grain 워터마크 신선도 대상이 아니므로
  #   본 실행 신선도(1h)가 유일한 감시망 — 유지.
  # ---------------------------------------------------------------------------
  # domestic-news(NewsScheduler, 장중 10분 간격 09~15시 KST MON-FRI).
  # 발행량 변동이 커 completeness 비적용, stale-only(§3.3 REQ-006).
  # 1h = 10분 주기 기준 6회 연속 실패 허용 + 마진.
  # 뉴스 수집창(09~15시)이 market_open과 겹치므로 동일 억제 패턴 재사용.
  - name: collector-collection-gap-news
    interval: 30s
    rules:
      - alert: CollectorBatchStale
        expr: |
          ((time() - aaa_collector_batch_last_load_seconds{batch="domestic-news"}) > 1 * 3600)
          and on() (aaa_collector_market_open == 1)
        for: 5m
        keep_firing_for: 10m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "국내 뉴스 수집 중단 — 1시간 초과"
          description: "장중 10분 주기 국내 뉴스 수집이 1시간 이상 중단(연속 6회 실패 상당). 휴장 시 억제됨."
          action: "collector 로그(domestic-news 오류) → KIS 뉴스 API 응답·키 상태 확인"

  # ---------------------------------------------------------------------------
  # 그룹 9: 미국 관심종목 동기화 stale — 28h 무억제(무게이트)
  # SPEC-OBSV-BATCH-COVERAGE-001 REQ-013
  # ---------------------------------------------------------------------------
  # watchlist-sync-us(WatchlistSyncScheduler.syncUs, 매일 ET 08:50 — MON-FRI 아닌 매일).
  # WatchlistSyncService.sync()가 휴장 가드 없이 무조건 돌아 주말 갭이 없으므로 100h 아닌 28h 적용.
  # 국내 market_open이 ET 스케줄과 무관 → 게이트 억제 제거(무게이트 stale-only).
  # 28h = 24h 매일 주기 + 마진 4h. absent 시 구조적 억제(REQ-010).
  - name: collector-collection-gap-watchlist-us
    interval: 30s
    rules:
      - alert: CollectorBatchStale
        expr: |
          (time() - aaa_collector_batch_last_load_seconds{batch="watchlist-sync-us"}) > 28 * 3600
        for: 5m
        keep_firing_for: 10m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "미국 관심종목 동기화 중단 — 28시간 초과"
          description: "매일 ET 08:50 실행되는 미국 관심종목 동기화의 마지막 적재 후 28시간 초과 경과. 매일 잡이라 주말 갭 없음(휴장 억제 없음)."
          action: "collector 로그(watchlist-sync-us 실행분) → 실행 여부·KIS 오류 확인"

  # ---------------------------------------------------------------------------
  # 그룹 9a: 해외 뉴스 실행 신선도 — 1h + US 세션 게이트(신규, REQ-WM-024)
  # ---------------------------------------------------------------------------
  # overseas-news(OverseasNewsScheduler, ET 10분 폴링 09~16시 MON-FRI).
  # us_market_open 게이팅 + holiday_count>=20 가드(fail-open 방지, 국내 domestic-news 그룹8 대칭 클래스).
  # 워터마크 신선도 대상 아님(일-grain 한계, Exclusion 7) — 본 룰이 유일한 감시망.
  - name: collector-collection-gap-overseas-news
    interval: 30s
    rules:
      - alert: CollectorBatchStale
        expr: |
          ((time() - aaa_collector_batch_last_load_seconds{batch="overseas-news"}) > 1 * 3600)
          and on() (aaa_collector_us_market_open == 1)
          and on() (aaa_collector_us_market_gate_holiday_count >= 20)
        for: 5m
        keep_firing_for: 10m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "해외 뉴스 수집 중단 — 1시간 초과"
          description: "미국장 세션 중 10분 주기 해외 뉴스 수집이 1시간 이상 중단. 미장 마감 중엔 억제됨."
          action: "collector 로그(overseas-news 오류) → KIS 해외 뉴스 API 응답·키 상태 확인"

  # ---------------------------------------------------------------------------
  # [REMOVED 2026-07-12, SPEC-COLLECTOR-EXPECTED-RUN-001 REQ-XR-022/§8.2] 구 그룹 9b
  # (collector-collection-gap-nogate-100h, 100h, overseas-rights/extended-hours)와
  # 구 그룹 9c(collector-collection-gap-nogate-28h, 28h, corp-code/dart-backfill)를
  # collector-collection-gap-expected-run(라벨 무관 단일 룰, REQ-XR-019)이 대체. extended-hours-pre/
  # -after는 REQ-XR-014로 레지스트리에 개별 편입되어 그룹9b의 공유 100h 블랭킷 임계보다 정밀한
  # 배치별 마진(§9)으로 감시된다 — 기능 손실 없음. overseas-rights는 §7 유일-안전망 4배치이므로
  # §8.2 순서(추가→검증→제거)를 준수해 제거함.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # 그룹 W1: 워터마크 데드맨 스위치 — REQ-WM-016
  # ---------------------------------------------------------------------------
  # PAGE 대상 시리즈(daily-ohlcv-krx/us) 중 하나라도 소실되거나, 17시계열 사전 전체가 부족하면 발화.
  # `for: 10m` — 스크랩 staleness(~5m)보다 길게 잡아 CollectorDown과의 중복 발화를 억제한다(MI-08,
  #   Alertmanager inhibit 대안 채택 — 별도 inhibit_rule 미도입).
  - name: collector-watermark-deadman
    interval: 30s
    rules:
      - alert: CollectorWatermarkSeriesMissing
        expr: |
          absent(aaa_collector_data_watermark_seconds{series="daily-ohlcv-krx"})
          or absent(aaa_collector_data_watermark_seconds{series="daily-ohlcv-us"})
        for: 10m
        labels:
          severity: critical
          component: collector
          tier: PAGE
        annotations:
          summary: "국내/미국 일봉 워터마크 10분 이상 측정 안 됨"
          description: "데이터가 늦은 게 아니라, 최신 여부를 알려주는 계측값 자체가 사라짐 — 워터마크 계산 로직 이상 의심(REQ-WM-016)."
          action: "collector 로그에서 워터마크 관련 예외 확인. CollectorDown 알림이 없다면 프로세스 자체는 정상 동작 중"

      # [유지보수 HARD] 임계 17은 §3 사전(시리즈 사전) 크기와 동기화되어야 한다.
      #   시리즈 사전에 항목을 추가/제거하면 이 임계값을 함께 갱신할 것(MI-05).
      - alert: CollectorWatermarkSeriesCountLow
        expr: count(aaa_collector_data_watermark_seconds) < 17
        for: 10m
        keep_firing_for: 10m
        labels:
          severity: critical
          component: collector
          tier: PAGE
        annotations:
          summary: "일봉·환율·매매동향·공시 등 워터마크 시계열 개수 부족 — {{ $value }}종만 측정"
          description: "총 17종 데이터 중 최신 데이터를 나타내는 워터마크가 {{ $value }}종만 측정되는 상태가 10분 이상 지속 — 특정 데이터 종류만 계산이 실패했을 가능성(REQ-WM-016)."
          action: "/actuator/prometheus에서 aaa_collector_data_watermark_seconds 조회 → 빠진 데이터 종류 식별"

  # ---------------------------------------------------------------------------
  # 그룹 W2: 워터마크 신선도 — 즉시형(REQ-WM-017 §4.1)
  # [2026-07-10 Family B 확정] 다중 시리즈 룰 분할 방침 적용 — 시리즈별 9룰로 분할(제목 한글화·
  #   확인 줄 배치별 첫 대응 명시 목적). B-8(disclosures) 8h→17h30m, B-9(market-vix) 24h→28h —
  #   발화 시각을 심야 밖(익일 09:00대)으로 정렬(TICKET급이라 심야 통지 실익 없음, 임계 유효 구간
  #   내 이동이라 설계 의미 불변).
  # ---------------------------------------------------------------------------
  # (expected - on(market) group_right data_watermark{series=...}) > 0 이 deadline 동안 지속되면 발화.
  # group_right — data_watermark(시장당 여러 series)가 "many"측, expected(시장당 1개)가 "one"측이므로
  #   many측 라벨(series 포함)이 결과 벡터에 자동 보존된다.
  - name: collector-watermark-freshness-immediate
    interval: 30s
    rules:
      # B-1 국내 일봉 — PAGE, 4h(§4.1). 기준점 KRX 정규장 마감 15:30 KST.
      - alert: CollectorWatermarkFreshnessStaleDomesticDaily
        expr: |
          (aaa_collector_expected_watermark_seconds
           - on(market) group_right aaa_collector_data_watermark_seconds{series="daily-ohlcv-krx"}
          ) > 0
        for: 4h
        keep_firing_for: 10m
        labels:
          severity: critical
          component: collector
          tier: PAGE
        annotations:
          summary: "국내 일봉 갱신 지연"
          description: "장 마감 후 4시간이 지나도 최신 거래일까지 적재되지 않음 — 기대 대비 {{ $value | humanizeDuration }} 뒤처짐(REQ-WM-017 즉시형, PAGE)."
          action: "domestic-daily 배치(평일 16:00) 로그 → daily_ohlcv 최근 거래일 조회"

      # B-2 미국 일봉 — PAGE, 4h. 기준점 US 정규장 마감 16:00 ET.
      # [SPEC-OBSV-WATERMARK-002 REQ-WM2-009, 2026-07-12] D+2 적재 지연을 반영한 일봉 전용 기대 게이지로
      #   재배선(회귀 배경: aaa-infra#92). 공유 기대 게이지 대비 1개장일 후퇴된 값이라 정상 D+2 적재 시
      #   diff==0(무발화). 다른 해외 신선도 룰(B-3~B-9)은 기존 공유 게이지를 그대로 참조(REQ-WM2-010).
      - alert: CollectorWatermarkFreshnessStaleOverseasDaily
        expr: |
          (aaa_collector_expected_watermark_daily_seconds
           - on(market) group_right aaa_collector_data_watermark_seconds{series="daily-ohlcv-us"}
          ) > 0
        for: 4h
        keep_firing_for: 10m
        labels:
          severity: critical
          component: collector
          tier: PAGE
        annotations:
          summary: "미국 일봉 갱신 지연"
          description: "미국 장 마감 후 4시간이 지나도 최신 거래일까지 적재되지 않음 — 기대 대비 {{ $value | humanizeDuration }} 뒤처짐(REQ-WM-017 즉시형, PAGE)."
          action: "overseas-daily 배치(평일 16:30 ET) 로그 → daily_ohlcv 최근 거래일 조회"

      # B-3 원/달러 환율 — TICKET, 4h.
      - alert: CollectorWatermarkFreshnessStaleUsdKrw
        expr: |
          (aaa_collector_expected_watermark_seconds
           - on(market) group_right aaa_collector_data_watermark_seconds{series="market-usdkrw"}
          ) > 0
        for: 4h
        keep_firing_for: 10m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "원/달러 환율 갱신 지연"
          description: "직전 영업일 환율(D−1)이 적재되지 않은 상태가 4시간 이상 지속 — 기대 대비 {{ $value | humanizeDuration }} 뒤처짐(REQ-WM-017 즉시형, SPEC-COLLECTOR-MARKETIND-004 D−1 전환 반영)."
          action: "usdkrw 전용 배치(화~토 10:30 KST, D−1 확정값)·02:00 백필 갭워크 로그에서 KOREAEXIM→Yahoo 폴백 동작 확인 → market_indicators에서 USDKRW 최근 일자 조회"

      # B-4 투자자별 매매동향 — TICKET, 4h. domestic-supply-investor는 독립 크론 없이 일봉 체인 후속.
      - alert: CollectorWatermarkFreshnessStaleInvestorTrend
        expr: |
          (aaa_collector_expected_watermark_seconds
           - on(market) group_right aaa_collector_data_watermark_seconds{series="investor-trend"}
          ) > 0
        for: 4h
        keep_firing_for: 10m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "투자자별 매매동향 갱신 지연"
          description: "장 마감 후 4시간이 지나도 당일 수급 데이터가 적재되지 않음 — 기대 대비 {{ $value | humanizeDuration }} 뒤처짐(REQ-WM-017 즉시형)."
          action: "domestic-supply-investor 배치(평일 16:00 일봉 체인 후속) 로그 → investor_trend 최근 일자 조회"

      # B-5 국내 공매도 — TICKET, 4h. domestic-supply-short-sale도 일봉 체인 후속.
      - alert: CollectorWatermarkFreshnessStaleShortSaleDomestic
        expr: |
          (aaa_collector_expected_watermark_seconds
           - on(market) group_right aaa_collector_data_watermark_seconds{series="short-sale-domestic"}
          ) > 0
        for: 4h
        keep_firing_for: 10m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "국내 공매도 갱신 지연"
          description: "장 마감 후 4시간이 지나도 당일 공매도 데이터가 적재되지 않음 — 기대 대비 {{ $value | humanizeDuration }} 뒤처짐(REQ-WM-017 즉시형)."
          action: "domestic-supply-short-sale 배치(평일 16:00 일봉 체인 후속) 로그 → short_sale_domestic 최근 일자 조회"

      # B-6 미국 프리장 시세 — TICKET, 6h(US 마감 기산). ExtendedHoursScheduler PRE 10:00 ET.
      - alert: CollectorWatermarkFreshnessStaleExtendedHoursPre
        expr: |
          (aaa_collector_expected_watermark_seconds
           - on(market) group_right aaa_collector_data_watermark_seconds{series="extended-hours-pre"}
          ) > 0
        for: 6h
        keep_firing_for: 10m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "미국 프리장 시세 갱신 지연"
          description: "미국 정규장 마감 후 6시간이 지나도 당일 프리장 시세가 적재되지 않음 — 기대 대비 {{ $value | humanizeDuration }} 뒤처짐(REQ-WM-017 즉시형)."
          action: "extended-hours PRE 배치(평일 10:00 ET) 로그 → extended_hours에서 PRE 세션 최근 일자 조회"

      # B-7 미국 애프터장 시세 — TICKET, 6h. ExtendedHoursScheduler AFTER 20:30 ET(실여유 1.5h).
      - alert: CollectorWatermarkFreshnessStaleExtendedHoursAfter
        expr: |
          (aaa_collector_expected_watermark_seconds
           - on(market) group_right aaa_collector_data_watermark_seconds{series="extended-hours-after"}
          ) > 0
        for: 6h
        keep_firing_for: 10m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "미국 애프터장 시세 갱신 지연"
          description: "미국 정규장 마감 후 6시간이 지나도 당일 애프터장 시세가 적재되지 않음 — 기대 대비 {{ $value | humanizeDuration }} 뒤처짐(REQ-WM-017 즉시형)."
          action: "extended-hours AFTER 배치(평일 20:30 ET) 로그 → extended_hours에서 AFTER 세션 최근 일자 조회"

      # B-8 DART 공시 — TICKET, 8h→17h30m(2026-07-10, 심야 발화 회피). 유일 수집 경로는 DART
      #   폴링 평일 22:00 KST — 17h30m으로도 폴링 후 11h 마진, 다음 폴링(+30.5h) 이전이라 설계 불변.
      - alert: CollectorWatermarkFreshnessStaleDisclosures
        expr: |
          (aaa_collector_expected_watermark_seconds
           - on(market) group_right aaa_collector_data_watermark_seconds{series="disclosures"}
          ) > 0
        for: 17h30m
        keep_firing_for: 10m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "DART 공시 수집 지연"
          description: "장 마감 후 다음 날 아침(09:00)까지 당일 공시가 적재되지 않음 — 기대 대비 {{ $value | humanizeDuration }} 뒤처짐(REQ-WM-017 즉시형)."
          action: "DART 폴링(평일 22:00) 로그 → disclosures 최근 접수일자 조회"

      # B-9 VIX — TICKET, 24h→28h(2026-07-10, 심야 발화 회피). 정상 도착 기준점+12h(시장지표
      #   배치 평일 17:00 KST 1회) — 임계 유효 구간(12h~36h) 내 이동이라 설계 의미 불변.
      - alert: CollectorWatermarkFreshnessStaleVix
        expr: |
          (aaa_collector_expected_watermark_seconds
           - on(market) group_right aaa_collector_data_watermark_seconds{series="market-vix"}
          ) > 0
        for: 28h
        keep_firing_for: 10m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "VIX 갱신 지연"
          description: "미국 정규장 마감 후 다음 날 아침(09:00, 동절기 10:00)까지 VIX가 적재되지 않음 — 기대 대비 {{ $value | humanizeDuration }} 뒤처짐(REQ-WM-017 즉시형)."
          action: "market-indicators 배치(평일 17:00) 로그에서 CBOE→Yahoo 폴백 순서 확인(2026-07-15 SPEC-COLLECTOR-MARKETIND-003 FRED 제거) → market_indicators에서 VIX 최근 일자 조회"

  # ---------------------------------------------------------------------------
  # 그룹 W3: 워터마크 신선도 — lag 허용형(REQ-WM-017 §4.1)
  # [2026-07-10 Family C 확정] 시리즈별 4룰로 분할(6d 룰이 credit-balance|macro-fred 2종 묶음이던
  #   것을 분리). for(유예)를 09:00 정렬로 조정 — C-1/C-3/C-4 1h→17h30m, C-2 1h→4h(둘 다 심야
  #   발화·배치 전 조기 발화 회피, 일 단위 임계 자체는 불변). lag형은 며칠 단위 데이터라 시간 단위
  #   지연 통지의 실익이 없다는 판단.
  # ---------------------------------------------------------------------------
  # 정당한 T+N 지연을 허용하고 초과분만 감지: (expected - watermark) > N일.
  - name: collector-watermark-freshness-lag
    interval: 30s
    rules:
      # C-1 국내 신용잔고(T+3영업일 정상 지연) — TICKET, >6d, for 1h→17h30m
      - alert: CollectorWatermarkFreshnessLagCreditBalance
        expr: |
          (aaa_collector_expected_watermark_seconds
           - on(market) group_right aaa_collector_data_watermark_seconds{series="credit-balance"}
          ) > 6 * 24 * 3600
        for: 17h30m
        keep_firing_for: 10m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "국내 신용잔고 수집 지연"
          description: "지연 허용치(6일)를 넘어서도 적재되지 않음 — 기대 대비 {{ $value | humanizeDuration }} 뒤처짐 (정상 공표 지연 3영업일)(REQ-WM-017 lag 허용형)."
          action: "domestic-supply-credit-balance 배치(평일 16:00 일봉 체인 후속) 로그 → credit_balance 최근 일자 조회"

      # C-2 미국 거시지표(FRED, T+2영업일 정상 지연) — TICKET, >6d, for 1h→4h
      - alert: CollectorWatermarkFreshnessLagMacroFred
        expr: |
          (aaa_collector_expected_watermark_seconds
           - on(market) group_right aaa_collector_data_watermark_seconds{series="macro-fred"}
          ) > 6 * 24 * 3600
        for: 4h
        keep_firing_for: 10m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "미국 거시지표(FRED) 수집 지연"
          description: "지연 허용치(6일)를 넘어서도 적재되지 않음 — 기대 대비 {{ $value | humanizeDuration }} 뒤처짐 (정상 공표 지연 2영업일)(REQ-WM-017 lag 허용형)."
          action: "macro-external 배치(평일 19:00) 로그에서 FRED 소스 확인 → macro_indicators에서 FRED 시리즈 최근 일자 조회"

      # C-3 국내 투자의견(T+1 희소) — TICKET, >5d, for 1h→17h30m
      - alert: CollectorWatermarkFreshnessLagAnalystEstimates
        expr: |
          (aaa_collector_expected_watermark_seconds
           - on(market) group_right aaa_collector_data_watermark_seconds{series="analyst-estimates"}
          ) > 5 * 24 * 3600
        for: 17h30m
        keep_firing_for: 10m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "국내 투자의견 수집 지연"
          description: "지연 허용치(5일)를 넘어서도 적재되지 않음 — 기대 대비 {{ $value | humanizeDuration }} 뒤처짐 (원래 갱신이 드문 데이터)(REQ-WM-017 lag 허용형)."
          action: "domestic-invest-opinion 배치(평일 18:00) 로그 → analyst_estimates 최근 일자 조회"

      # C-4 국내 거시지표(ECOS, 잠정) — TICKET, >4d, for 1h→17h30m
      - alert: CollectorWatermarkFreshnessLagMacroEcos
        expr: |
          (aaa_collector_expected_watermark_seconds
           - on(market) group_right aaa_collector_data_watermark_seconds{series="macro-ecos"}
          ) > 4 * 24 * 3600
        for: 17h30m
        keep_firing_for: 10m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "국내 거시지표(ECOS) 수집 지연"
          description: "지연 허용치(4일, 잠정)를 넘어서도 적재되지 않음 — 기대 대비 {{ $value | humanizeDuration }} 뒤처짐(REQ-WM-017 lag 허용형)."
          action: "macro-external 배치(평일 19:00) 로그에서 ECOS 소스 확인 → macro_indicators에서 ECOS 시리즈 최근 일자 조회"

  # ---------------------------------------------------------------------------
  # 그룹 W4: 워터마크 커버리지 — REQ-WM-018
  # [2026-07-10 Family D 확정] 국내/미국 2룰로 분할(제목 한글화 "일부 종목 누락", {{ $value }}→
  #   humanizePercentage). 이 게이지는 최신 거래일 하루치만 검사 — 과거 구간 결측(하한 미달·내부
  #   구멍)은 BACKFILL-010 W5 밀도 게이지(BF-5/6) 몫으로 구조적으로 다르다(BACKFILL-010 경계 절 참조).
  # ---------------------------------------------------------------------------
  # ACTIVE 커버리지 시리즈(daily-ohlcv-krx/us만, 유니버스 정제 전제)의 coverage_ratio<0.95가 1h 지속.
  - name: collector-watermark-coverage
    interval: 30s
    rules:
      # D-1 국내 — 게이지 계산 매일 19:35 KST(마감+4h 신선도 데드라인 정렬).
      - alert: CollectorWatermarkCoverageLowDomestic
        expr: aaa_collector_data_coverage_ratio{series="daily-ohlcv-krx"} < 0.95
        for: 1h
        keep_firing_for: 10m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "국내 일봉 일부 종목 누락"
          description: "감시 대상 국내 종목(주식+ETF+ETN+금현물, SPEC-COLLECTOR-ASSETSCOPE-001 REQ-ASSETSCOPE-008 편입) 중 최신 거래일 일봉이 적재된 비율이 {{ $value | humanizePercentage }} — 기준 95% 미달 (하루 1회 19:35 계산이라 복구 후에도 다음 계산까지 알림이 남을 수 있음)(REQ-WM-018)."
          action: "domestic-daily 배치(평일 16:00) 로그에서 종목별 실패 확인 → daily_ohlcv에서 최신 거래일 빠진 국내 종목 조회"

      # D-2 미국 — 게이지 계산 매일 10:00 KST(데드라인 20:00 ET의 DST 안전 상수).
      - alert: CollectorWatermarkCoverageLowOverseas
        expr: aaa_collector_data_coverage_ratio{series="daily-ohlcv-us"} < 0.95
        for: 1h
        keep_firing_for: 10m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "미국 일봉 일부 종목 누락"
          description: "감시 대상 미국 종목(주식+ETF) 중 최신 거래일 일봉이 적재된 비율이 {{ $value | humanizePercentage }} — 기준 95% 미달 (하루 1회 10:00 계산이라 복구 후에도 다음 계산까지 알림이 남을 수 있음)(REQ-WM-018)."
          action: "overseas-daily 배치(평일 16:30 ET) 로그에서 종목별 실패 확인 → daily_ohlcv에서 최신 거래일 빠진 해외 종목 조회"

  # ---------------------------------------------------------------------------
  # 그룹 W5: 백필 이상 — REQ-WM-019(clamp) / REQ-WM-020(정체) /
  #          REQ-BACKFILL-157/-146b(GROUP_A 카운터) / REQ-BACKFILL-154/-155(밀도 게이지)
  #          (SPEC-COLLECTOR-BACKFILL-010 REQ-BACKFILL-158)
  # [2026-07-10 Family BF 확정] 문구 3줄 표준 재정렬 + BF-7 신설(cap_saturated_total — GROUPC SPEC
  #   REQ-GC-013은 카운터 신설까지만이라 룰 소유자가 없었음. cap 포화는 FAILED 종단이라 Stalled
  #   (pending_slots FAILED 제외)·AnomalyFailed(별개 카운터) 모두 비가시였던 알림 사각 해소).
  #   이벤트형(카운터 증분) 4종은 `notify: fire_only` 라벨 — alertmanager.yml에서 resolved 통지
  #   억제(5분 윈도우 소진 가짜 ✅해소 방지). Stalled·BelowFloor·InternalGap은 상태형(resolved 유효).
  # ---------------------------------------------------------------------------
  - name: collector-backfill-anomaly
    interval: 30s
    rules:
      # BF-1 — 이벤트형, resolved 억제.
      - alert: CollectorBackfillClampSuspected
        expr: increase(aaa_collector_backfill_clamp_suspected_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
          component: collector
          tier: TICKET
          notify: fire_only
        annotations:
          summary: "백필 응답 잘림 의심 — 조기 완료 오판 위험"
          description: "최근 1시간 내 KIS 응답이 캡에 걸려 잘린 정황 감지 — 과거 구간이 덜 채워졌는데 완료로 오판했을 수 있음(REQ-WM-019)."
          action: "collector 로그(백필 크론, 매일 02:00 KST·주말 +5회)에서 clamp 의심 종목 확인 → backfill_status 진행점 대조"

      # BF-2 — pending_slots(PENDING+IN_PROGRESS)>0 이면서 26h 동안 windows_total 무전진 → 정체.
      # FAILED 종결·전량 COMPLETED 시 pending_slots=0이 되어 발화하지 않는다(MI-09). 상태형.
      - alert: CollectorBackfillStalled
        expr: |
          (aaa_collector_backfill_pending_slots > 0)
          and (increase(aaa_collector_backfill_windows_total[26h]) == 0)
        for: 5m
        keep_firing_for: 10m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "백필 정체 — 미완료 종목 26시간 무진행"
          description: "미완료 백필 종목이 남아 있는데 26시간 동안 진행이 없음 — 백필 엔진·스케줄 이상 의심(REQ-WM-020). progress_ratio 절대값으로는 판단하지 않음(lazy 시딩 분모 증가 시 정당 하락)."
          action: "collector 로그(백필 크론 실행 여부) → backfill_status에서 PENDING·IN_PROGRESS 잔존 조회"

      # BF-3 GROUP_A 조기 완료 차단(REQ-BACKFILL-157) — 확인 프로브가 비어있지 않은 응답으로 조기
      # 완료를 차단할 때마다 증가. clamp_suspected(GROUP_B 전용)와 대칭인 GROUP_A 신호(REQ-BACKFILL-158).
      # 이벤트형, resolved 억제. 차단 자체는 정상 방어 동작 — "방어 성공+KIS 이상 의심" 뉘앙스.
      - alert: CollectorBackfillEarlyCompletionSuspect
        expr: increase(aaa_collector_backfill_early_completion_suspect_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
          component: collector
          tier: TICKET
          notify: fire_only
        annotations:
          summary: "백필 조기 완료 차단 — 과거 데이터 잔존 발견"
          description: "완료 직전 확인 프로브가 \"아직 데이터가 남아 있음\"을 발견해 완료 처리를 차단 — 차단 자체는 정상 방어 동작이나, 반복되면 KIS 응답 이상 의심(REQ-BACKFILL-157)."
          action: "collector 로그(확인 프로브 차단 종목) → 다음 사이클에서 해당 종목 진행 재개 여부 확인"

      # BF-4 GROUP_A anomaly-FAILED 종결(REQ-BACKFILL-146b) — oldest=null·rawRowCount>0 이상 status가
      # N 사이클 끝에 terminal FAILED로 종결될 때 status당 1회 증가. pending_slots(FAILED 제외)로
      # 비가시(REQ-BACKFILL-158). 이벤트형, resolved 억제.
      - alert: CollectorBackfillAnomalyFailed
        expr: increase(aaa_collector_backfill_anomaly_failed_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
          component: collector
          tier: TICKET
          notify: fire_only
        annotations:
          summary: "백필 이상 종결(FAILED) — 수동 조사 필요"
          description: "이상 응답(건수는 있는데 진행점 해석 불가)이 반복돼 해당 종목 백필이 FAILED로 종결됨 — 자동 재시도 없음, 방치 시 그 종목 과거 데이터 영구 미완(REQ-BACKFILL-146b)."
          action: "collector 로그(FAILED 종결 종목·사유) → backfill_status FAILED 행 조회 → 원인 조사 후 수동 리셋 판단"

      # BF-5 과거 밀도 게이지 A(하한 미달, REQ-BACKFILL-154) — 신뢰 가능한 하한 존재 종목 중
      # MIN(trade_date)>floor인 종목 수>0이 1h 지속. 지속 상태 게이지 디바운스(W3/W4 for:1h와 정합).
      # 상태형. 분할 없이 series 라벨 노출(2026-07-10 확정 — 종목 수 통지라 분할 실익 작음).
      - alert: CollectorBackfillBelowFloor
        expr: aaa_collector_backfill_below_floor_stocks > 0
        for: 1h
        keep_firing_for: 10m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "백필 과거 데이터 하한 미달 — {{ $labels.series }} {{ $value }}종목"
          description: "기대 최과거일까지 채워지지 않은 종목 존재 (하루 1회 계산이라 복구 후에도 다음 계산까지 알림이 남을 수 있음)(REQ-BACKFILL-154)."
          action: "collector 로그(밀도 게이지 계산) → 감지 SQL(remediation-targets.md)로 대상 종목 조회"

      # BF-6 과거 밀도 게이지 B(내부 구멍, REQ-BACKFILL-155) — 보유 구간 내부에 캘린더상 존재하나
      # 부재한 거래일이 있는 종목 수>0이 1h 지속. 상태형.
      - alert: CollectorBackfillInternalGap
        expr: aaa_collector_backfill_internal_gap_stocks > 0
        for: 1h
        keep_firing_for: 10m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "백필 과거 데이터 내부 구멍 — {{ $labels.series }} {{ $value }}종목"
          description: "보유 구간 중간에 캘린더상 있어야 할 거래일이 빠진 종목 존재 (하루 1회 계산이라 복구 후에도 다음 계산까지 알림이 남을 수 있음)(REQ-BACKFILL-155)."
          action: "collector 로그(밀도 게이지 계산) → 감지 SQL(remediation-targets.md)로 대상 종목 조회"

      # BF-7 [신설, 2026-07-10] 백필 100행 캡 포화(국내 액면교체) — GROUPC SPEC(REQ-GC-013)은
      # 카운터 신설까지만이었고 룰 소유자가 없던 사각. 설계상 도달 거의 불가한 안전밸브라 발생 자체가
      # 조사 대상. 이벤트형, resolved 억제.
      - alert: CollectorBackfillCapSaturated
        expr: increase(aaa_collector_backfill_cap_saturated_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
          component: collector
          tier: TICKET
          notify: fire_only
        annotations:
          summary: "백필 100행 캡 포화 — 액면교체 FAILED 종단"
          description: "국내 액면교체 백필 응답이 100행 캡에 도달 — 절단 의심으로 해당 종목 FAILED 종단, 자동 재시도 없음 (설계상 도달 거의 불가한 안전밸브 — 발생 자체가 조사 대상)(REQ-GC-013)."
          action: "collector 로그(백필 크론, 매일 02:00 KST·주말 +5회) → backfill_status FAILED 행 last_error 확인 후 수동 조사"

      # BF-8 [신설, SPEC-COLLECTOR-BACKFILL-011] 정방향 갭 walk 앞단 미도달 — 실제 hole 여부 확인 필요.
      # 이벤트형, resolved 억제.
      # [2026-07-27 SPEC-COLLECTOR-BACKFILL-011 v0.8.0 문구 개정] 판정식이 거래일 기준으로 전환되어
      #   "비거래일(주말·공휴일) 커서 오판일 수 있음" 면책 서술과 "REQ-CVR-076 검증식 정정은 별도
      #   후속 SPEC 소관" 예고가 더 이상 성립하지 않아 삭제. expr·labels는 무변경(REQ-CVR-113).
      - alert: CollectorBackfillCoveredWalkFrontGap
        expr: increase(aaa_collector_backfill_covered_walk_anomaly_total{kind="front_gap"}[1h]) > 0
        for: 0m
        labels:
          severity: warning
          component: collector
          tier: TICKET
          notify: fire_only
        annotations:
          summary: "정방향 갭 walk 앞단 미도달 — 실제 hole 여부 확인 필요"
          description: "정방향 갭 walk 스텝에서 API가 반환한 최소 거래일자가 스텝 시작 커서에 도달하지 못함(REQ-CVR-076 심층 방어) — 구간 [cursor, oldest)에 실제 개장일이 확인된 경우에만 발화함. status는 FAILED로 전환되지 않고 covered_until_date 전진도 억제되지 않음(불변)."
          action: "collector 로그(covered-range 앞단 미도달 WARN — cursor·oldest·targetCode·dataTable) 확인 → 해당 구간 거래일 여부 확인 → 진짜 hole이면 covered_until_date 리셋+재-walk"

      # BF-10 [신설, SPEC-COLLECTOR-BACKFILL-011 v0.8.0] 정방향 갭 walk 캘린더 정보 부족 — 조치 방향이
      # 데이터 hole 조사가 아니라 캘린더 커버리지 점검(초기 시딩 범위 확인)임에 유의. 이벤트형, resolved 억제.
      - alert: CollectorBackfillCoveredWalkCalendarUnknown
        expr: increase(aaa_collector_backfill_covered_walk_anomaly_total{kind="calendar_unknown"}[1h]) > 0
        for: 0m
        labels:
          severity: warning
          component: collector
          tier: TICKET
          notify: fire_only
        annotations:
          summary: "정방향 갭 walk 캘린더 정보 부족 — 커버리지 점검 필요"
          description: "정방향 갭 walk 앞단 미도달 판정 중 구간 [cursor, oldest) 내 개장일 여부를 캘린더에서 확인할 수 없는 날짜가 존재(REQ-CVR-085 보수적 폴백) — status는 FAILED로 전환되지 않고 covered_until_date 전진도 억제되지 않음(불변)."
          action: "collector 로그(covered-range 앞단 미도달 WARN — cursor·oldest·targetCode·dataTable) 확인 → hole 조사가 아니라 market_calendar 초기 시딩 범위가 해당 구간을 커버하는지 점검"

      # BF-9 [신설, SPEC-COLLECTOR-BACKFILL-011] 정방향 갭 walk 검증 전량 실패. 이벤트형, resolved 억제.
      - alert: CollectorBackfillCoveredWalkAllRejected
        expr: increase(aaa_collector_backfill_covered_walk_anomaly_total{kind="all_rejected"}[1h]) > 0
        for: 0m
        labels:
          severity: warning
          component: collector
          tier: TICKET
          notify: fire_only
        annotations:
          summary: "정방향 갭 walk 검증 전량 실패"
          description: "정방향 갭 walk 스텝에서 원본 응답은 있으나 검증을 통과해 저장된 행이 없음(REQ-CVR-031) — status는 FAILED로 전환되지 않고 구간 확장만 중단됨."
          action: "collector 로그(covered-range 검증 전량 실패 WARN) 확인 → 파서·검증 로직 점검"

  # ---------------------------------------------------------------------------
  # 그룹 W6: 틱 침묵 — REQ-WM-021(국내) / REQ-WM-028(해외)
  # ---------------------------------------------------------------------------
  - name: collector-tick-silence
    interval: 30s
    rules:
      # 국내 장중 구독>0인데 국내 틱이 300초 이상 침묵(absent 포함) → PAGE.
      - alert: CollectorTickSilentDomestic
        expr: |
          (aaa_collector_market_open == 1)
          and on() (aaa_collector_tick_active_subscriptions > 0)
          and on() (
            absent(aaa_collector_tick_last_seen_seconds{market="domestic"})
            or (time() - max(aaa_collector_tick_last_seen_seconds{market="domestic"}) > 300)
          )
        for: 0m
        keep_firing_for: 10m
        labels:
          severity: critical
          component: collector
          tier: PAGE
        annotations:
          summary: "국내 틱 수신 중단"
          description: "국장 장중 구독 유지 상태에 국내 틱 데이터 5분 이상 전 종목 무수신(REQ-WM-021, absent-aware)."
          action: "collector 로그(WebSocket 수신) → redis XINFO STREAM stream:tick:domestic 최종 발행 시각 확인"

      # US 세션 중(holiday_count>=20 가드) 구독>0인데 해외 틱이 300초 이상 침묵(absent 포함) → PAGE.
      # 반일 조기폐장 오탐은 REQ-WM-030(us_market_open 13:00 ET 이후 0 보정)이 해소.
      - alert: CollectorTickSilentOverseas
        expr: |
          (aaa_collector_us_market_open == 1)
          and on() (aaa_collector_us_market_gate_holiday_count >= 20)
          and on() (aaa_collector_tick_active_subscriptions > 0)
          and on() (
            absent(aaa_collector_tick_last_seen_seconds{market="overseas"})
            or (time() - max(aaa_collector_tick_last_seen_seconds{market="overseas"}) > 300)
          )
        for: 0m
        keep_firing_for: 10m
        labels:
          severity: critical
          component: collector
          tier: PAGE
        annotations:
          summary: "미국 틱 수신 중단"
          description: "미장 장중 구독 유지 상태에 해외 틱 데이터 5분 이상 전 종목 무수신(REQ-WM-028, 결정 4)."
          action: "collector 로그(WebSocket 수신) → redis XINFO STREAM stream:tick:overseas 최종 발행 시각 확인"

  # ---------------------------------------------------------------------------
  # 그룹 W7: silent_drops — REQ-WM-022
  # [2026-07-10 Family SD 확정] 이벤트형(카운터 증분) → `notify: fire_only`(resolved 통지 억제).
  #   행별 상세 로그 부재(aaa-infra#86 등록) — 확인 줄에 폴백 구절("로그 미발견 시 VM 시각 대조")을
  #   선반영해 이슈 랜딩 대기 없이 즉시 실행 가능하게 함.
  # ---------------------------------------------------------------------------
  - name: collector-silent-drops
    interval: 30s
    rules:
      - alert: CollectorSilentDropsDetected
        expr: increase(aaa_collector_batch_silent_drops_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
          component: collector
          tier: TICKET
          notify: fire_only
        annotations:
          summary: "수집 데이터 행 침묵 유실 감지"
          description: "최근 1시간 내 INSERT 단계에서 중복이 아닌 사유(형식 오류·절단·제약 위반)로 조용히 버려진 행 발생 — 저장됐어야 할 데이터가 유실됨(REQ-WM-022)."
          action: "collector 로그(침묵 드롭 WARN — 테이블·에러코드·행) → 해당 테이블·원본 대조. 로그 미발견 시 VM 카운터 증가 시각으로 배치 식별"

  # ---------------------------------------------------------------------------
  # 그룹 10: 안전 모드 진입/해제 — SPEC-OBSV-SYSALERT-001 / SPEC-COLLECTOR-SAFEMODEGAUGE-001
  # [2026-07-20 상태형 게이지 전환, aaa-infra#85 해소] 이벤트형(카운터 증분) 관측을 상태형 게이지
  #   aaa_collector_safe_mode_active{module,alias}(0/1)로 교체했다. 해제가 어느 경로로 일어나든
  #   (TTL 자연 만료·수동 삭제·명시적 exit) 게이지 1→0 하강을 firing→resolved 전이로 포착한다.
  #   이로써 exit_total이 token 발급 성공 경로만 증가하고 ws는 exit() 호출 자체가 없어 TTL 만료·
  #   수동 삭제 해제를 놓치던 관측 사각(구 SM-2 CollectorSafeModeExited)이 근본 해소됐다.
  #   진입 알림(SM-1a/SM-1b)은 notify:fire_only를 제거해 resolved(✅ 해소) 통지를 받는다.
  # ---------------------------------------------------------------------------
  # 게이지: SafeModeGaugeBinder가 SafeModeManager.isActive(alias)를 스크레이프 시점에 직접 조회해 노출.
  # for: 0m — 안전 모드는 즉시 알림이 필요하며 지속 시간 조건 불필요.
  # keep_firing_for: 2m — interval 30s 기준 4주기 완충. Redis 순간 예외·TTL 만료 직후 재진입 gap으로
  #   게이지가 한두 주기 순간 0으로 관측돼도 즉시 거짓 resolved가 나가지 않도록 firing 유지(REQ-SMG-017).
  - name: collector-safemode
    interval: 30s
    rules:
      # SM-1a — module="token": 상태형 게이지 active==1 동안 firing. TTL 백오프 1h→2h→4h 자동 재시도.
      - alert: CollectorSafeModeEntered
        expr: aaa_collector_safe_mode_active{module="token"} == 1
        for: 0m
        keep_firing_for: 2m
        labels:
          severity: critical
          component: collector
          tier: PAGE
        annotations:
          summary: "안전 모드 진입 — KIS 토큰 (계좌 {{ $labels.alias }})"
          description: "토큰 발급 실패로 계좌 {{ $labels.alias }}의 KIS 호출 차단 중. 1~4시간 백오프 후 자동 재시도 — 짧은 간격 반복 진입이면 앱키 문제 의심."
          action: "collector 로그(진입 원인 예외) → 재발급 성공 로그 또는 redis 키 safe_mode:collector:token:{alias} 소멸 확인"

      # SM-1b — module="ws": 상태형 게이지 active==1 동안 firing. WS-RESILIENCE-001로 TTL 백오프
      #   1h→2h→4h 자동 복구 활성화됨(구 "수동 삭제 전까지 자동 복구 없음" 전제는 stale — 정정).
      - alert: CollectorSafeModeEntered
        expr: aaa_collector_safe_mode_active{module="ws"} == 1
        for: 0m
        keep_firing_for: 2m
        labels:
          severity: critical
          component: collector
          tier: PAGE
        annotations:
          summary: "안전 모드 진입 — WebSocket (계좌 {{ $labels.alias }})"
          description: "WebSocket 연결 오류 반복으로 계좌 {{ $labels.alias }}의 재연결 차단 중. WS-RESILIENCE-001 TTL 백오프(1h→2h→4h)로 자동 복구 — 수동 삭제도 가능."
          action: "collector 로그(진입 원인 예외) → 원인 해소 후 TTL 백오프 자동 복구 대기 또는 redis 키 safe_mode:collector:ws:{alias} 수동 삭제(TECHSPEC §1.3)"

  # ---------------------------------------------------------------------------
  # 그룹 11: 시장지표 소스 체인 Fallback 가시성 — SPEC-COLLECTOR-MARKETIND-002
  # [2026-07-10 Family MI 확정] 2종→1종 재편.
  #   ① MarketIndicatorExhausted 삭제 — 실행 실패+데이터 없음 이중 체크는 이 그룹만의 예외였음
  #      (다른 계열은 전부 "데이터 없음" 단일 감시). 탈진의 결과(미적재)는 기존 워터마크 신선도
  #      (market-usdkrw 4h/market-vix 24h→28h TICKET, 위 그룹 W2)가 담당.
  #   ② MarketIndicatorPrimaryStale을 Family B와 동형인 상대식으로 재설계: batch_last_load(수집
  #      실행 자체) − source_last_success(기본 소스 성공) > 25h. 차이값은 실패마다 24h씩 계단
  #      점프하므로 25h = 2회 연속 실패부터 발화(1회 실패는 예비 소스가 대체 수집해 결손 0 —
  #      TICKET 열화 알림 소음을 줄이려는 의도적 관용). 주말·공휴일 동결 면역이라 market_open
  #      게이트 제거(월요일 오탐 원천 소멸). 발화·해소 항상 17:05경(market-indicators 배치 직후).
  #      [→ ④가 소스별 앵커·시각을 개정 — KOREAEXIM은 10:30경, CBOE는 17:05경]
  #   ③ [2026-07-14 SPEC-COLLECTOR-WARMSTART-REDIS-003 M2] `> 0` 가드를 제거했다. aaa-collector
  #      M1이 `source_last_success` 게이지를 Redis에서 warm-start하므로 재기동 직후에도 게이지가
  #      (한 번이라도 성공한 적 있으면) 비영이 되어 가드의 존재 이유가 사라졌다. 가드를 유지하면
  #      "한 번도 성공한 적 없는 기본 소스"가 0에 영구 침묵하는 #88 결함이 그대로 남는다. 전면
  #      Redis 유실 시엔 좌변 `batch_last_load{market-indicators}`도 동일 Redis에서 seed되므로
  #      부재→빈 벡터로 구조적으로 침묵한다(오발 아님, spec.md §4.5 참조). #78 후속 원라인
  #      가드-제거 후속을 본 변경이 흡수한다.
  #   ④ [2026-07-17 SPEC-COLLECTOR-MARKETIND-004 후속] USDKRW 전용 배치 분리(batch=market-usdkrw,
  #      화~토 10:30 KST, D−1 확정값)에 맞춰 소스별 2룰로 분할. KOREAEXIM 룰의 좌변을
  #      market-indicators(17:05)에서 market-usdkrw로 재배선 — 좌·우변이 같은 배치에서 stamp되어
  #      정상 diff=0, 실패마다 24h 계단이 복원된다. 재배선 없이는 (i) 스케줄 skew 6.6h(17:05−10:30)로
  #      1회 실패에 30.6h>25h 즉시 발화(1회 관용 소실), (ii) 월요일은 좌변(market-indicators 월
  #      17:05)만 전진하고 우변은 최신 KOREAEXIM 성공(토 02:00 갭워크 또는 금 10:30)에 머물러
  #      63h+>25h로 매주 월요일 오발. cron이 화~토(D−1=항상 영업일)라 월요일은 양변 모두 정지(diff
  #      불변)로 면역. CBOE는 기존식(market-indicators 좌변) 그대로 — 공유 임계 +24h 조정안은 CBOE
  #      2연속 실패(48h)가 49h 미달로 미발화하게 되어 기각. 발화·해소: KOREAEXIM 10:30경, CBOE 17:05경.
  # ---------------------------------------------------------------------------
  - name: collector-market-indicator
    interval: 30s
    rules:
      # 공통: `> 0` 가드 제거(2026-07-14, SPEC-COLLECTOR-WARMSTART-REDIS-003 M2) — warm-start로 게이지가
      # 재기동 직후부터 비영이므로 불필요. 두 게이지 모두 부재(전면 Redis 유실)면 뺄셈이 빈 벡터가
      # 되어 구조적으로 미발화한다(오발 아님 — 우변 부재 시 뺄셈 자체가 성립하지 않아 규칙이 물리적으로
      # 발화할 수 없는 것이지, 판정 로직이 억제하는 게 아니다). 좌변 단독 부재(예: market-usdkrw 라벨
      # 미노출)도 동일하게 빈 벡터 침묵.

      # MI-1a — USDKRW 기본 소스(KOREAEXIM)가 전용 배치(market-usdkrw, 화~토 10:30 KST) 대비
      # 25h(2회차) 이상 뒤처짐. 좌변 재배선 근거는 그룹 헤더 ④ 참조.
      - alert: MarketIndicatorPrimaryStale
        expr: >
          (aaa_collector_batch_last_load_seconds{batch="market-usdkrw"}
           - on() group_right() aaa_collector_market_indicator_source_last_success_seconds{source="KOREAEXIM"}
          ) > 25 * 3600
        for: 5m
        keep_firing_for: 10m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "시장지표 수집 기본 소스 중단 — {{ $labels.indicator }} ({{ $labels.source }})"
          description: "{{ $labels.indicator }}의 수집 기본 소스 {{ $labels.source }}가 2회차 이상 연속 실패 — 예비 소스가 대체 수집 중(데이터 결손 없음), 기본 소스 복구 필요(예비 상시화 방지)."
          action: "collector 로그(usdkrw 전용 배치 화~토 10:30, {{ $labels.source }} 실패 사유) → market_indicators 테이블 source 컬럼으로 실제 적재 소스 확인"

      # MI-1b — VIX 기본 소스(CBOE)가 market-indicators 배치(평일 17:05) 대비 25h(2회차) 이상 뒤처짐.
      # 기존 MI-1 단일 룰에서 소스만 CBOE로 한정(식·임계 무변경) — KOREAEXIM 좌변 재배선(MI-1a)과
      # 분리해 CBOE의 "2회 연속 실패부터 발화" 의미를 그대로 보존한다.
      - alert: MarketIndicatorPrimaryStale
        expr: >
          (aaa_collector_batch_last_load_seconds{batch="market-indicators"}
           - on() group_right() aaa_collector_market_indicator_source_last_success_seconds{source="CBOE"}
          ) > 25 * 3600
        for: 5m
        keep_firing_for: 10m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "시장지표 수집 기본 소스 중단 — {{ $labels.indicator }} ({{ $labels.source }})"
          description: "{{ $labels.indicator }}의 수집 기본 소스 {{ $labels.source }}가 2회차 이상 연속 실패 — 예비 소스가 대체 수집 중(데이터 결손 없음), 기본 소스 복구 필요(예비 상시화 방지)."
          action: "collector 로그(market-indicators 배치 평일 17:05, {{ $labels.source }} 실패 사유) → market_indicators 테이블 source 컬럼으로 실제 적재 소스 확인"

  # ---------------------------------------------------------------------------
  # 그룹 12: NAS 호스트 자원 — 디스크·RAM·CPU 3단계 (SPEC-INFRA-NODE-001)
  # ---------------------------------------------------------------------------
  # 게이트 무관·24h 상시. 디스크는 mountpoint 라벨(/volume1·/volume2)로 각각 발화.
  # CPU = node_load5/4 (N100 4코어 하드코딩, §5 V-1). absent 시 비교식 빈 벡터로 구조적 억제(REQ-NE-014).
  # 다단계 동시 발화: 임계 초과 시 해당하는 모든 단계가 동시에 발화한다(예: 95% → W1+W2+Critical).
  # 의도적 설계 — AM inhibit 룰 제외(§6). 상위 알림이 유실되더라도 하위 알림이 보장된다.
  # [SPEC-OBSV-WATERMARK-001 REQ-WM-026, 2026-07-10 개정] 디스크 Critical(>90%)·RAM Critical(>95%)
  #   2종만 TICKET→PAGE 승격(쓰기 실패=전 서비스 정지 전조·OOM=분 단위 진행). CPU Critical(>90%)은
  #   load5/4가 I/O 대기 포함 프록시라 오탐성 — TICKET 유지.
  - name: node-resource
    interval: 60s
    rules:
      # --- 디스크: /volume[12] 사용률 70/80/90% ---
      - alert: NodeDiskWarning1
        expr: |
          (1 - (node_filesystem_avail_bytes{mountpoint=~"/volume[12]",fstype!~"tmpfs|overlay|devtmpfs"}
                / node_filesystem_size_bytes{mountpoint=~"/volume[12]",fstype!~"tmpfs|overlay|devtmpfs"})) > 0.70
        for: 5m
        labels:
          severity: warning
          component: node
          tier: TICKET
        annotations:
          summary: "NAS 디스크 사용률 1단계 — {{ $labels.mountpoint }} ({{ $value | humanizePercentage }})"
          description: "{{ $labels.mountpoint }} 사용률이 70% 초과 지속."
          action: "ssh nas-ugreen \"df -h /volume1 /volume2\" → docker system df·로그·백업 순으로 대용량 정리"

      - alert: NodeDiskWarning2
        expr: |
          (1 - (node_filesystem_avail_bytes{mountpoint=~"/volume[12]",fstype!~"tmpfs|overlay|devtmpfs"}
                / node_filesystem_size_bytes{mountpoint=~"/volume[12]",fstype!~"tmpfs|overlay|devtmpfs"})) > 0.80
        for: 5m
        labels:
          severity: warning
          component: node
          tier: TICKET
        annotations:
          summary: "NAS 디스크 사용률 2단계 — {{ $labels.mountpoint }} ({{ $value | humanizePercentage }})"
          description: "{{ $labels.mountpoint }} 사용률이 80% 초과 지속."
          action: "ssh nas-ugreen \"df -h /volume1 /volume2\" → docker system df·로그·백업 순으로 대용량 정리"

      - alert: NodeDiskCritical
        expr: |
          (1 - (node_filesystem_avail_bytes{mountpoint=~"/volume[12]",fstype!~"tmpfs|overlay|devtmpfs"}
                / node_filesystem_size_bytes{mountpoint=~"/volume[12]",fstype!~"tmpfs|overlay|devtmpfs"})) > 0.90
        for: 2m
        labels:
          severity: critical
          component: node
          tier: PAGE
        annotations:
          summary: "NAS 디스크 사용률 3단계 — {{ $labels.mountpoint }} ({{ $value | humanizePercentage }})"
          description: "{{ $labels.mountpoint }} 사용률이 90% 초과 지속 — 쓰기 실패 임박, 즉시 공간 확보 필요."
          action: "ssh nas-ugreen \"df -h /volume1 /volume2\" → docker system df·로그·백업 순으로 대용량 정리"

      # --- RAM: 사용률 80/90/95% (2026-07-25 NAS RAM 8GB→32GB 업그레이드, #119) ---
      # 임계값 자체(80/90/95%)는 비율 기반이라 변경 없음 — 8GB 시절 "상시 60~70%대 운영" 프로세는
      # 더 이상 유효하지 않다(2026-07-26 실측: 31Gi 중 5.6Gi 사용, ~18%). 이제 세 단계 모두
      # 통상 운영에서는 발화하지 않는 실질 임계로 작동할 것으로 기대된다.
      # NodeMemoryWarning1 (80%) 비활성화 2026-07-18: 당시 8GB NAS 상시 80%대 발화로 신호 가치 상실.
      #   → 32GB 업그레이드로 상시-근접 조건이 해소되어 복원(2026-07-26). 애초 TODO는 "16GB 업그레이드
      #   후 재산정"이었으나 실제로는 32GB로 업그레이드됨 — 임계값 재산정 없이 그대로 복원해도
      #   32GB 여유 하에서는 상시 발화 재발 우려가 낮다고 판단.
      - alert: NodeMemoryWarning1
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.80
        for: 10m
        labels:
          severity: warning
          component: node
          tier: TICKET
        annotations:
          summary: "NAS 메모리 사용률 1단계 — {{ $value | humanizePercentage }}"
          description: "호스트 메모리 사용률이 80% 초과 지속."
          action: "ssh nas-ugreen \"free -h && docker stats --no-stream\" → 과다 사용 컨테이너 식별"

      - alert: NodeMemoryWarning2
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.90
        for: 10m
        labels:
          severity: warning
          component: node
          tier: TICKET
        annotations:
          summary: "NAS 메모리 사용률 2단계 — {{ $value | humanizePercentage }}"
          description: "호스트 메모리 사용률이 90% 초과 지속."
          action: "ssh nas-ugreen \"free -h && docker stats --no-stream\" → 과다 사용 컨테이너 식별"

      - alert: NodeMemoryCritical
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.95
        for: 3m
        labels:
          severity: critical
          component: node
          tier: PAGE
        annotations:
          summary: "NAS 메모리 사용률 3단계 — {{ $value | humanizePercentage }}"
          description: "호스트 메모리 사용률이 95% 초과 지속 — OOM Killer가 컨테이너를 강제 종료할 위험."
          action: "ssh nas-ugreen \"free -h && docker stats --no-stream\" → 과다 사용 컨테이너 식별"

      # --- CPU: node_load5/4 70/85/90% ---
      # node_load5/4: 5분 부하평균 ÷ 코어수(4, N100 하드코딩). 순수 CPU 사용률이 아닌 프록시.
      # I/O 대기(D 상태) 포함. NAS 디스크 I/O 폭증 시 CPU 부하 없이도 지표 상승 가능(§5 V-1).
      - alert: NodeCpuWarning1
        expr: (node_load5 / 4) > 0.70
        for: 5m
        labels:
          severity: warning
          component: node
          tier: TICKET
        annotations:
          summary: "NAS CPU 부하 1단계 — {{ $value | humanizePercentage }}"
          description: "5분 부하평균(코어 대비)이 70% 초과 지속 — 디스크 I/O 대기도 포함되는 지표라 CPU가 아닌 I/O 병목일 수 있음."
          action: "ssh nas-ugreen \"uptime && docker stats --no-stream\" → 부하 원인 컨테이너·I/O 확인"

      - alert: NodeCpuWarning2
        expr: (node_load5 / 4) > 0.85
        for: 5m
        labels:
          severity: warning
          component: node
          tier: TICKET
        annotations:
          summary: "NAS CPU 부하 2단계 — {{ $value | humanizePercentage }}"
          description: "5분 부하평균(코어 대비)이 85% 초과 지속 — 디스크 I/O 대기도 포함되는 지표라 CPU가 아닌 I/O 병목일 수 있음."
          action: "ssh nas-ugreen \"uptime && docker stats --no-stream\" → 부하 원인 컨테이너·I/O 확인"

      - alert: NodeCpuCritical
        expr: (node_load5 / 4) > 0.90
        for: 2m
        labels:
          severity: critical
          component: node
          tier: TICKET
        annotations:
          summary: "NAS CPU 부하 3단계 — {{ $value | humanizePercentage }}"
          description: "5분 부하평균(코어 대비)이 90% 초과 지속 — 디스크 I/O 대기도 포함되는 지표라 CPU가 아닌 I/O 병목일 수 있음. CPU는 TICKET 유지(오탐성)."
          action: "ssh nas-ugreen \"uptime && docker stats --no-stream\" → 부하 원인 컨테이너·I/O 확인"

  # ---------------------------------------------------------------------------
  # 그룹 XR-H: 예상 실행 신선도 — 라벨 무관 단일 룰(SPEC-COLLECTOR-EXPECTED-RUN-001 REQ-XR-019, Module H)
  # ---------------------------------------------------------------------------
  # [HARD ADD-only, 2026-07-10] 이 그룹은 신규 그룹이며 기존 collector-collection-gap(그룹 2)·
  #   -overseas(그룹5)·-overseas-interest(그룹6)·-weekly·-news·-watchlist-us·-overseas-news·
  #   -nogate-100h·-nogate-28h·-gate-health를 어떤 것도 대체·수정하지 않는다 — §8.1 확인 게이트
  #   (collector M1 배포 + count(expected_run)==enrolled ≥24h 연속 관찰) 통과 전까지 구·신 룰
  #   병행 실행(REQ-XR-030). 게이트 통과 후 구 룰 제거는 별도 세션(§8.2 "추가 → 확인 → 제거").
  #
  # 알림명을 CollectorBatchStale(그룹2 기존)과 의도적으로 구분해 CollectorBatchStaleExpectedRun으로
  #   명명한다 — 컷오버 완료 전 두 알림 계열의 발화 출처를 구분하기 위함(최종 이름 통일 여부는
  #   §8.1 게이트 통과 후 별도 세션 결정).
  #
  # `batch` 라벨 필터링(제외 정규식) 불필요 — 이 룰은 collector 레지스트리(REQ-XR-002)에 편입된 배치
  #   전체에 라벨 무관 적용된다(그것이 라벨 무관 단일 룰의 요점, DP-4). 게이트-레거시 3배치
  #   (domestic-daily/market-indicators/dart-disclosure)는 collector M1에서 애초에 레지스트리에
  #   편입되지 않으므로(§3.2) expected_run 게이지 자체가 그 3배치에 대해 존재하지 않아 자동으로 이
  #   룰 대상에서 제외된다 — 별도 필터 불요.
  #
  # 조건은 expected_run(cron 산출 앵커)과 last_load(완료 timestamp)를 반드시 둘 다 참조한다(REQ-XR-019
  #   HARD 필수 의미 요소) — expected_run 단독 조건은 성공/실패 무관 상시 발화(≈20h/24h) 회귀가 된다.
  #   (i) last_load < expected_run: 직전 예상 실행 슬롯이 아직 완료 stamp되지 않음
  #   (ii) time() - expected_run - run_margin > 0: 그 슬롯 + 마진이 경과함
  - name: collector-collection-gap-expected-run
    interval: 30s
    rules:
      - alert: CollectorBatchStaleExpectedRun
        expr: |
          (aaa_collector_batch_last_load_seconds < aaa_collector_batch_expected_run_seconds)
          and
          ((time() - aaa_collector_batch_expected_run_seconds - aaa_collector_batch_run_margin_seconds) > 0)
        for: 5m
        keep_firing_for: 10m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "배치 예정 실행 미완료 — {{ $labels.batch }}"
          description: "배치 {{ $labels.batch }}의 예정 실행 시각 + 허용 마진이 경과했으나 완료 기록 없음 — 실행 실패 또는 스케줄 누락."
          action: "collector 로그({{ $labels.batch }} 실행·오류) → CatchUpRunner 재실행 여부·KIS 호출 실패 확인"

  # ---------------------------------------------------------------------------
  # 그룹 XR-I: 예상 실행 데드맨 3종(SPEC-COLLECTOR-EXPECTED-RUN-001 REQ-XR-023/024/025, Module I, DP-6)
  # ---------------------------------------------------------------------------
  # [HARD ADD-only] 그룹 XR-H와 동일 원칙 — 기존 collector-watermark-deadman(그룹 W1)을 대체하지 않고
  #   구조·debounce 스타일만 미러한다. 워터마크 데드맨은 데이터 워터마크 시계열 소실을, 이 그룹은
  #   expected_run 시계열 소실을 감시하며 서로 별개·상보(§6 Exclusion 8).
  - name: collector-expected-run-deadman
    interval: 30s
    rules:
      # 총-소실(REQ-XR-023): expected_run 또는 enrolled 시계열 전체 부재.
      # for: 10m — 스크랩 staleness보다 길게 잡아 CollectorDown과의 중복 발화 억제(그룹 W1과 동일 근거).
      - alert: CollectorExpectedRunSeriesMissing
        expr: |
          absent(aaa_collector_batch_expected_run_seconds)
          or absent(aaa_collector_batch_enrolled)
        for: 10m
        labels:
          severity: critical
          component: collector
          tier: PAGE
        annotations:
          summary: "배치 실행 감시 지표 전체 소실"
          description: "배치 예정 실행 감시 지표(expected_run/enrolled)가 10분 이상 전부 사라짐 — 이 동안 모든 배치의 실행 감시가 무력화됨."
          action: "collector 컨테이너 기동 상태 → /actuator/prometheus에서 aaa_collector_batch_expected_run_seconds 노출 확인"

      # 부분-소실(REQ-XR-024): 관측 시계열 수 < 레지스트리 자기-보고 크기(enrolled).
      # [설계 개선] 워터마크 데드맨(그룹 W1)의 하드코딩 임계 17(MI-05 유지보수 함정)과 달리, 이 룰은
      #   enrolled 자기참조 비교라 레지스트리 편입/제거 시 상수 갱신이 불필요(self-updating).
      # [HARD 전제] 이 for:10m debounce의 안전성은 REQ-XR-031(부팅 시 eager 전수 등록)을 전제로 한다 —
      #   lazy 등록이면 주1회 배치가 재배포 후 시계열 부재로 이 룰을 배포마다 확정 오발시킨다(DP-6).
      - alert: CollectorExpectedRunSeriesCountLow
        expr: count(aaa_collector_batch_expected_run_seconds) < scalar(aaa_collector_batch_enrolled)
        for: 10m
        keep_firing_for: 10m
        labels:
          severity: critical
          component: collector
          tier: PAGE
        annotations:
          summary: "배치 실행 감시 지표 일부 누락 — {{ $value }}개만 노출"
          description: "감시에 등록된 배치 수(enrolled)보다 노출된 예정 실행 지표가 적은 상태가 10분 이상 지속 — 누락된 배치는 실행이 멈춰도 알림이 오지 않음."
          action: "/actuator/prometheus에서 expected_run의 batch 라벨과 등록 목록 대조 → 누락 배치 식별"

      # pair-missing(REQ-XR-025): 편입은 됐으나(expected_run 있음) last_load를 한 번도 stamp한 적 없는 배치.
      #   주 실행 신선도 룰(그룹 XR-H)은 이 경우 존재하지 않는 시계열 비교로 빈 벡터를 산출해 침묵하므로
      #   (PromQL: 부재 시계열 비교는 참이 아니라 무결과) 별도 데드맨이 필요하다.
      # for: 26h — REQ-XR-018 warm-start 범위 확장(news 2종·split·extended-hours 배선)과 동반해, 부팅~
      #   첫 성공 실행 전의 정당한 빈-창이 오발로 이어지지 않도록 함.
      - alert: CollectorExpectedRunPairMissing
        expr: aaa_collector_batch_expected_run_seconds unless on(batch) aaa_collector_batch_last_load_seconds
        for: 26h
        keep_firing_for: 10m
        labels:
          severity: warning
          component: collector
          tier: TICKET
        annotations:
          summary: "배치 첫 실행 기록 없음 — {{ $labels.batch }}"
          description: "배치 {{ $labels.batch }}의 감시 등록 후 26시간 동안 완료 기록이 한 번도 없음 — 신규 배치의 스케줄 미배선 또는 첫 실행 실패."
          action: "collector 로그({{ $labels.batch }} 스케줄 등록·실행) → 스케줄러 배선·cron 확인"

  # ---------------------------------------------------------------------------
  # 그룹: victorialogs 생존 — 게이트 무관 (SPEC-OBSV-VLOGS-HEALTH-001)
  # ---------------------------------------------------------------------------
  - name: victorialogs-liveness
    # 평가 주기: 스크랩 30s와 정합
    interval: 30s
    rules:
      # VictorialogsDown: 연속 스크랩 실패(30s×3=90s). job="victorialogs"는
      # scrape.yml의 job_name: victorialogs와 일치 필수.
      - alert: VictorialogsDown
        expr: up{job="victorialogs"} == 0
        for: 90s
        labels:
          severity: critical
          component: victorialogs
          tier: TICKET
        annotations:
          summary: "victorialogs 스크랩 실패(다운) — 90s 연속"
          description: "VictoriaMetrics가 victorialogs /metrics 스크랩에 90s(30s×3) 연속 실패. 게이트 무관 발화."
          action: "ssh nas-ugreen \"docker ps -a | grep victorialogs\" → 컨테이너 기동·재시작 상태 확인. 이상 시 \"docker logs aaa-vector\"로 적재 공백(victorialogs 연결 실패 에러) 확인"
