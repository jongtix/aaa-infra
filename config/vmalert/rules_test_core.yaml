# =============================================================================
# vmalert 룰 유닛테스트 — 코어 — 프로세스 생존(CollectorDown)·배치 신선도(BatchStale)
#   + Module E 실행 신선도 라벨(REQ-WM-024) + 예상 실행 앵커(XR-H/XR-I, EXPECTED-RUN-001 M2)
# SPEC-COLLECTOR-OBSV-001 TI-009(AC-7/8/13) / SPEC-OBSV-WATERMARK-001 / SPEC-COLLECTOR-EXPECTED-RUN-001
#
# [SPEC-OBSV-WATERMARK-001 AC-1] CollectorBatchCompletenessLow(그룹2)는 REQ-WM-023으로 rules.yml에서
#   완전히 제거됐다. 제거된 룰의 무발화는 alert 블록의 물리적 부재로 구조적으로 보장된다(테스트 불가·불요).
# [장주기 분리] GateStale/GateUnset(26h 임계·for)·PairMissing(for: 26h) 케이스(구 T8~T11,
#   TI-XR-I-005/006)는 음수 anchor로 압축 불가(>0 가드·for 지속시간) — 10m 그리드 전용 샤드
#   rules_test_core_slow.yaml로 이동(2026-07-13).
# =============================================================================
# 실행(전체): ./run-unittests.sh          — 파일별 docker 병렬 실행(권장)
#   또는: vmalert-tool unittest --files='/rules/rules_test_*.yaml'  (순차, CWD=config/vmalert 마운트)
# 실행(이 파일만): docker run --rm -v "$PWD":/rules victoriametrics/vmalert-tool:v1.145.0 \
#     unittest --files=/rules/rules_test_core.yaml
# rule_files 는 본 파일 기준 상대경로(rules.yml = 같은 디렉토리).
#
# [시간 모델 — 음수 anchor] unittest의 time()은 eval_time(초, 0=epoch 기준)과 동일.
#   `time() - x > 임계` 형태의 신선도 룰은 eval_time을 임계까지 감는 대신 anchor를
#   -(임계+마진)으로 두고 for: 충족분(10m)만 시뮬레이션한다(스텝 20개).
#   `+0xN` = 동일값 N+1개(30s 간격). 시리즈 길이는 eval_time 이상이어야 한다.
# [REQ-WM-025] 모든 alert에 tier(PAGE|TICKET) 라벨이 부여되므로 exp_labels에 tier를 명시한다
#   (누락 시 vmalert-tool이 라벨 불일치로 FAILED 처리).
# =============================================================================

rule_files:
  - rules.yml

evaluation_interval: 30s

tests:
  # ===========================================================================
  # 룰 1: CollectorDown — 게이트 무관
  # ===========================================================================
  # T1. up==0 지속 → 90s for 충족 후 발화. market_open 시계열을 의도적으로 넣지 않아
  #     "게이트 무관 발화(휴장에도 down은 뜬다)"를 입증한다.
  - interval: 30s
    input_series:
      - series: 'up{job="collector"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 120s
        groupname: collector-liveness
        alertname: CollectorDown
        exp_alerts:
          - exp_labels:
              severity: critical
              component: collector
              job: collector
              tier: PAGE
            exp_annotations:
              summary: "collector 스크랩 실패(다운) — 90s 연속"
              description: "VictoriaMetrics가 collector /actuator/prometheus 스크랩에 90s(30s×3) 연속 실패. 게이트 무관 발화."
              action: "ssh nas-ugreen \"docker ps -a | grep collector\" → 컨테이너 기동·재시작 상태와 collector 파일 로그 확인"

  # T2. up==1(정상) → 미발화.
  - interval: 30s
    input_series:
      - series: 'up{job="collector"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 120s
        groupname: collector-liveness
        alertname: CollectorDown
        exp_alerts: []

  # ===========================================================================
  # 룰 2: CollectorBatchStale(그룹2, 28h) — 장중 게이트 ANDing(휴장 억제)
  # [SPEC-OBSV-WATERMARK-001 REQ-WM-023] CollectorBatchCompletenessLow는 완전 제거됨(AC-1, 상단 주석).
  # ===========================================================================
  # anchor=-105000 → t=0 staleness=105000s > 28h(100800s). for:5m → eval_time=10m 발화.

  # T6. last_load=-105000(>28h stale) + market_open==1 → 발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="news"}'
        values: '-105000+0x30'
      - series: 'aaa_collector_market_open'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 10m
        groupname: collector-collection-gap
        alertname: CollectorBatchStale
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
              batch: news
              tier: TICKET
            exp_annotations:
              summary: "일일 배치 수집 중단 — news 28시간 초과 미적재"
              description: "일 1회 배치 news의 마지막 적재 후 28시간 초과 경과 — 새 데이터 유입 중단. 장중에만 판정하며 휴장 시 억제됨."
              action: "collector 로그(news 실행 오류) → KIS 호출 실패·스케줄 누락 확인"

  # T7. 동일 갭이지만 market_open==0(휴장) → 억제(미발화).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="news"}'
        values: '-105000+0x30'
      - series: 'aaa_collector_market_open'
        values: '0+0x30'
    alert_rule_test:
      - eval_time: 10m
        groupname: collector-collection-gap
        alertname: CollectorBatchStale
        exp_alerts: []

  # T-EX-1. [REQ-WM-024 신규 제외] batch=domestic-supply-investor(series=investor-trend 대응)가
  #     ACTIVE 워터마크 신선도로 전환되어 그룹2 기본 28h 룰에서 제외됨 — stale>28h+market_open==1
  #     이어도 그룹2에서는 미발화(워터마크 신선도 그룹이 대신 커버).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="domestic-supply-investor"}'
        values: '-105000+0x30'
      - series: 'aaa_collector_market_open'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 10m
        groupname: collector-collection-gap
        alertname: CollectorBatchStale
        exp_alerts: []

  # ===========================================================================
  # 룰 4/5: CollectorGateStale/CollectorGateUnset — rules_test_core_slow.yaml로 이동
  # (구 T8~T11. GateStale은 `>0` 가드로 음수 anchor 불가, GateUnset은 for: 26h — 둘 다
  #  26h+ 실시간 시뮬레이션이 필요해 10m 그리드 전용 샤드에서 검증)
  # ===========================================================================

  # ===========================================================================
  # SPEC-OBSV-WATERMARK-001 REQ-WM-024 — 신규 Module E 실행 신선도 라벨 유닛테스트
  # ===========================================================================
  # anchor=-4000 → t=0 staleness=4000s > 1h(3600s).

  # TI-WM-E-001. [발화] overseas-news stale>1h AND us_market_open==1 AND holiday_count>=20 → 발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="overseas-news"}'
        values: '-4000+0x30'
      - series: 'aaa_collector_us_market_open'
        values: '1+0x30'
      - series: 'aaa_collector_us_market_gate_holiday_count'
        values: '25+0x30'
    alert_rule_test:
      - eval_time: 10m
        groupname: collector-collection-gap-overseas-news
        alertname: CollectorBatchStale
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
              batch: overseas-news
              tier: TICKET
            exp_annotations:
              summary: "해외 뉴스 수집 중단 — 1시간 초과"
              description: "미국장 세션 중 10분 주기 해외 뉴스 수집이 1시간 이상 중단. 미장 마감 중엔 억제됨."
              action: "collector 로그(overseas-news 오류) → KIS 해외 뉴스 API 응답·키 상태 확인"

  # TI-WM-E-002. [무발화] overseas-news stale>1h 이지만 us_market_open==0(장외) → 억제.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="overseas-news"}'
        values: '-4000+0x30'
      - series: 'aaa_collector_us_market_open'
        values: '0+0x30'
      - series: 'aaa_collector_us_market_gate_holiday_count'
        values: '25+0x30'
    alert_rule_test:
      - eval_time: 10m
        groupname: collector-collection-gap-overseas-news
        alertname: CollectorBatchStale
        exp_alerts: []

  # ===========================================================================
  # [REMOVED 2026-07-12, SPEC-COLLECTOR-EXPECTED-RUN-001 REQ-XR-022/027] TI-WM-E-003~006
  # (collector-collection-gap-nogate-100h/-28h, extended-hours/overseas-rights/corp-code/
  # dart-backfill)을 삭제 — 대상 배치는 collector-collection-gap-expected-run이 대체.
  # ===========================================================================

  # ===========================================================================
  # 룰 XR-H: collector-collection-gap-expected-run — REQ-XR-019 (SPEC-COLLECTOR-EXPECTED-RUN-001 M2)
  # ===========================================================================
  # [2026-07-12 REQ-XR-022 컷오버 완료] 신규 그룹이 구 그룹5/6/9b/9c 및 그룹2의 게이트-레거시
  # 3배치+watchlist-sync-krx 해당분을 대체 완료(§8.1/§8.2 확인). 조건은 (i) last_load < expected_run
  # 와 (ii) time()-expected_run-run_margin > 0 를 동시에 요구한다.
  # 음수 anchor: expected_run=-10000, margin=3600 → (ii) t+10000-3600>0 이 t=0부터 참.
  # (i)는 last_load와 expected_run의 대소 비교뿐이라 음수끼리로 재현.

  # TI-XR-H-001. [발화] last_load(-20000) < expected_run(-10000) + (ii) t=0부터 참 → for:5m 후 발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="overseas-daily"}'
        values: '-20000+0x30'
      - series: 'aaa_collector_batch_expected_run_seconds{batch="overseas-daily"}'
        values: '-10000+0x30'
      - series: 'aaa_collector_batch_run_margin_seconds{batch="overseas-daily"}'
        values: '3600+0x30'
    alert_rule_test:
      - eval_time: 10m
        groupname: collector-collection-gap-expected-run
        alertname: CollectorBatchStaleExpectedRun
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
              batch: overseas-daily
              tier: TICKET
            exp_annotations:
              summary: "배치 예정 실행 미완료 — overseas-daily"
              description: "배치 overseas-daily의 예정 실행 시각 + 허용 마진이 경과했으나 완료 기록 없음 — 실행 실패 또는 스케줄 누락."
              action: "collector 로그(overseas-daily 실행·오류) → CatchUpRunner 재실행 여부·KIS 호출 실패 확인"

  # TI-XR-H-002. [무발화] last_load(-5000) >= expected_run(-10000) → (i) 거짓 → 미발화(직전 슬롯 성공 완료).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="overseas-daily"}'
        values: '-5000+0x30'
      - series: 'aaa_collector_batch_expected_run_seconds{batch="overseas-daily"}'
        values: '-10000+0x30'
      - series: 'aaa_collector_batch_run_margin_seconds{batch="overseas-daily"}'
        values: '3600+0x30'
    alert_rule_test:
      - eval_time: 10m
        groupname: collector-collection-gap-expected-run
        alertname: CollectorBatchStaleExpectedRun
        exp_alerts: []

  # TI-XR-H-003. [무발화] last_load(-30000) < expected_run(20000)로 (i) 참이나, 슬롯+마진 미경과
  #   (eval 10m=600s → 600-20000-3600<0) → (ii) 거짓 → 미발화(마진 유예 구간).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="overseas-daily"}'
        values: '-30000+0x30'
      - series: 'aaa_collector_batch_expected_run_seconds{batch="overseas-daily"}'
        values: '20000+0x30'
      - series: 'aaa_collector_batch_run_margin_seconds{batch="overseas-daily"}'
        values: '3600+0x30'
    alert_rule_test:
      - eval_time: 10m
        groupname: collector-collection-gap-expected-run
        alertname: CollectorBatchStaleExpectedRun
        exp_alerts: []

  # ===========================================================================
  # 룰 XR-I: collector-expected-run-deadman — REQ-XR-023/024/025 (Module I, DP-6)
  # (pair-missing 2건(구 TI-XR-I-005/006)은 for: 26h — rules_test_core_slow.yaml로 이동)
  # ===========================================================================

  # TI-XR-I-001. [발화, 총-소실] expected_run 시계열 전체 부재(enrolled만 존재) → 10m 후 발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_enrolled'
        values: '20+0x21'
    alert_rule_test:
      - eval_time: 10m30s
        groupname: collector-expected-run-deadman
        alertname: CollectorExpectedRunSeriesMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              component: collector
              tier: PAGE
            exp_annotations:
              summary: "배치 실행 감시 지표 전체 소실"
              description: "배치 예정 실행 감시 지표(expected_run/enrolled)가 10분 이상 전부 사라짐 — 이 동안 모든 배치의 실행 감시가 무력화됨."
              action: "collector 컨테이너 기동 상태 → /actuator/prometheus에서 aaa_collector_batch_expected_run_seconds 노출 확인"

  # TI-XR-I-002. [무발화, 총-소실] 둘 다 존재 → 미발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_expected_run_seconds{batch="overseas-daily"}'
        values: '1000+0x21'
      - series: 'aaa_collector_batch_enrolled'
        values: '20+0x21'
    alert_rule_test:
      - eval_time: 10m30s
        groupname: collector-expected-run-deadman
        alertname: CollectorExpectedRunSeriesMissing
        exp_alerts: []

  # TI-XR-I-003. [발화, 부분-소실] expected_run 3개 시계열만 노출 + enrolled=5 → count(3)<5 → 발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_expected_run_seconds{batch="overseas-daily"}'
        values: '1000+0x21'
      - series: 'aaa_collector_batch_expected_run_seconds{batch="overseas-split"}'
        values: '1000+0x21'
      - series: 'aaa_collector_batch_expected_run_seconds{batch="overseas-rights"}'
        values: '1000+0x21'
      - series: 'aaa_collector_batch_enrolled'
        values: '5+0x21'
    alert_rule_test:
      - eval_time: 10m30s
        groupname: collector-expected-run-deadman
        alertname: CollectorExpectedRunSeriesCountLow
        exp_alerts:
          - exp_labels:
              severity: critical
              component: collector
              tier: PAGE
            exp_annotations:
              summary: "배치 실행 감시 지표 일부 누락 — 3개만 노출"
              description: "감시에 등록된 배치 수(enrolled)보다 노출된 예정 실행 지표가 적은 상태가 10분 이상 지속 — 누락된 배치는 실행이 멈춰도 알림이 오지 않음."
              action: "/actuator/prometheus에서 expected_run의 batch 라벨과 등록 목록 대조 → 누락 배치 식별"

  # TI-XR-I-004. [무발화, 부분-소실] expected_run 3개 시계열 == enrolled(3) → count==enrolled → 미발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_expected_run_seconds{batch="overseas-daily"}'
        values: '1000+0x21'
      - series: 'aaa_collector_batch_expected_run_seconds{batch="overseas-split"}'
        values: '1000+0x21'
      - series: 'aaa_collector_batch_expected_run_seconds{batch="overseas-rights"}'
        values: '1000+0x21'
      - series: 'aaa_collector_batch_enrolled'
        values: '3+0x21'
    alert_rule_test:
      - eval_time: 10m30s
        groupname: collector-expected-run-deadman
        alertname: CollectorExpectedRunSeriesCountLow
        exp_alerts: []
