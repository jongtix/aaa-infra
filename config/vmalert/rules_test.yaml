              fstype: ext4
              tier: TICKET
            exp_annotations:
              summary: "디스크 사용률 경고(2단계) — /volume1 > 80%"
              description: "/volume1 사용률 85% > 80%. 5분 지속."

  # TI-NODE-004. [디스크] NodeDiskCritical 발화 — /volume1 95%(avail=5) > 90%, 3m (AC-3a / REQ-NE-007)
  - interval: 60s
    input_series:
