  # TI-WM-TICK-002. [무발화] 국내 휴장(market_open==0) → 미발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_market_open'
        values: '0+0x5'
      - series: 'aaa_collector_tick_active_subscriptions'
        values: '5+0x5'
    alert_rule_test:
      - eval_time: 90s
        groupname: collector-tick-silence
        alertname: CollectorTickSilentDomestic
        exp_alerts: []

  # TI-WM-TICK-003. [무발화] 국내 틱이 지속 수신 중(last_seen이 time()과 함께 전진) → 미발화.
  # last_seen 값이 30초 간격으로 함께 전진 → time()-max(last_seen) 항상 작게 유지(diff<300).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_market_open'
        values: '1+0x21'
      - series: 'aaa_collector_tick_active_subscriptions'
        values: '5+0x21'
      - series: 'aaa_collector_tick_last_seen_seconds{symbol="005930",market="domestic"}'
        values: '0+30x21'
    alert_rule_test:
      - eval_time: 10m
        groupname: collector-tick-silence
        alertname: CollectorTickSilentDomestic
        exp_alerts: []

  # TI-WM-TICK-004. [발화, PAGE] US 세션 중(holiday_count>=20 가드 통과)인데 해외 틱 시계열 부재(absent)
