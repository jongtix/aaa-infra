# =============================================================================
# vmalert 룰 유닛테스트 — TI-009 룰 실발화 결정적 검증 (promtool test rules 호환)
# SPEC-COLLECTOR-OBSV-001 TI-009
# =============================================================================
# 실행: vmalert-tool unittest --files=rules_test.yaml  (CWD = config/vmalert/)
#   rule_files 는 본 파일 기준 상대경로(rules.yml = 같은 디렉토리).
#
# 검증 목표(AC-7/8/13):
#   1. CollectorDown      — 게이트 무관 발화(market_open 시계열 부재에도 발화)
#   2. CompletenessLow    — 장중(market_open==1) 발화 / 휴장(==0)·게이트부재(absent) 억제
#   3. BatchStale         — 장중 28h 초과 발화 / 휴장 억제
#   4. GateStale          — 30h 초과 발화 / boot-unset(==0) 제외(>0 가드)
#   5. GateUnset          — 26h 고착 발화 / 게이트 set(>0) 시 미발화
#
# [시간 모델] unittest의 time()은 eval_time(초, 0=epoch 기준)과 동일.
#   "X시간 경과"는 last_update 계열을 0으로 두고 eval_time 을 X시간보다 크게 잡아 재현한다.
#   `+0xN` = 동일값 N+1개(30s 간격). 시리즈 길이는 eval_time 이상이어야 한다.

rule_files:
  - rules.yml

evaluation_interval: 30s

tests:
  # ===========================================================================
  # 룰 1: CollectorDown — 게이트 무관
  # ===========================================================================
  # T1. up==0 지속 → 90s for 충족 후 발화. market_open 시계열을 의도적으로 넣지 않아
  #     "게이트 무관 발화(휴장에도 down은 뜬다)"를 입증한다.
  - interval: 30s
    input_series:
      - series: 'up{job="collector"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 120s
        groupname: collector-liveness
        alertname: CollectorDown
        exp_alerts:
          - exp_labels:
              severity: critical
              component: collector
              job: collector
            exp_annotations:
              summary: "collector 스크랩 실패(다운) — 90s 연속"
              description: "VictoriaMetrics가 collector /actuator/prometheus 스크랩에 90s(30s×3) 연속 실패. 게이트 무관 발화."

  # T2. up==1(정상) → 미발화.
  - interval: 30s
    input_series:
      - series: 'up{job="collector"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 120s
        groupname: collector-liveness
        alertname: CollectorDown
        exp_alerts: []

  # ===========================================================================
  # 룰 2: CollectorBatchCompletenessLow — 장중 게이트 ANDing(휴장 억제)
  # ===========================================================================
  # T3. ratio<0.70 AND market_open==1 → 발화(batch 라벨 보존).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_completeness_ratio{batch="news"}'
        values: '0.5+0x20'
      - series: 'aaa_collector_market_open'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 6m
        groupname: collector-collection-gap
        alertname: CollectorBatchCompletenessLow
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
              batch: news
            exp_annotations:
              summary: "배치 충족률 미달 — news < 70%"
              description: "장중(market_open==1) 배치 news 충족률 0.5 < 0.70. 휴장 시 억제됨."

  # T4. [핵심] ratio<0.70 이지만 market_open==0(휴장) → 억제(미발화).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_completeness_ratio{batch="news"}'
        values: '0.5+0x20'
      - series: 'aaa_collector_market_open'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 6m
        groupname: collector-collection-gap
        alertname: CollectorBatchCompletenessLow
        exp_alerts: []

  # T5. [핵심] ratio<0.70 이지만 market_open 시계열 부재(absent) → 억제(미발화).
  #     `and on() (market_open==1)`이 빈 벡터가 되어 게이트 부재 시 구조적 억제(REQ-043).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_completeness_ratio{batch="news"}'
        values: '0.5+0x20'
    alert_rule_test:
      - eval_time: 6m
        groupname: collector-collection-gap
        alertname: CollectorBatchCompletenessLow
        exp_alerts: []

  # ===========================================================================
  # 룰 3: CollectorBatchStale — 장중 28h 초과 갭(휴장 억제)
  # ===========================================================================
  # T6. last_load=0 + market_open==1 + eval 29h → (time-0)>28h 성립 → 발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="news"}'
        values: '0+0x3540'
      - series: 'aaa_collector_market_open'
        values: '1+0x3540'
    alert_rule_test:
      - eval_time: 29h
        groupname: collector-collection-gap
        alertname: CollectorBatchStale
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
              batch: news
            exp_annotations:
              summary: "배치 신선도 갭 — news > 28h 미적재"
              description: "장중(market_open==1) 배치 news 마지막 적재 후 28h 초과 경과. 휴장 시 억제됨."

  # T7. 동일 갭이지만 market_open==0(휴장) → 억제(미발화).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="news"}'
        values: '0+0x3540'
      - series: 'aaa_collector_market_open'
        values: '0+0x3540'
    alert_rule_test:
      - eval_time: 29h
        groupname: collector-collection-gap
        alertname: CollectorBatchStale
        exp_alerts: []

  # ===========================================================================
  # 룰 4: CollectorGateStale — 30h 초과 미갱신(boot-unset 제외)
  # ===========================================================================
  # T8. gate=1000(>0) + eval 31h → (time-1000)>30h 성립 AND >0 가드 통과 → 발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_market_gate_last_update_seconds'
        values: '1000+0x3780'
    alert_rule_test:
      - eval_time: 31h
        groupname: collector-gate-health
        alertname: CollectorGateStale
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
            exp_annotations:
              summary: "시장 세션 게이트 stale — 30h 초과 미갱신"
              description: "collector UP이나 게이트 last-update가 30h 초과 미갱신(cron 침묵 실패 포함). 억제·다운과 독립 발화."

  # T9. [핵심] gate=0(boot-unset) + eval 31h → (time-0)>30h 이지만 `>0` 가드로 GateStale 미발화.
  #     boot-unset 은 GateUnset 룰(26h)이 전담 — GateStale 오발 방지(분리 설계 입증).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_market_gate_last_update_seconds'
        values: '0+0x3780'
    alert_rule_test:
      - eval_time: 31h
        groupname: collector-gate-health
        alertname: CollectorGateStale
        exp_alerts: []

  # ===========================================================================
  # 룰 5: CollectorGateUnset — 부팅 후 26h 고착
  # ===========================================================================
  # T10. gate==0 지속 + eval 26h5m → for:26h 충족 → 발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_market_gate_last_update_seconds'
        values: '0+0x3180'
    alert_rule_test:
      - eval_time: 26h5m
        groupname: collector-gate-health
        alertname: CollectorGateUnset
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
            exp_annotations:
              summary: "시장 세션 게이트 미설정 고착 — 부팅 후 26h 미갱신"
              description: "게이트 last-update가 부팅 후 26h(>1 cron 사이클) 동안 0 유지. 부팅 직후 오발 방지용 26h for 적용."

  # T11. gate=1000(set) → 미발화(부팅 직후/정상 게이트는 오발하지 않음).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_market_gate_last_update_seconds'
        values: '1000+0x3180'
    alert_rule_test:
      - eval_time: 26h5m
        groupname: collector-gate-health
        alertname: CollectorGateUnset
        exp_alerts: []

  # ===========================================================================
  # 룰 6: CollectorWebSocketNoSubscription — 장중 틱 구독 무음 탐지
  # SPEC-OBSV-WEBSOCKET-001 TI-WS-001/002/003/004
  # ===========================================================================

  # TI-WS-001. [발화] tick_active_subscriptions==0 AND market_open==1 → 3m 이상 → firing.
  # 장 개시 후 3m5s 평가: subscriptions=0 유지, market_open=1 유지 → for:3m 충족.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_tick_active_subscriptions'
        values: '0+0x20'
      - series: 'aaa_collector_market_open'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 3m30s
        groupname: collector-websocket
        alertname: CollectorWebSocketNoSubscription
        exp_alerts:
          - exp_labels:
              severity: critical
              component: collector
            exp_annotations:
              summary: "국내 WebSocket 구독 종목 0 — 틱 수집 완전 중단"
              description: "장중(market_open==1)에 tick_active_subscriptions가 3분 이상 0. WebSocket 장 개시 실패 또는 전체 구독 해제 의심."

  # TI-WS-002. [휴장 억제] subscriptions==0 이지만 market_open==0(장외/휴장) → 미발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_tick_active_subscriptions'
        values: '0+0x20'
      - series: 'aaa_collector_market_open'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 3m30s
        groupname: collector-websocket
        alertname: CollectorWebSocketNoSubscription
        exp_alerts: []

  # TI-WS-003. [장 개시 엣지 오발 방지] market_open 전환 후 3m 이내 subscriptions 회복 → 미발화.
  # 0~2m: subscriptions=0, 2m~: subscriptions=10(정상 연결) — for:3m 미충족.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_tick_active_subscriptions'
        values: '0 0 0 0 10 10 10 10 10 10'
      - series: 'aaa_collector_market_open'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 3m30s
        groupname: collector-websocket
        alertname: CollectorWebSocketNoSubscription
        exp_alerts: []

  # TI-WS-004. [absent 억제] tick_active_subscriptions 시계열 부재 → 미발화(REQ-003).
  # market_open==1 이지만 subscriptions 시계열 자체가 없으면 expr이 빈 벡터 → 구조적 억제.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_market_open'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 3m30s
        groupname: collector-websocket
        alertname: CollectorWebSocketNoSubscription
        exp_alerts: []

  # ===========================================================================
  # 룰 13: collector-websocket — CollectorWebSocketSessionDisconnected
  # SPEC-OBSV-WS-SESSION-001 TI-WS-005~011
  # ===========================================================================
  # 세션별(alias) partial failure 감지. for:5m + 장중 게이트.
  # 시리즈 길이: 5m30s = 330s → N = 330/30 = 11 steps (여유 포함 15)

  # TI-WS-005. [발화] session_connected==0 AND market_open==1 → 5m 지속 → firing.
  # alias 라벨이 발화 알림에 보존되는지 확인(REQ-004).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_websocket_session_connected{alias="stock"}'
        values: '0+0x15'
      - series: 'aaa_collector_market_open'
        values: '1+0x15'
    alert_rule_test:
      - eval_time: 5m30s
        groupname: collector-websocket
        alertname: CollectorWebSocketSessionDisconnected
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
              alias: stock
            exp_annotations:
              summary: "WebSocket 세션 연결 끊김 — stock"
              description: "장중(market_open==1) alias=stock 세션이 5분 이상 disconnected 상태. partial failure 의심."

  # TI-WS-006. [장외 억제] session_connected==0 이지만 market_open==0(장외/휴장) → 미발화(REQ-002).
  - interval: 30s
    input_series:
      - series: 'aaa_collector_websocket_session_connected{alias="stock"}'
        values: '0+0x15'
      - series: 'aaa_collector_market_open'
        values: '0+0x15'
    alert_rule_test:
      - eval_time: 5m30s
        groupname: collector-websocket
        alertname: CollectorWebSocketSessionDisconnected
        exp_alerts: []

  # TI-WS-007. [absent 억제] session_connected 시계열 부재 + market_open==1 → 미발화(REQ-003).
  #     expr이 빈 벡터 → 구조적 억제.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_market_open'
        values: '1+0x15'
    alert_rule_test:
      - eval_time: 5m30s
        groupname: collector-websocket
        alertname: CollectorWebSocketSessionDisconnected
        exp_alerts: []

  # TI-WS-008. [정상 미발화] session_connected==1(연결 중) + market_open==1 → 미발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_websocket_session_connected{alias="stock"}'
        values: '1+0x15'
      - series: 'aaa_collector_market_open'
        values: '1+0x15'
    alert_rule_test:
      - eval_time: 5m30s
        groupname: collector-websocket
        alertname: CollectorWebSocketSessionDisconnected
        exp_alerts: []

  # TI-WS-009. [partial failure 핵심] stock=0, dc=1, market_open==1 → stock만 발화, dc 미발화.
  #     SPEC의 존재 이유: NoSubscription과 달리 특정 alias만 끊긴 partial failure 감지.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_websocket_session_connected{alias="stock"}'
        values: '0+0x15'
      - series: 'aaa_collector_websocket_session_connected{alias="dc"}'
        values: '1+0x15'
      - series: 'aaa_collector_market_open'
        values: '1+0x15'
    alert_rule_test:
      - eval_time: 5m30s
        groupname: collector-websocket
        alertname: CollectorWebSocketSessionDisconnected
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
              alias: stock
            exp_annotations:
              summary: "WebSocket 세션 연결 끊김 — stock"
              description: "장중(market_open==1) alias=stock 세션이 5분 이상 disconnected 상태. partial failure 의심."

  # TI-WS-010. [alias별 독립 발화 — REQ-004] stock=0, dc=0, market_open==1 → 두 개의 독립 알림.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_websocket_session_connected{alias="stock"}'
        values: '0+0x15'
      - series: 'aaa_collector_websocket_session_connected{alias="dc"}'
        values: '0+0x15'
      - series: 'aaa_collector_market_open'
        values: '1+0x15'
    alert_rule_test:
      - eval_time: 5m30s
        groupname: collector-websocket
        alertname: CollectorWebSocketSessionDisconnected
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
              alias: stock
            exp_annotations:
              summary: "WebSocket 세션 연결 끊김 — stock"
              description: "장중(market_open==1) alias=stock 세션이 5분 이상 disconnected 상태. partial failure 의심."
          - exp_labels:
              severity: warning
              component: collector
              alias: dc
            exp_annotations:
              summary: "WebSocket 세션 연결 끊김 — dc"
              description: "장중(market_open==1) alias=dc 세션이 5분 이상 disconnected 상태. partial failure 의심."

  # TI-WS-011. [for:5m 미만 억제] 연결 끊김이 4m30s 시점에서 아직 for:5m 미충족 → 미발화.
  #     for:5m 설정값 정확성 검증. 만약 for 값이 잘못됐다면 이 케이스에서 실패한다.
  # 4m30s = 270s → 시리즈 N = 270/30 = 9 steps
  - interval: 30s
    input_series:
      - series: 'aaa_collector_websocket_session_connected{alias="stock"}'
        values: '0+0x9'
      - series: 'aaa_collector_market_open'
        values: '1+0x9'
    alert_rule_test:
      - eval_time: 4m30s
        groupname: collector-websocket
        alertname: CollectorWebSocketSessionDisconnected
        exp_alerts: []

  # ===========================================================================
  # SPEC-OBSV-BATCH-COVERAGE-001 — 신규 배치 모니터링 사각 해소
  # ===========================================================================
  # 시간 모델: last_load_seconds=0 이면 time()-0=eval_time → "eval_time 만큼 경과"를 재현.
  # 시리즈 길이: eval_time(초)/30(s 간격) + for:5m(=10 steps) 이상이어야 한다.

  # ===========================================================================
  # 룰 7: collector-collection-gap — 기존 28h 룰 batch 필터 검증
  # SPEC-OBSV-BATCH-COVERAGE-001 AC-2 / REQ-003 / REQ-004
  # ===========================================================================

  # T12. [발화] domestic-invest-opinion completeness<0.70 AND market_open==1 → 발화.
  #      신규 batch 라벨이 기존 28h+completeness 룰에서 정상 발화되는지 확인.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_completeness_ratio{batch="domestic-invest-opinion"}'
        values: '0.5+0x20'
      - series: 'aaa_collector_market_open'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 6m
        groupname: collector-collection-gap
        alertname: CollectorBatchCompletenessLow
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
              batch: domestic-invest-opinion
            exp_annotations:
              summary: "배치 충족률 미달 — domestic-invest-opinion < 70%"
              description: "장중(market_open==1) 배치 domestic-invest-opinion 충족률 0.5 < 0.70. 휴장 시 억제됨."

  # T13. [발화] watchlist-sync-krx stale>28h AND market_open==1 → 발화.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="watchlist-sync-krx"}'
        values: '0+0x3500'
      - series: 'aaa_collector_market_open'
        values: '1+0x3500'
    alert_rule_test:
      - eval_time: 29h
        groupname: collector-collection-gap
        alertname: CollectorBatchStale
        exp_alerts:
          - exp_labels:
              severity: warning
              component: collector
              batch: watchlist-sync-krx
            exp_annotations:
              summary: "배치 신선도 갭 — watchlist-sync-krx > 28h 미적재"
              description: "장중(market_open==1) 배치 watchlist-sync-krx 마지막 적재 후 28h 초과 경과. 휴장 시 억제됨."

  # T14. [배치 필터 검증] overseas-daily stale>28h + market_open==1 이지만
  #      batch 필터(batch!~"overseas-.*") 로 collector-collection-gap에서 미발화.
  #      overseas-daily는 100h 룰(그룹 5)이 전담 — 28h 룰은 오발하지 않아야 함.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_last_load_seconds{batch="overseas-daily"}'
        values: '0+0x3500'
      - series: 'aaa_collector_market_open'
        values: '1+0x3500'
    alert_rule_test:
      - eval_time: 29h
        groupname: collector-collection-gap
        alertname: CollectorBatchStale
        exp_alerts: []

  # T15. [배치 필터 검증] domestic-financial-ratio completeness<0.70 → completeness 룰 미발화.
  #      주배치는 stale-only, completeness 비적용(§3.3) — batch 필터로 오발 방지.
  - interval: 30s
    input_series:
      - series: 'aaa_collector_batch_completeness_ratio{batch="domestic-financial-ratio"}'
        values: '0.5+0x20'
      - series: 'aaa_collector_market_open'
        values: '1+0x20'
    alert_rule_test:
