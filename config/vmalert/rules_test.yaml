  # ====================================================================
  # SPEC-OBSV-SYSALERT-001: collector-safemode 룰 유닛테스트
  # ===========================================================================
  # 검증 목표:
  #   TI-SAFEMODE-001: CollectorSafeModeEntered — enter_total increase>0 → 즉시 발화
  #   TI-SAFEMODE-002: CollectorSafeModeExited  — exit_total  increase>0 → 즉시 발화
  #   TI-SAFEMODE-003: [미발화] enter_total 변화 없음(increase==0) → 미발화
  #
  # [시간 모델] increase(metric[5m])를 발화시키려면:
  #   eval_time 기준 [eval_time-5m, eval_time] 범위 내 counter 증가가 필요하다.
  #   - values: '0+0x10 1+0x5' = t=0..300s: 0, t=330..480s: 1
  #   - eval_time=330s → range [30s,330s] 내 0→1 증가 → increase=1 > 0 → 발화
  #   - for: 0m 이므로 조건 충족 즉시 발화 (pending 없음)
  # ===========================================================================

  # TI-SAFEMODE-001. [발화] enter_total 5분 내 증가 → CollectorSafeModeEntered 발화
  - interval: 30s
    input_series:
      - series: 'aaa_collector_safe_mode_enter_total{module="token",alias="isa"}'
        values: '0+0x10 1+0x5'
    alert_rule_test:
      - eval_time: 330s
        groupname: collector-safemode
        alertname: CollectorSafeModeEntered
        exp_alerts:
          - exp_labels:
              severity: critical
              component: collector
              module: token
              alias: isa
            exp_annotations:
              summary: "수집기 안전 모드 진입 — token/isa"
              description: "5분 내 안전 모드 진입 감지. 원인 확인 → 수동 해제 필요 (TECHSPEC §1.3 수동 개입 절차 참조)."

  # TI-SAFEMODE-002. [발화] exit_total 5분 내 증가 → CollectorSafeModeExited 발화
  - interval: 30s
    input_series:
      - series: 'aaa_collector_safe_mode_exit_total{module="ws",alias="key1"}'
        values: '0+0x10 1+0x5'
    alert_rule_test:
      - eval_time: 330s
        groupname: collector-safemode
        alertname: CollectorSafeModeExited
        exp_alerts:
          - exp_labels:
              severity: info
              component: collector
              module: ws
              alias: key1
            exp_annotations:
              summary: "수집기 안전 모드 해제 — ws/key1"
              description: "안전 모드 해제 감지. 정상 수집 재개 여부를 확인하세요."

  # TI-SAFEMODE-003. [미발화] enter_total 변화 없음(increase==0) → 미발화
  - interval: 30s
    input_series:
      - series: 'aaa_collector_safe_mode_enter_total{module="token",alias="isa"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 330s
        groupname: collector-safemode
        alertname: CollectorSafeModeEntered
        exp_alerts: []

  # ===========================================================================
  # 룰 10: node-resource — NAS 호스트 자원(디스크·RAM·CPU) (SPEC-INFRA-NODE-001)
  # ===========================================================================
  # interval: 60s (node-resource 그룹 평가 주기).
  # 디스크 ratio: node_filesystem_size_bytes=100, node_filesystem_avail_bytes=<값>으로 사용률 재현.
  # RAM: MemTotal=100, MemAvailable=<값>. CPU: node_load5=<값>(4코어, load/4=사용률).
  # warning for:5m → eval_time 6m. critical for:2m → eval_time 3m. 미발화: 임계 직하값.

  # TI-NODE-001. [디스크] NodeDiskWarning1 발화 — /volume1 75%(avail=25) > 70%, 6m (AC-3a / REQ-NE-005)
